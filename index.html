 <div data-a="product:${p.id}" style="display:flex;gap:11px;align-items:center;flex:1;min-width:0;cursor:pointer">${th(p)}
 <div style="min-width:0;flex:1"><div class="h3">${p.brand} ${p.name}</div>
 <div class="meta" style="margin-top:1px">${p.label} · 후기 ${p.n}건 · <span class="num">${won(p.price)}</span></div></div></div>${right||''}</div>`;

/* ── 화면 ── */
const V={};

V.home=()=>{
 const CATS=['전체','프라이팬','냄비·솥','웍','칼','무쇠·주물'];
 const fit=x=>(S.cat==='전체'||x.sub===S.cat)&&(!S.brand||x.brand===S.brand);
 const g=k=>P.filter(x=>x.deal===k&&fit(x));
 const openL=g('open'),talkL=g('talking'),gathL=g('gathering'),postL=g('postponed');
 const gcard=x=>{
  const off=x.dealPrice?Math.round((1-x.dealPrice/x.price)*100):0; // 할인율 계산
  return `<div class="card" data-a="product:${x.id}" style="overflow:hidden;cursor:pointer">
  <div style="height:118px;background:${TINT[x.tint]};display:flex;align-items:center;justify-content:center;position:relative">
   <svg width="66" height="66" viewBox="0 0 64 64" fill="none" stroke="rgba(43,42,40,.42)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${GLY[x.cat]}</svg>
   ${x.deal==='open'?`<span class="badge b-amber" style="position:absolute;top:9px;left:9px">${x.endDate} 마감</span>`:''}
   ${S.waits[x.id]?`<span class="badge b-teal" style="position:absolute;top:9px;right:9px">대기 중</span>`:''}</div>
  <div style="padding:11px 12px 13px">
   <div class="tiny">${x.brand}</div>
   <div class="h3" style="font-size:12.5px;margin-top:2px;line-height:1.45">${x.name}</div>
   ${x.deal==='open'
    ?`<div style="margin-top:8px;display:flex;align-items:baseline;gap:6px">
      <span class="num" style="font-size:11px;color:#A0610F;font-weight:600">-${off}%</span>
      <span class="num" style="font-size:15px;font-weight:600;color:#A0610F;letter-spacing:-.03em">${won(x.dealPrice)}</span></div>
      <div class="num tiny" style="text-decoration:line-through;color:#A39E93">${won(x.price)}</div>`
    :`<div style="margin-top:8px"><span class="num" style="font-size:14px;font-weight:600;letter-spacing:-.02em">${won(x.price)}</span>
      <span class="tiny"> 온라인 최저가</span></div>
      <div class="tiny num" style="margin-top:3px">${x.deal==='gathering'?`${waitCount(x)} / ${x.target}명 대기`:x.deal==='talking'?'브랜드와 협상 중':'이번엔 미뤄뒀어요'}</div>`}
   <div class="meta" style="margin-top:7px;padding-top:7px;border-top:.5px solid #F0EBE0">${x.label} · 후기 ${x.n}건</div></div></div>`};
 const sec=(t,d,arr)=>arr.length?`<div class="pad sec"><div class="h2" style="margin-bottom:3px">${t}</div>
  <div class="meta" style="margin-bottom:12px">${d}</div><div class="grid">${arr.map(gcard).join('')}</div></div>`:'';
 return `<div class="bar"><div class="line">
 <button data-a="openDrawer" style="display:flex;align-items:center;gap:8px">
  <span style="display:block"><span style="display:block;width:17px;height:1.7px;background:#4A4740;border-radius:1px"></span>
  <span style="display:block;width:17px;height:1.7px;background:#4A4740;border-radius:1px;margin-top:4px"></span>
  <span style="display:block;width:12px;height:1.7px;background:#4A4740;border-radius:1px;margin-top:4px"></span></span></button>
 <div style="display:flex;align-items:center;gap:7px">${mark(22)}<span style="font-size:18px;font-weight:600;letter-spacing:-.045em">다들</span></div>
 <div style="display:flex;gap:14px"><button data-a="search">${ic('search',19)}</button><button data-a="noti">${ic('bell',19)}</button></div></div></div>
 <div class="body">

 <div class="scroller" style="padding-top:16px">${CATS.map(c=>`<span class="chip ${S.cat===c?'on':''}" data-a="cat:${c}">${c}</span>`).join('')}</div>
 ${S.brand?`<div class="pad" style="padding-top:12px"><span class="chip sel" data-a="brandSel:">${S.brand} ${ic('x',13,'#FCFAF5')}</span></div>`:''}

 ${sec('지금 사실 수 있어요','협상이 끝나 열려 있어요',openL)}
 ${sec('곧 열려요','수요를 들고 브랜드와 이야기하는 중이에요',talkL)}
 ${sec('수요가 모이는 중','목표에 닿으면 협상을 시작해요',gathL)}
 ${sec('이번엔 미뤄뒀어요','안 된 것도 남겨둘게요. 대기 등록은 그대로 있어요',postL)}

 <div class="pad sec"><div class="h2" style="margin-bottom:12px">브랜드로 보기</div>
 <div style="display:flex;gap:7px;flex-wrap:wrap">${[...new Set(P.map(x=>x.brand))].map(b=>`<span class="chip" data-a="brandSel:${b}">${b}</span>`).join('')}</div></div>

 <div class="pad sec" style="padding-bottom:26px"><div class="soft" data-a="log" style="padding:16px 17px;cursor:pointer">
 <div class="h3" style="font-size:14px;margin-bottom:6px">이번 달에 12번 이야기해서 3번 잘 됐어요</div>
 <div style="font-size:12.5px;color:#5F5B52;line-height:1.75">안 된 것도 숫자 그대로 적어둡니다. 무엇을 걸렀는지 보이지 않으면 고른 것도 못 믿으니까요.</div>
 <div style="margin-top:11px;display:flex;align-items:center;gap:5px;font-size:12.5px;color:#0F6E56;font-weight:500">협상 기록 보기 ${ic('arrow',15,'#0F6E56')}</div></div></div>
 </div>${tabs()}`};

V.reviews=()=>`
<div class="bar"><div style="display:flex;align-items:center;gap:7px;margin-bottom:12px">${mark(20)}
<span style="font-size:17px;font-weight:600;letter-spacing:-.03em">후기 모음</span><span class="meta" style="margin-left:2px">조리도구 142개</span></div>
<button data-a="search" style="background:#F1ECE0;border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:8px;width:100%">
${ic('search',17)}<span style="font-size:13px;color:#A39E93">브랜드 · 제품명 · 궁금한 점</span></button></div>
<div class="body">
 <div class="scroller" style="padding-top:16px">${['전체','프라이팬','냄비·솥','웍','칼','무쇠·주물'].map((c,i)=>`<span class="chip ${i?'':'on'}">${c}</span>`).join('')}</div>
 <div class="pad sec"><div class="row" style="margin-bottom:3px"><span class="h2">후기가 가장 많이 쌓인</span><span class="meta">더 보기</span></div>
 <div class="meta" style="margin-bottom:12px">수집한 후기 건수 순</div>
 ${[...P].sort((a,b)=>b.n-a.n).slice(0,3).map(p=>rowItem(p,bellBtn(p))).join('')}</div>
 <div class="pad sec"><div class="row" style="margin-bottom:3px"><span class="h2">문제 언급이 가장 적은</span><span class="meta">더 보기</span></div>
 <div class="meta" style="margin-bottom:12px">후기 50건 이상인 제품만 · 언급률 낮은 순</div>
 ${['p7','p4'].map(byId).map(p=>rowItem(p,bellBtn(p))).join('')}</div>
</div>${tabs()}`;

const searchHits=()=>{const k=S.q.trim();
 let h=k?P.filter(p=>(p.brand+p.name+p.sub).includes(k)||(k.includes('인덕션')&&p.induction)):P.slice();
 if(S.filters.includes('인덕션 가능'))h=h.filter(p=>p.induction);
 return h.sort((a,b)=>b.n-a.n)};

const searchResults=()=>{const h=searchHits();
 if(h.length) return `<div class="pad" style="padding-top:13px"><div class="row"><span class="meta">${h.length}개 · <span style="color:#5F5B52">후기 많은 순</span></span></div></div>
 <div class="pad" style="padding-top:12px">${h.map(p=>`<div class="card" style="padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center">
 <span data-a="pick:${p.id}" style="width:20px;height:20px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:${S.picks.includes(p.id)?'#0F6E56':'transparent'};border:${S.picks.includes(p.id)?'none':'1.5px solid #D5CFC1'}">${S.picks.includes(p.id)?ic('check',14,'#FCFAF5'):''}</span>
 <div data-a="product:${p.id}" style="display:flex;gap:10px;align-items:center;flex:1;min-width:0;cursor:pointer">${th(p,42)}
 <div style="min-width:0"><div class="h3" style="font-size:13px">${p.brand} ${p.name}</div>
 <div class="tiny" style="margin-top:1px">${p.label} · ${p.n}건 · <span class="num">${won(p.price)}</span></div></div></div></div>`).join('')}</div><div style="height:90px"></div>`;
 return `<div class="pad" style="padding-top:34px;text-align:center">
 <div style="width:56px;height:56px;border-radius:16px;background:#EDE8DC;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px">${ic('search',26,'#A39E93')}</div>
 <div class="h2">아직 못 모은 제품이에요</div>
 <div class="sub" style="margin-top:7px">다들은 후기 30건 이상 모인 제품부터 올려요.<br>요청해 주시면 다음 순서로 후기를 모아볼게요.</div></div>
 <div class="pad" style="padding-top:20px"><button class="btn teal" data-a="req">이 제품 후기 모아주세요</button></div>`;
};

V.search=()=>`
<div class="bar"><div class="line"><button data-a="back">${ic('back',20)}</button>
<div style="flex:1;background:#F1ECE0;border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:7px">${ic('search',15)}
<input id="q" class="field" style="border:0;background:none;padding:0;font-size:12.5px" placeholder="찾으시는 제품을 적어주세요" value="${S.q}"></div></div></div>
<div class="body"><div id="results">${searchResults()}</div></div>`;

V.product=id=>{const p=byId(id);const bad=p.label==='대체로 불만';const thin=p.label==='표본 부족';
 const off=p.dealPrice?Math.round((1-p.dealPrice/p.price)*100):0;
 const foot=p.deal==='open'
 ?`<div class="row" style="margin-bottom:11px"><span class="meta">지금 브랜드 협상이 열려 있어요</span>
    <span style="display:flex;align-items:baseline;gap:6px">
     <span class="num" style="font-size:12px;color:#A39E93;text-decoration:line-through">${won(p.price)}</span>
     <span class="num" style="font-size:18px;font-weight:600;color:#A0610F">${won(p.dealPrice)}</span>
     <span class="badge b-amber num">-${off}%</span>
    </span></div>
   <button class="btn amber" data-a="deal:${p.id}">협상 상세 보기</button>`
 :(bad||thin)
 ?`<div style="background:#F2EEE4;border-radius:12px;padding:13px 14px;margin-bottom:12px"><div class="h3" style="margin-bottom:5px">아직 협상 순서가 아니에요</div>
   <div class="meta" style="line-height:1.7">${thin?'후기가 더 모이면 규칙표에 따라 다시 판단해 볼게요.':'후기 평가가 낮아 협상 순서를 뒤로 두었습니다.'}</div></div>
   <button class="btn ghost" data-a="price:${p.id}">온라인 최저가 변동 알림 받기</button>`
 :`<div class="row" style="margin-bottom:11px"><span class="meta">지금 대기 중인 인원</span>
   <span class="meta num"><b style="color:#2B2A28">${waitCount(p)}명</b> · ${p.target}명이 되면 협상 시작</span></div>
   <button class="btn teal" data-a="price:${p.id}">${S.waits[p.id]?'등록하신 희망 가격 바꾸기':'이 가격이면 살게요'}</button>`;

 const INFO=`
 <div class="pad" style="padding-top:18px"><div class="card" style="padding:16px 17px">
 <div class="h3" style="font-size:14px;margin-bottom:11px">제품 정보</div>
 ${p.spec.map(([k,v],i)=>`<div class="row" style="padding:8px 0;${i?'border-top:.5px solid #F2EDE3':''}">
  <span style="font-size:12.5px;color:#7D796F">${k}</span><span style="font-size:12.5px;font-weight:500;text-align:right;max-width:62%;${v?'':'color:#B5B0A6'}">${v||'확인 중'}</span></div>`).join('')}</div></div>`;

 const REV=`
 <div class="pad" style="padding-top:18px"><div class="tiny" style="letter-spacing:.06em">다들 후기 모음</div>
 <div class="row" style="align-items:baseline;margin-top:4px"><span style="font-size:27px;font-weight:600;letter-spacing:-.035em;color:#2B2A28">${p.label}</span>
 <span class="num" style="font-size:14px;color:#7D796F">후기 ${p.n}건</span></div>
 <div class="sub" style="margin-top:8px">${thin?'아직 후기가 30건 미만이라 판단을 보류했습니다.':bad?'오래 쓰신 분들 사이에서 불만 사항이 반복되어 유의가 필요합니다.':'오래 쓰신 분들 대부분이 만족하고 계십니다.'}</div></div>
 <div class="pad" style="padding-top:16px"><div style="background:#F2EEE4;border-radius:12px;padding:14px 15px">
 <div class="row" style="font-size:13px"><span style="color:#7D796F">분석에 사용한 후기</span><span class="num" style="font-weight:600">${p.incl}건</span></div>
 <div class="row" style="font-size:13px;margin-top:7px"><span style="color:#7D796F">걸러낸 후기 (협찬/복붙 등)</span><span class="num" style="font-weight:600">${p.excl}건</span></div></div></div>`;

 return bar(p.brand,1)+`<div class="body">
 <div style="height:200px;background:${TINT[p.tint]};display:flex;align-items:center;justify-content:center;position:relative">
 <svg width="104" height="104" viewBox="0 0 64 64" fill="none" stroke="rgba(43,42,40,.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${GLY[p.cat]}</svg></div>
 <div class="pad" style="padding-top:16px">
 <div class="tiny">${p.brand} · ${p.sub}</div>
 <div style="font-size:18px;font-weight:600;letter-spacing:-.025em;margin-top:3px;line-height:1.4">${p.name}</div>
 <div style="display:flex;align-items:baseline;gap:8px;margin-top:9px">
 ${p.deal==='open'?`<span class="num" style="font-size:12px;color:#A39E93;text-decoration:line-through">${won(p.price)}</span>
  <span class="num" style="font-size:22px;font-weight:600;color:#A0610F;letter-spacing:-.03em">${won(p.dealPrice)}</span>
  <span class="badge b-amber num">-${off}%</span>`
 :`<span class="num" style="font-size:20px;font-weight:600;letter-spacing:-.03em">${won(p.price)}</span><span class="tiny">온라인 최저가</span>`}</div>
 <div class="meta" style="margin-top:8px">라벨: <b>${p.label}</b> · 모은 후기 ${p.n}건 (제외 ${p.excl}건)</div></div>
 <div style="display:flex;margin-top:14px;padding:0 18px;border-bottom:.5px solid #E7E1D4">
 <button class="ptab ${S.ptab==='info'?'on':''}" data-a="ptab:info">제품 정보</button>
 <button class="ptab ${S.ptab==='rev'?'on':''}" data-a="ptab:rev">다들 후기 모음</button></div>
 ${S.ptab==='info'?INFO:REV}
 </div>
 <div style="background:#FFFDF9;box-shadow:0 -.5px 0 #E8E2D6;padding:14px 18px 18px;flex-shrink:0">${foot}</div>`};

V.deal=id=>{const p=byId(id);const st=ladder(p);const off=Math.round((1-p.dealPrice/p.price)*100);
 return bar('다들 협상 상세',1)+`<div class="body">
 <div class="pad" style="padding-top:16px;display:flex;gap:14px">${th(p,58)}<div style="min-width:0">
 <div style="display:flex;gap:6px;margin-bottom:3px"><span class="badge b-amber">협상 완료</span></div>
 <div style="font-size:16px;font-weight:600;letter-spacing:-.02em">${p.brand} ${p.name}</div>
 <div class="meta" style="margin-top:3px">${p.endDate} 마감</div></div></div>
 <div class="pad" style="padding-top:16px"><div class="card" style="padding:15px 16px">
 ${[['현재 온라인 최저가',won(p.price)],['확인된 최저가(7일 유지)',won(p.low)]].map(([k,v])=>`<div class="row" style="font-size:12px;padding:3px 0"><span style="color:#7D796F">${k}</span><span class="num">${v}</span></div>`).join('')}
 <div class="row" style="align-items:baseline;padding-top:12px;margin-top:11px;border-top:.5px solid #E8E2D6">
 <span class="h3" style="font-size:14px">최종 협상가</span>
 <span style="display:flex;align-items:baseline;gap:6px">
  <span class="num" style="font-size:12px;color:#A39E93;text-decoration:line-through">${won(p.price)}</span>
  <span class="num" style="font-size:24px;font-weight:600;color:#A0610F;letter-spacing:-.03em">${won(p.dealPrice)}</span>
  <span class="badge b-amber num">-${off}%</span>
 </span></div></div></div>
 <div class="pad sec"><div style="background:#EDF2EF;border-radius:12px;padding:13px 15px;display:flex;gap:9px">${ic('shield',17,'#0F6E56')}
 <div><div class="h3" style="margin-bottom:3px">60일 최저가 보장</div>
 <div style="font-size:12px;color:#33564A;line-height:1.7">구매 후 60일 이내 더 싼 곳이 생기면 알려주세요. 차액은 브랜드가 지급합니다.</div></div></div></div>
 <div style="height:20px"></div></div>
 <div style="background:#FFFDF9;box-shadow:0 -.5px 0 #E8E2D6;padding:15px 18px 18px;flex-shrink:0">
 <button class="btn amber" data-a="leave:${p.id}">브랜드 판매처에서 구매하기</button></div>`};

V.me=()=>`<div class="bar"><div class="h1" style="font-size:19px">내 정보</div></div><div class="body"><div class="pad" style="padding-top:20px"><div class="card" style="padding:16px;text-align:center"><div class="h3">대기 중인 등록 내역 관리</div></div></div></div>${tabs()}`;

/* ── 시트 ── */
const sheetHTML=()=>{if(!S.sheet)return'';const [k,id]=S.sheet.split(':');const p=byId(id)||P[0];
 if(k==='price'){const st=ladder(p);return `<div class="veil" data-a="closeSheet"><div class="sheet" data-stop>
 <div class="grab"></div>
 <div class="pad" style="padding-top:10px;padding-bottom:14px"><div style="font-size:18px;font-weight:600;letter-spacing:-.025em">이 가격이면 살게요 (희망 가격 대기 등록)</div>
 <div class="meta" style="margin-top:4px">${p.brand} ${p.name}</div></div>
 <div class="pad">${st.map((s,i)=>`<button class="opt ${S.tmp===s.price?'on':''}" data-a="pick2:${s.price}">
 <span style="display:flex;align-items:baseline;gap:9px"><span class="num" style="font-size:15px;${S.tmp===s.price?'font-weight:600;color:#0F6E56':''}">${won(s.price)}</span></span>
 <span class="num" style="font-size:12px;color:#7D796F">${s.people}명 선택</span></button>`).join('')}</div>
 <div class="pad" style="padding-top:16px"><button class="btn teal" data-a="closeSheet" onclick="say('대기 등록이 완료되었습니다!')">등록 완료</button></div></div></div>`}
 return''};

/* ── 렌더 ── */
function draw(){const c=cur();
 const html=(c.s==='product'?V.product(c.id):c.s==='deal'?V.deal(c.id):(V[c.s]||V.home)());
 document.getElementById('app').innerHTML=html+sheetHTML();
 const q=document.getElementById('q');
 if(q){q.focus();q.oninput=e=>{S.q=e.target.value;document.getElementById('results').innerHTML=searchResults()}}
}

document.getElementById('app').addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const raw=t.getAttribute('data-a');const i=raw.indexOf(':');
 const a=i<0?raw:raw.slice(0,i), v=i<0?'':raw.slice(i+1);
 e.stopPropagation();
 switch(a){
  case'back':back();break;
  case'root':S.stack=[{s:v}];S.tab=v;draw();break;
  case'search':go('search');break;
  case'product':S.ptab='info';go('product',v);break;
  case'deal':go('deal',v);break;
  case'price':S.tmp=S.waits[v]||null;S.sheet='price:'+v;draw();break;
  case'pick2':S.tmp=Number(v);draw();break;
  case'closeSheet':S.sheet=null;draw();break;
  case'ptab':S.ptab=v;draw();break;
  case'req':say('후기 모음 요청이 접수되었습니다.');S.q='';break;
 }
});
draw();
