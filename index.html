V.status=()=>{
 const mine=x=>!S.mine||S.waits[x.id];
 const g=k=>P.filter(x=>x.deal===k&&mine(x));
 const openL=g('open'),talkL=g('talking'),gathL=g('gathering'),postL=g('postponed'),noneL=g('none');
 const total=openL.length+talkL.length+gathL.length+postL.length+noneL.length;
 const openCard=x=>`<div class="card" data-a="deal:${x.id}" style="padding:14px;margin-bottom:10px;cursor:pointer">
  <div style="display:flex;gap:13px">${th(x,60)}<div style="min-width:0;flex:1">
  <div style="display:flex;gap:5px"><span class="badge b-amber">${x.endDate} 종료</span>${S.waits[x.id]?'<span class="badge b-teal">내가 기다린 것</span>':''}</div>
  <div class="h3" style="font-size:14px;margin-top:5px">${x.brand} ${x.name}</div>
  <div class="meta" style="margin-top:2px">${x.label} · 후기 ${x.n}건</div></div></div>
  <div class="row" style="margin-top:12px;padding-top:11px;border-top:.5px solid #EFEAE0;align-items:baseline">
  <span class="num" style="font-size:11.5px;color:#A39E93;text-decoration:line-through">${won(x.price)}</span>
  <span style="display:flex;align-items:baseline;gap:7px"><span class="badge b-amber num">-${Math.round((1-x.dealPrice/x.price)*100)}%</span>
  <span class="num" style="font-size:18px;font-weight:600;color:#A0610F;letter-spacing:-.03em">${won(x.dealPrice)}</span></span></div></div>`;
 const plain=(x,badge,line)=>`<div class="card" data-a="product:${x.id}" style="padding:13px 14px;margin-bottom:9px;cursor:pointer">
  <div class="row" style="margin-bottom:7px"><span class="badge b-gray">${badge}</span>${S.waits[x.id]?`<span class="tiny num">내 가격 ${won(S.waits[x.id])}</span>`:''}</div>
  <div class="h3" style="font-size:13.5px">${x.brand} ${x.name}</div>
  <div class="meta" style="margin-top:3px;line-height:1.7">${line}</div>
  ${x.deal==='gathering'?`<div class="track" style="margin-top:10px;height:4px"><div class="fill" style="height:4px;width:${Math.min(100,waitCount(x)/x.target*100)}%"></div></div>
  <div class="meta num" style="margin-top:6px;text-align:right">${waitCount(x)} / ${x.target}명</div>`:''}</div>`;
 const sec=(t,d,body)=>body?`<div class="pad sec"><div class="h2" style="margin-bottom:3px">${t}</div>
  <div class="meta" style="margin-bottom:12px">${d}</div>${body}</div>`:'';
 return `<div class="bar"><div class="h1" style="font-size:19px">현황</div>
 <div class="meta" style="margin-top:3px">다들이 이야기하고 있는 것들을 한눈에 모았어요</div>
 <div style="display:flex;gap:6px;margin-top:12px">
 <span class="chip ${S.mine?'':'on'}" data-a="seg:0">전체</span>
 <span class="chip ${S.mine?'on':''}" data-a="seg:1">내가 기다리는 것 ${Object.keys(S.waits).length}</span></div></div>
 <div class="body">
 ${total?'':(S.mine&&!S.user?`<div class="pad" style="padding-top:56px;text-align:center"><div class="h2">연결하시면 여기에 모여요</div>
  <div class="sub" style="margin-top:8px">기다리시는 것과 구매 내역을<br>어느 기기에서든 그대로 보실 수 있어요.</div>
  <div style="padding:0 20px"><button class="btn" style="background:#FEE500;color:#191600;margin-top:16px" data-a="oauth:kakao">카카오톡으로 계속하기</button>
  <button class="btn ghost" style="margin-top:8px" data-a="loginSheet">다른 방법으로 하기</button></div></div>`
  :`<div class="pad" style="padding-top:60px;text-align:center"><div class="h2">아직 기다리시는 게 없어요</div>
  <div class="sub" style="margin-top:8px">후기를 보시다가 마음에 드는 가격을 골라두시면<br>여기에서 진행 상황을 보실 수 있어요.</div>
  <button class="btn ghost" style="margin-top:16px" data-a="root:reviews">후기 모음 둘러보기</button></div>`)}
 ${sec('지금 사실 수 있어요','협상이 끝나 열려 있는 것들이에요',openL.map(openCard).join(''))}
 ${sec('브랜드와 이야기 중','수요를 들고 협상하는 중이에요. 결과가 나오면 알려드릴게요',
   talkL.map(x=>plain(x,'협상 중',`${x.tDate}에 시작했어요 · ${waitCount(x)}분의 수요를 들고 갔습니다`)).join(''))}
 ${sec('수요가 모이는 중','기다리는 분이 목표에 닿으면 협상을 시작해요',
   gathL.map(x=>plain(x,'모집 중','조금만 더 모이면 브랜드에 이야기하러 갑니다')).join(''))}
 ${sec('이번엔 미뤄뒀어요','안 된 것도 남겨둘게요. 등록은 그대로 있어요',
   postL.map(x=>plain(x,'다음을 기약했어요',`${x.pDate} · ${x.pWhy} 이번엔 접었어요`)).join(''))}
 ${sec('아직 순서가 아니에요','다들의 이야기가 더 모이면 다시 살펴볼게요',
   noneL.map(x=>plain(x,x.label,x.label==='표본 부족'?'후기가 더 쌓이면 판단해 볼게요':'평가가 낮아 협상 순서를 뒤로 두었어요')).join(''))}
 <div class="pad sec" style="padding-bottom:26px"><div class="soft" data-a="log" style="padding:16px 17px;cursor:pointer">
 <div class="h3" style="font-size:14px;margin-bottom:6px">협상 기록</div>
 <div style="font-size:12.5px;color:#5F5B52;line-height:1.75">이번 달에 몇 번 이야기해서 몇 번 잘 됐는지, 숫자 그대로 적어두었어요.</div>
 <div style="margin-top:11px;display:flex;align-items:center;gap:5px;font-size:12.5px;color:#0F6E56;font-weight:500">기록 보기 ${ic('arrow',15,'#0F6E56')}</div></div></div>
 </div>${tabs()}`};

 document.getElementById('app').innerHTML=html+(S.drawer?V.drawer():'')+
 (S.banner&&cur().s==='home'&&!S.sheet?`<div class="pop">${mark(22,'#FCFAF5')}
 <div style="flex:1"><div style="font-size:13.5px;font-weight:600;letter-spacing:-.02em">다들 모여서, 더 저렴하게</div>
 <div style="font-size:11.5px;color:#CFCAC0;line-height:1.65;margin-top:3px">실사용자 후기를 모아 살 만한 것만 고르고, 기다리는 분이 모이면 브랜드와 값을 협상해요.</div></div>
 <button data-a="closePop" style="flex-shrink:0;opacity:.6">${ic('x',15,'#FCFAF5')}</button></div>`:'')+sheetHTML()+(S.toast?`<div class="toast">${S.toast}</div>`:'');
 const q=document.getElementById('q');
 if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);
  q.oninput=e=>{S.q=e.target.value;document.getElementById('results').innerHTML=searchResults()}}
 const ct=document.getElementById('contact');
 if(ct)ct.oninput=e=>{S.contact=e.target.value};
}

document.getElementById('app').addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 if(t.hasAttribute('data-stop'))return;
 const raw=t.getAttribute('data-a');const i=raw.indexOf(':');
 const a=i<0?raw:raw.slice(0,i), v=i<0?'':raw.slice(i+1);
 e.stopPropagation();
 switch(a){
  case'back':back();break;
  case'root':S.stack=[{s:v}];S.tab=v;draw();break;
  case'noti':go('noti');break;
  case'search':go('search');break;
  case'list':go('list');break;
  case'excluded':go('excluded');break;
  case'method':go('method');break;
  case'log':go('log');break;
  case'rules':go('rules');break;
  case'compare':go('compare');break;
  case'product':S.ptab='info';S.drawer=0;go('product',v);break;
  case'deal':go('deal',v);break;
  case'report':go('report',v);break;
  case'price':S.tmp=S.waits[v]||null;S.sheet='price:'+v;draw();break;
  case'pick2':S.tmp=Number(v);draw();break;
  case'toLogin':if(!S.tmp)break;S.pending={kind:'wait',id:v,price:S.tmp};
   if(S.user){finish()}else{S.sheet='login:'+v};draw();break;
  case'toLoginSheet':S.sheet='login:'+(S.pending?S.pending.id:'p1');draw();break;
  case'oauth':S.user={ch:v,id:v==='kakao'?'카카오 계정':'네이버 계정'};S.contact=S.contact||(v==='kakao'?'카카오톡 알림':'네이버 이메일');S.sheet=null;finish();break;
  case'docode':{const c=document.getElementById('contact');const val=c?c.value.trim():'';
   if(!val){say('번호를 적어주세요');break}S.user={ch:'phone',id:val};S.contact=val;S.sheet=null;finish();break}
  case'logout':S.user=null;S.sheet=null;say('로그아웃했어요');break;
  case'toVerify':S.sheet=null;say('판매처로 이동했다고 가정할게요');setTimeout(()=>go('verify',v),900);break;
  case'leave':S.sheet='leave:'+v;draw();break;
  case'closeSheet':S.sheet=null;draw();break;
  case'closePop':S.banner=0;draw();break;
  case'admin':S.drawer=0;S.atab='cand';go('admin');break;
  case'atab':S.atab=v;draw();break;
  case'appr':S.appr[v]=!S.appr[v];draw();break;
  case'runJob':if(Object.values(S.appr).filter(Boolean).length){S.atab='job';draw();say('수집을 시작했어요. 밤사이 돌아갑니다')}break;
  case'audit':{const[i,ok]=v.split(':');S.aud[i]=Number(ok);draw();break}
  case'doverify':if(!S.user){S.pending={kind:'verify',id:v};S.sheet='login:'+v;draw();break}S.bought[v]=1;go('verified');break;
  case'doreport':go('reported');break;
  case'pick':S.picks=S.picks.includes(v)?S.picks.filter(x=>x!==v):[...S.picks,v].slice(-4);
   document.getElementById('results').innerHTML=searchResults();draw();break;
  case'filter':S.filters=S.filters.includes(v)?S.filters.filter(x=>x!==v):[...S.filters,v];draw();break;
  case'req':say('요청 접수됐어요. 올라오면 알려드릴게요');S.q='';break;
  case'seg':S.mine=Number(v);draw();break;
  case'toggle':S.noti[v]=S.noti[v]?0:1;draw();break;
  case'editContact':S.sheet='edit:x';draw();break;
  case'loginSheet':S.sheet='login:p1';draw();break;
  case'openDrawer':S.drawer=1;draw();break;
  case'closeDrawer':S.drawer=0;draw();break;
  case'cat':S.cat=v;S.brand=null;S.drawer=0;if(cur().s!=='home'){S.stack=[{s:'home'}];S.tab='home'}draw();break;
  case'brandSel':S.brand=v||null;S.cat='전체';S.drawer=0;if(cur().s!=='home'){S.stack=[{s:'home'}];S.tab='home'}draw();break;
  case'ptab':S.ptab=v;draw();break;
  case'official':S.sheet='site:'+v;draw();break;
  case'saveContact':{const c=document.getElementById('contact');S.contact=c?c.value.trim():S.contact;S.sheet=null;draw();say('저장했어요');break}
  case'say':say(v);break;
 }
});
draw();
setTimeout(()=>{if(S.banner){S.banner=0;draw()}},7000);
</script>
</body>
</html>
