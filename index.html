/* 홈의 모아 사기 소개 — 첫 화면 아래 별도 칸. 리뷰 섹션에 영향 없음 · 탭을 숨기면 함께 사라짐 */

/* 상품 카드 */
const mBadge=d=>d.state==='open'?(canBuy(d)?'':'<span class="mbg mute">끝났어요</span>')   /* 열린 제품은 D-day 배지가 「지금 살 수 있어요」를 대신함 */
 :d.state==='proposing'?'<span class="mbg">제안 중</span>':d.state==='done'?'<span class="mbg mute">지난</span>':d.state==='failed'?'<span class="mbg mute">지난</span>'
 :dPaused(d)?'<span class="mbg mute">잠시 멈춤</span>':(()=>{const nx=dNext(d);return nx&&nx.need-dCount(d)<=nx.need*.2?'<span class="mbg on">곧 다음 단계</span>':d.at<=2?'<span class="mbg">새로 열림</span>':''})();
// 카드 가격 한 줄 — 이름표 · 할인율 · 가격 (소비자가 줄과 열을 맞춤)
const mpRow=(lab,off,p)=>`<span class="mpk">${lab}</span><span class="mpw"><span class="moff num">${off}%</span><span class="mpv num">${won(p)}</span></span>`;
const mcard=d=>{const x=dItem(d),L=labOf(x);let price,prog='';
 if(d.state==='gathering'){const r=dReached(d),nx=dNext(d),c=dCount(d),t=r||tiersOf(d)[0];
  price=mpRow('제안가',t.off,t.p);
  const goal=nx||t;prog=`<div class="mbar"><i style="width:${Math.min(100,c/goal.need*100)}%"></i></div><div class="t-cap num">${!r?`${t.need}명이 모이면 · ${t.need-c}명 남음`:nx?`지금 ${c}명 · 다음 ${nx.off}%까지 ${nx.need-c}명`:`지금 ${c}명 · 마지막 단계까지 모였어요`}</div>`}
 else if(d.state==='failed')price=`<span class="mpk"></span><span class="t-sub">이번엔 성사되지 않았어요</span>`;
 else{const p=dDealPrice(d);
  price=mpRow(d.state==='proposing'?'제안가':'확정가',offOf(d,p),p);prog=canBuy(d)?`<div class="t-cap num">${endText(d)}까지</div>`:`<div class="t-cap num">${dCount(d)}명이 참여${d.state==='proposing'?'했어요':'했어요'}</div>`}
 return `<button class="mcard" data-a="deal:${d.id}"><div class="mimg">${thumb(x,160,160,'thumb mth')}${mBadge(d)}${canBuy(d)?ddayEl(d,'onimg left'):''}</div>
  <div class="t-cap" style="color:var(--sub);margin-top:8px">${x.brand}</div><div class="mn">${x.name.replace(/ (?=\S+$)/,'\u00a0')}</div>
  <div class="mpg">${price}<span class="mpk">소비자가</span><span class="mpw num">${won(x.price)}</span></div>${prog}
  <div class="mlab"><span class="dot" style="background:${LDOT(L)}"></span>${L}<span class="num">★${x.nv.r}</span></div>
  ${myJoin(d)?`<div class="mine">참여 중</div>`:''}</button>`};

/* 필터 (PC 왼쪽 · 모바일 창) */
const mfilters=()=>{const f=S.mf,[lo,hi]=moaBounds(),brands=[...new Set(DEALS.map(d=>dItem(d).brand))].sort((a,b)=>a.localeCompare(b,'ko'));
 return `<div class="sh2">진행 상태</div>${MSTATES.map(([k,t])=>{const on=f.states.includes(k);return `<button class="ck" data-a="mst:${k}" aria-pressed="${on}"><span class="box ${on?'on':''}">${on?ic('check',14,'#fff',3):''}</span>${t}</button>`}).join('')}
 <div class="sh2">소비자가</div>${rangeBox(lo,hi,f.pmin??lo,f.pmax??hi,'moa')}
 <div class="sh2">지금 할인율</div><div class="fchips">${[[0,'전체'],[20,'20% 이상'],[25,'25% 이상'],[30,'30% 이상']].map(([v,t])=>`<button class="chip ${f.off===v?'on':''}" data-a="moff:${v}">${t}</button>`).join('')}</div>
 <div class="sh2">더 좁혀 보기</div>
 <button class="ck" data-a="msoon" aria-pressed="${f.soon}"><span class="box ${f.soon?'on':''}">${f.soon?ic('check',14,'#fff',3):''}</span>곧 다음 단계 (20% 안쪽 남음)</button>
 <button class="ck" data-a="mmine" aria-pressed="${f.mine}"><span class="box ${f.mine?'on':''}">${f.mine?ic('check',14,'#fff',3):''}</span>내가 참여한 것만</button>
 <div class="sh2">브랜드</div><div class="fchips">${brands.map(b=>`<button class="chip ${f.brands.includes(b)?'on':''}" data-a="mbrand:${escA(b)}">${b}</button>`).join('')}</div>`};
const buyBanner=()=>{const bs=DEALS.filter(d=>canBuy(d)&&myJoin(d));if(!bs.length)return '';
 return `<div class="buyb">${ic('check',18,'var(--brand)',2.6)}<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700">참여하신 모아 사기가 열렸어요</div>
 <div class="t-cap">${bs.map(d=>dItem(d).brand+' '+dItem(d).name).join(' · ')}</div></div><button class="tbtn" data-a="${bs.length===1?'deal:'+bs[0].id:'moaseg:mine'}">${bs.length===1?'사러 가기':'보기'}</button></div>`};
/* 내 참여 — 상태별로 묶음 (찜 탭의 「모아 사기」 칸과 모아 사기 탭의 「내 참여」가 같은 목록) */
const joinedDeals=()=>Object.keys(S.joins).filter(k=>S.joins[k]).map(dealOf).filter(Boolean);
const moaRow=d=>{const x=dItem(d),c=dCount(d),nx=dNext(d),r=dReached(d),p=dDealPrice(d);let info='',act='';
 if(canBuy(d)){info=`<div class="mrl"><span class="mpk">확정가</span><span class="moff num">${offOf(d,p)}%</span><b class="num mrp">${won(p)}</b>${ddayEl(d)}</div>`;
  act=`<button class="tbtn mbuy" data-a="say:새 창에서 브랜드 페이지가 열려요">브랜드 페이지에서 사기 ↗</button>`}
 else if(dPaused(d))info=`<div class="mrl t-cap">새 모집을 잠시 멈췄어요</div>`;
 else if(d.state==='gathering'){const g=nx||r;info=`<div class="mrl t-cap num">지금 ${nf(c)}명${r?` · ${r.off}% 단계`:''}${nx?` · 다음 ${nx.off}%까지 ${nx.need-c}명`:''}</div><div class="mbar"><i style="width:${Math.min(100,c/g.need*100)}%"></i></div>`;
  act=`<button class="plink" style="color:var(--sub)" data-a="moaleave:${d.id}">참여 취소</button>`}
 else if(d.state==='proposing')info=`<div class="mrl t-cap num">${nf(c)}명 · ${offOf(d,p)}% 단계(${won(p)})로 제안했어요</div>`;
 else if(d.state==='failed')info=`<div class="mrl t-cap">이번엔 성사되지 않았어요 · ${d.why}</div>`;
 else info=`<div class="mrl t-cap num">${won(p)}(${offOf(d,p)}%)에 열렸어요 · 구매 기간이 끝났어요</div>`;
 return `<div class="mrow2"><button class="lmain" data-a="deal:${d.id}">${thumb(x,56,56)}<div style="min-width:0;flex:1;text-align:left">
  <div class="t-cap" style="color:var(--sub)">${x.brand}</div><div class="lname">${x.name}</div>${info}</div></button>${act?`<div class="mact2">${act}</div>`:''}</div>`};
const moaMine=()=>{const js=joinedDeals();
 if(!js.length)return `<div style="padding:34px 4px;text-align:center"><div class="t-h">아직 참여한 모아 사기가 없어요</div><div class="t-sub" style="margin-top:6px">「참여하기」를 누르면 여기에 모여요.</div>
  <button class="tbtn" style="margin-top:14px" data-a="moalive">진행 중인 모아 사기 보기</button></div>`;
 const groups=[['지금 살 수 있어요',js.filter(canBuy)],['사람을 모으는 중',js.filter(d=>d.state==='gathering')],['브랜드에 제안 중',js.filter(d=>d.state==='proposing')],['지난 모아 사기',js.filter(d=>dSt(d)==='past')]];
 return groups.filter(g=>g[1].length).map(([t,xs])=>`<section class="fgrp"><div class="fgh"><span><b>${t}</b> <span class="num" style="color:var(--meta)">${xs.length}</span></span></div>${xs.map(moaRow).join('')}</section>`).join('')};
// 찜 탭 위의 두 칸 전환 — 모아 사기가 열려 있을 때만 · 열린 참여 제품이 있으면 점
const favSegOn=()=>S.moaOn;
const favSegEl=()=>{if(!favSegOn())return '';const fn=favItems().length,jn=joinedDeals().length,dot=joinedDeals().some(canBuy);
 return `<div class="dseg fseg" role="tablist">${[['fav','찜',fn],['moa','모아 사기',jn]].map(([k,t,n])=>`<button role="tab" aria-selected="${S.favSeg===k}" class="${S.favSeg===k?'on':''}" data-a="favseg:${k}">${t} <span class="num">${n}</span>${k==='moa'&&dot?'<span class="sdot" aria-label="열린 제품 있음"></span>':''}</button>`).join('')}</div>`};
const favSeg=()=>favSegOn()?S.favSeg:'fav';

/* 참여 인원별 할인 단계 */
const tiersUI=d=>{const ts=tiersOf(d),c=dCount(d),r=dReached(d),nx=dNext(d),hid=hiddenTiers(d),deal=dDealPrice(d);
 return `<div class="lad">${ts.map(t=>{const hit=c>=t.need,cur=r===t;return `<div class="trow ${hit?'hit':''} ${cur?'cur':''}">
  <span class="loff num">${t.off}%</span><span class="lp num">${won(t.p)}</span>
  <span class="lb"><i style="width:${Math.min(100,c/t.need*100)}%"></i></span>
  <span class="lcn num">${nf(t.need)}명${hit?'<span class="over">도달</span>':''}</span></div>`}).join('')}</div>
 <div class="t-sub num" style="margin-top:8px;font-weight:600">${d.state==='gathering'?(nx?`지금 ${c}명 · 다음 ${nx.off}%까지 ${nx.need-c}명`:`지금 ${c}명 · 마지막 단계까지 모였어요`):`${c}명이 모였어요`}</div>
 <div class="t-cap" style="margin-top:4px">${bySent(`모두 다들 제안가예요. 사람이 많이 모일수록 더 큰 할인을 브랜드에 제안해요. 확정 가격은 브랜드 답변 뒤 정해져요.${hid.length?` 세일 때 이미 팔린 가격보다 비싼 단계(${hid.join(' · ')}%)는 뺐어요.`:''}`)}</div>`};
const dealBottom=d=>{const j=myJoin(d);
 if(dPaused(d))return `<button class="main ${S.moaNext[d.id]?'on':''}" data-a="moanext:${d.id}">${S.moaNext[d.id]?'다시 열리면 알려드릴게요':'다시 열리면 알려주세요'}</button>`;
 if(d.state==='gathering')return j?`<div class="jbar"><div><div style="font-size:15px;font-weight:700">참여 중이에요</div><div class="t-cap">열리면 먼저 알려드려요</div></div><button class="tbtn" data-a="moaleave:${d.id}">참여 취소</button></div>`
  :`<button class="main" data-a="moajoin:${d.id}">참여하기</button>`;
 if(canBuy(d))return `<div class="jbar">${ddayEl(d)}<button class="main" style="flex:1" data-a="say:새 창에서 브랜드 페이지가 열려요">브랜드 페이지에서 사기 ↗</button></div>`;
 if(d.state==='proposing'&&j)return `<button class="main on" aria-disabled="true">열리면 먼저 알려드려요</button>`;
 return `<button class="main ${S.moaNext[d.id]?'on':''}" data-a="moanext:${d.id}">${S.moaNext[d.id]?'다음 모아 사기를 알려드릴게요':'다음 모아 사기 알려주세요'}</button>`};

/* 상세의 상태 상자 — 제목 한 줄 + 항목별 줄 + 작은 안내 (줄글 대신) */
function dStatusBox(d){const c=dCount(d),j=myJoin(d),pp=dPropPrice(d),p=dDealPrice(d),nx=dNext(d),r=dReached(d);
 const row=(k,v,cls)=>`<div class="srw"><span class="sk">${k}</span><span class="sv ${cls||''}">${v}</span></div>`;
 const pr=(lab,price,tone)=>`<span class="mpv2 ${tone||''}"><span class="mpl">${lab}</span><b class="num">${won(price)}</b><span class="num mpc">${offOf(d,price)}%</span></span>`;   // 이름이 다른 화면(.pl · .pc)과 겹치지 않게
 let title,tag='',rows=[],note='',tone='';
 if(dPaused(d)){title='새 모집을 잠시 멈췄어요';tone='mute';note='진짜 후기의 결과가 바뀌어서예요. 다시 「대체로 만족」이 되면 알려드려요.'}
 else if(d.state==='gathering'){title='사람을 모으는 중이에요';tag=j?'참여 중':'';
  rows=[row('모집 마감',`${d.until}까지`),row('지금 인원',`<span><b class="num">${nf(c)}명</b>${r?` · ${r.off}% 단계 도달`:''}</span>`),row(nx?'다음 단계':'단계',nx?`<span>${nx.off}%까지 <b class="num">${nx.need-c}명</b> 남음</span>`:'마지막 단계까지 모였어요')];
  note=j?'열리면 참여하신 분께 먼저 알려드려요.':'참여해도 꼭 사야 하는 건 아니에요. 열리면 누구나 살 수 있어요.'}
 else if(d.state==='proposing'){title='브랜드에 제안했어요';tag=j?'참여 중':'';
  rows=[row('모인 인원',`<b class="num">${nf(c)}명</b>`),row('제안 가격',pr('다들 제안',pp))];note=j?'열리면 먼저 알려드려요.':'열리면 누구나 살 수 있어요. 열림 알림은 참여하신 분께 먼저 가요.'}
 else if(d.state==='open'||d.state==='done'){const live=canBuy(d);title=live?`${won(p)}에 열렸어요`:`${won(p)}에 열렸던 모아 사기예요`;tag=`${offOf(d,p)}% 할인`;tone=live?'':'mute';
  rows=[live?row('구매 기간',`<span class="nw">${endText(d)}까지</span>${ddayEl(d)}`,'between'):row('참여 인원',`<b class="num">${nf(c)}명</b>`),
   row('가격',d.offer&&d.offer!==pp?`<span class="mpvs">${pr('다들 제안',pp,'mute')}${pr('브랜드 확정',d.offer)}</span>`:`${pr('다들 제안 그대로',p)}`)];
  note=live?'누구나 살 수 있어요. 수량이 다 팔리면 일찍 끝날 수 있어요.':'구매 기간이 끝났어요. 다음 모아 사기를 알려드릴까요?'}
 else{title='이번엔 성사되지 않았어요';tone='mute';rows=[row('모인 인원',`<b class="num">${nf(c)}명</b>`),row('이유',d.why)];note='사람이 다시 모이면 다시 제안해요.'}
 return `<div class="mstat2 ${tone}"><div class="sh"><div class="st">${title}</div>${tag?`<span class="stag">${tag}</span>`:''}</div>
  ${rows.length?`<div class="srows">${rows.join('')}</div>`:''}
  ${note?`<div class="snt">${ic('info',15,'var(--meta)',2)}<span>${bySent(note)}</span></div>`:''}</div>`}

/* 상세 */
const dealParts=(d,pc)=>{const x=dItem(d),st=dStatus(d),L=labOf(x);
 const dRow=(lab,off,p,extra)=>`<span class="dpk">${lab}</span><span class="dpw"><span class="moff num" style="font-size:15px">${off}%</span><span class="num dpn">${won(p)}</span>${extra||''}</span>`;
 let pr='';if(d.state==='gathering'){const t=dReached(d)||tiersOf(d)[0];pr=dRow('제안가',t.off,t.p,`<span class="t-cap">${dReached(d)?'지금 단계':'첫 단계'}</span>`)}
 else if(d.state!=='failed'){const p=dDealPrice(d);pr=dRow(d.state==='proposing'?'제안가':'확정가',offOf(d,p),p,canBuy(d)?ddayEl(d,'big'):'')}
 pr=`<div class="dpg">${pr}<span class="dpk">소비자가</span><span class="dpw t-sub num">${won(x.price)} · 네이버 판매가</span></div>`;
 const head=`<div class="${pc?'dhero pc':'dhero'}"><div class="mimg" style="flex-shrink:0">${thumb(x,pc?300:200,pc?300:200,'thumb dth')}${canBuy(d)?ddayEl(d,'onimg'):''}</div><div class="dinfo">
  <button class="blink" data-a="brand:${escA(x.brand)}">${x.brand}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="t-h" style="margin-top:1px;font-size:${pc?22:19}px">${x.name}</div>
  <div class="mlab" style="margin-top:6px"><span class="dot" style="background:${LDOT(L)}"></span>${L}<span class="num">★${x.nv.r} · 리뷰 ${nf(x.nv.c)}건</span></div>
  ${pr}</div></div>
  ${dStatusBox(d)}`;
 const nx=dNext(d),why=d.state==='gathering'&&!dPaused(d)?`<div class="whyjoin">${ic('moa',18,'var(--brand)')}<div>${bySent(`${nx?`한 명이 더 참여할수록 다음 단계(${nx.off}%)에 가까워져요.`:'마지막 단계까지 모였어요.'} 열리면 참여하신 분께 먼저 알려드려요.`)}</div></div>`:'';
 const lad=`<section class="dsec"><div class="t-h">참여 인원별 할인</div><div style="margin-top:10px">${tiersUI(d)}</div>${why}</section>`;
 const rev=`<section class="dsec"><div class="t-h">이 제품, 살 만할까요?</div><div style="margin-top:10px">${reviewMini(x)}</div></section>`;
 const how=`<section class="dsec"><div class="t-h">이렇게 진행돼요</div>
  <div class="hsteps">${['참여하기','모집 마감','다들이 브랜드에 제안','열리면 참여하신 분께 먼저 알림','구매 기간 동안 누구나 브랜드 페이지에서 구매'].map((t,i)=>`<div><span class="sn num">${i+1}</span>${t}</div>`).join('')}</div>
  <div class="mrules">${[['브랜드 가격','다른 가격을 내면 다들이 판단해요'],['거절 기준','20% 미만 할인 · 세일 때보다 비싼 가격'],['가격 공개','바뀐 가격은 제품 페이지에 그대로 밝혀요'],['결제','브랜드 페이지에서 해요'],['수수료','다들은 브랜드에게 수수료를 받아요']]
   .map(([k,v])=>`<div class="srw"><span class="sk">${k}</span><span class="sv">${v}</span></div>`).join('')}</div></section>`;
 const mid=midOf(x.sub).mid,rel=DEALS.filter(o=>o.id!==d.id&&midOf(dItem(o).sub).mid===mid&&(['gathering','proposing'].includes(o.state)||canBuy(o))).sort(msortF.hot).slice(0,4);
 const related=rel.length?`<section class="dsec"><div class="t-h">${mid}의 다른 모아 사기</div><div class="mgrid2" style="margin-top:6px">${rel.map(mcard).join('')}</div></section>`:'';
 return {head,lad,rev,how,related,x}};

/* 홈의 모아 사기 소개 — 첫 화면 아래 별도 칸 */
const homeMoa=pc=>{if(!S.moaOn)return '';const g=DEALS.filter(d=>d.state==='gathering'&&!dPaused(d)),xs=g.slice().sort(msortF.near).slice(0,pc?4:3);
 return `<section class="${pc?'':'hsec'} hmoa ${pc?'pc':''}"><div class="${pc?'':'pad'}"><div class="hmh"><div><div class="t-cap" style="color:var(--brand);font-weight:700">모아 사기</div>
  <div class="t-h" style="margin-top:2px">사려는 사람이 모이면, 다들이 브랜드와 가격을 이야기해요</div>
  <div class="t-sub" style="margin-top:4px">진짜 후기에서 「대체로 만족」인 제품만 열어요. 모일수록 할인이 커지고, 지금 <b class="num" style="color:var(--ink)">${g.length}개</b> 제품에 사람을 모으는 중이에요.</div></div>
  ${pc?`<button class="tbtn" style="background:var(--brand);color:#fff;border-color:var(--brand);flex-shrink:0" data-a="moa">모아 사기 보러 가기</button>`:''}</div>
  <div class="mgrid2 ${pc?'four':''}" style="margin-top:10px">${xs.map(mcard).join('')}</div>
  ${pc?'':`<button class="main" style="width:100%;height:50px;margin-top:12px" data-a="moa">모아 사기 보러 가기</button>`}</div></section>`};
/* 창 */
const moaHowSheet=()=>`<div class="pad"><div class="t-h">어떻게 진행되나요</div>
 ${[['「참여하기」만 누르세요','가격은 고르지 않아요. 참여해도 꼭 사야 하는 건 아니에요.'],['사람이 많이 모일수록 할인이 커져요','100명 20% · 200명 25% · 300명 30% · 500명 35% · 800명 40%처럼, 모인 인원에 맞는 「다들 제안가」가 정해져요.'],['모집이 끝나면 다들이 브랜드에 제안해요','첫 단계를 넘은 제품만 제안해요. 20% 미만이나 세일 때보다 비싼 가격은 다들이 받지 않아요.'],['열리면 누구나 살 수 있어요','참여하신 분께는 열리자마자 먼저 알려드려요. 브랜드가 다른 가격을 내면 다들이 판단해 열고, 바뀐 가격은 그대로 밝혀요. 구매 기간 동안 브랜드 페이지에서 사요.']]
  .map(([t,d2],i)=>`<div class="hrow"><span class="sn num">${i+1}</span><div><div style="font-size:15px;font-weight:700">${t}</div><div class="t-sub">${d2}</div></div></div>`).join('')}
 <div class="t-cap" style="margin-top:12px">인원 기준은 제품마다 조금씩 다를 수 있어요. ${FEE}</div></div>`;


/* ════ 운영 콘솔 (PC 전용) — 모아 사기 ════
   ① 후보 → ② 모으는 중 → ③ 브랜드 답변 → ④ 열림 → ⑤ 지난
   콘솔에서 바꾼 것은 DEALS 를 바로 고쳐 소비자 화면에 그대로 반영됨 */
// 후보 판단에 쓰는 값 (가상) — 실제로는 찜 수는 서비스 데이터, 90일 최저가는 주간 가격 기록
const opsJjim=x=>20+hashS('jj'+x.id)%380;
const opsLow90=x=>{const d=DEALS.find(o=>o.pid===x.id);return d?d.low90:Math.floor(x.price*(.86+(hashS('lw'+x.id)%10)/100)/100)*100};
const OPS_MIN_N=100,OPS_MIN_JJ=50;   // 수요 기준 (처음 값): 모은 후기 100건 · 찜 50명
// 후보 기준 — 자동으로 거르는 것 · 대기업은 운영자가 판단
function opsCheck(x){const low90=opsLow90(x),tmp={pid:x.id,low90},tiers=tiersOf(tmp),r=[];
 r.push(['대체로 만족',labOf(x)==='대체로 만족']);
 r.push(['1.5만~30만 원',x.price>=15000&&x.price<=300000]);
 r.push(['가격 여지',tiers.length>=2]);
 r.push([`수요 (후기 ${OPS_MIN_N}+ · 찜 ${OPS_MIN_JJ}+)`,x.n>=OPS_MIN_N&&opsJjim(x)>=OPS_MIN_JJ]);
 r.push(['대기업 아님 (운영자)',!S.opsBig[x.brand]]);
 return {checks:r,ok:r.every(c=>c[1]),tiers,low90}}
const opsCands=()=>ALL().filter(x=>!DEALS.some(d=>d.pid===x.id));
const OPS_TABS=[['cand','후보'],['gather','모으는 중'],['propose','브랜드 답변'],['open','열림'],['past','지난']];
const opsCount=k=>k==='cand'?opsCands().filter(x=>opsCheck(x).ok).length:k==='gather'?DEALS.filter(d=>d.state==='gathering').length:k==='propose'?DEALS.filter(d=>d.state==='proposing').length:k==='open'?DEALS.filter(canBuy).length:DEALS.filter(d=>dSt(d)==='past').length;
const opsProd=x=>`<button class="opsp" data-a="${x.full?'pick:'+x.id:'say:프로토타입에서는 샘플 '+P.length+'개만 상세가 있어요'}">${thumb(x,40,40)}<span><span class="t-cap" style="color:var(--sub)">${x.brand}</span><b>${x.name}</b></span></button>`;
const opsLab=x=>{const L=labOf(x);return `<span class="opsl" style="color:${LCOL(L)}"><span class="dot" style="background:${LDOT(L)}"></span>${L}</span>`};
const opsVd={open:['열어도 됨','ok'],review:['다시 협상','mid'],reject:['거절','no']};
const opsDays=n=>{const t=new Date(Date.now()+n*864e5);return `${t.getMonth()+1}월 ${t.getDate()}일`};

/* ① 후보 */
function opsCand(){const xs=opsCands(),key=S.opsGroup==='brand'?(x=>x.brand):(x=>x.sub);
 const shown=xs.filter(x=>S.opsEx||opsCheck(x).ok),groups=[...new Set(shown.map(key))].sort((a,b)=>a.localeCompare(b,'ko'));
 const exN=xs.filter(x=>!opsCheck(x).ok).length;
 return `<div class="opsbar"><div class="dseg">${[['brand','브랜드별'],['sub','카테고리별']].map(([k,t])=>`<button class="${S.opsGroup===k?'on':''}" data-a="opsgroup:${k}">${t}</button>`).join('')}</div>
  <button class="ck" style="width:auto" data-a="opsex" aria-pressed="${S.opsEx}"><span class="box ${S.opsEx?'on':''}">${S.opsEx?ic('check',14,'#fff',3):''}</span>기준에 안 맞는 제품도 보기 <span class="num" style="color:var(--tiny)">${exN}</span></button>
  <span class="t-sub" style="margin-left:auto">자동 기준을 통과한 제품만 후보예요. 열지 말지는 운영자가 정해요.</span></div>
 ${groups.map(g=>{const gx=shown.filter(x=>key(x)===g),isB=S.opsGroup==='brand';return `<section class="opsg"><div class="opsgh"><b>${g}</b><span class="num t-cap">${gx.length}개</span>
   ${isB?`<button class="ck" style="width:auto;margin-left:auto" data-a="opsbig:${escA(g)}" aria-pressed="${!!S.opsBig[g]}"><span class="box ${S.opsBig[g]?'on':''}">${S.opsBig[g]?ic('check',14,'#fff',3):''}</span>대기업 · 계열사로 표시</button>`:`<span class="t-cap" style="margin-left:auto">${midOf(g).dom} › ${midOf(g).mid}</span>`}</div>
  <div class="opsw"><table class="opst"><thead><tr><th>제품</th><th>진짜 후기</th><th class="r">소비자가</th><th class="r">90일 최저가</th><th>열 수 있는 단계</th><th class="r">모은 후기</th><th class="r">찜</th><th>기준</th><th></th></tr></thead><tbody>
  ${gx.map(x=>{const c=opsCheck(x),open=S.opsOpen===x.id;return `<tr class="${c.ok?'':'opsdim'}"><td>${opsProd(x)}</td><td>${opsLab(x)}</td><td class="r num">${won(x.price)}</td><td class="r num">${won(c.low90)}</td>
   <td class="num" style="white-space:nowrap">${c.tiers.length?`${c.tiers[0].off}~${c.tiers[c.tiers.length-1].off}% · ${c.tiers.length}단계`:'<span class="t-cap">없음</span>'}</td><td class="r num">${nf(x.n)}</td><td class="r num">${opsJjim(x)}</td>
   <td>${c.checks.filter(k=>!k[1]).map(k=>`<span class="opsx">${k[0]}</span>`).join('')||'<span class="opsok">모두 통과</span>'}</td>
   <td class="r">${c.ok?`<button class="tbtn" data-a="opsprep:${x.id}">${open?'접기':'열기 준비'}</button>`:''}</td></tr>
   ${open?`<tr class="opsprep"><td colspan="9">${opsPrep(x,c)}</td></tr>`:''}`}).join('')}</tbody></table></div></section>`}).join('')||'<div class="t-sub" style="padding:30px 0">지금 후보가 없어요</div>'}`};
function opsPrep(x,c){const dr=S.opsDraft[x.id]||(S.opsDraft[x.id]={tierN:TIER_N0.slice(),days:14});const tmp={pid:x.id,low90:c.low90,tierN:dr.tierN};
 return `<div class="opsbox"><div class="opsh">「${x.brand} ${x.name}」 모아 사기 열기</div>
  <div class="opstiers">${TIER_OFF.map((off,i)=>{const p=tierPrice(x.price,off),hid=p>c.low90;return `<label class="opstier ${hid?'hid':''}"><span class="num"><b>${off}%</b> ${won(p)}</span>
   <span class="opsin"><input type="number" min="1" step="10" value="${dr.tierN[i]}" data-ops="tier:${x.id}:${i}" aria-label="${off}% 단계 인원" ${hid?'disabled':''}>명</span>${hid?'<span class="t-cap">90일 최저가보다 비싸 숨김</span>':''}</label>`}).join('')}</div>
  <div class="t-cap" style="margin-top:6px">처음 값 100 · 200 · 300 · 500 · 800명. 찜이 적은 제품은 낮춰 주세요. 위 단계일수록 인원이 많아야 해요.</div>
  <div class="opsrow"><label class="opsf">모집 기간 <span class="opsin"><input type="number" min="3" max="60" value="${dr.days}" data-ops="days:${x.id}">일</span> <span class="t-cap">→ ${opsDays(dr.days)}까지</span></label>
   <span style="margin-left:auto;display:flex;gap:8px"><button class="tbtn" data-a="opsprep:${x.id}">취소</button><button class="tbtn opsgo" data-a="opsopen:${x.id}">모아 사기 열기</button></span></div></div>`}

/* ② 모으는 중 */
function opsGather(){const ds=DEALS.filter(d=>d.state==='gathering');if(!ds.length)return '<div class="t-sub" style="padding:30px 0">지금 모으는 중인 모아 사기가 없어요</div>';
 return `<div class="opsw"><table class="opst"><thead><tr><th>제품</th><th class="r">참여</th><th>도달 단계</th><th>다음 단계</th><th>모집 마감</th><th>인원 기준 (바꿀 수 있어요)</th><th></th></tr></thead><tbody>
 ${ds.map(d=>{const x=dItem(d),c=dCount(d),r=dReached(d),nx=dNext(d),N=d.tierN||TIER_N0;return `<tr><td>${opsProd(x)}</td><td class="r num"><b>${nf(c)}</b>명</td>
  <td>${r?`<b class="num">${r.off}%</b> <span class="t-cap num">${won(r.p)}</span>`:'<span class="t-cap">아직 없음</span>'}</td><td class="num">${nx?`${nx.off}%까지 ${nx.need-c}명`:'마지막 단계'}</td><td>${d.until}</td>
  <td><div class="opsns">${TIER_OFF.map((off,i)=>{const hid=tierPrice(dPrice(d),off)>d.low90;return `<label class="${hid?'hid':''}"><span class="t-cap">${off}%</span><input type="number" min="1" step="10" value="${N[i]}" data-ops="dtier:${d.id}:${i}" ${hid?'disabled':''} aria-label="${off}% 단계 인원"></label>`}).join('')}</div></td>
  <td class="r"><div style="display:flex;gap:6px;justify-content:flex-end">${r?`<button class="tbtn opsgo" data-a="opsclose:${d.id}">마감하고 제안</button>`:`<button class="tbtn" data-a="opsclose:${d.id}">마감 (첫 단계 미달)</button>`}<button class="tbtn" data-a="deal:${d.id}">고객 화면</button></div></td></tr>`}).join('')}</tbody></table></div>`}

/* ③ 브랜드 답변 */
function opsVerdictHtml(d,price){const v=offerVerdict(d,price),r=dReached(d),off=Math.round((1-price/dPrice(d))*100),[t,c]=opsVd[v];
 const why=v==='reject'?(!guardOk(d,price)?(price>d.low90?'90일 최저가보다 비싸요':'20% 미만 할인이에요'):'제안할 단계가 없어요'):price===r.p?'제안가 그대로예요':off>r.off?`제안보다 ${off-r.off}%p 더 할인 (브랜드 ${off}%)`:`제안 ${r.off}% → 브랜드 ${off}% · ${r.off-off}%p 적게 할인${v==='review'?' (한 단계 넘음)':''}`;
 return `<span class="opsv ${c}">${t}</span><span class="t-cap">${why}</span>`}
function opsPropose(){const ds=DEALS.filter(d=>d.state==='proposing');if(!ds.length)return '<div class="t-sub" style="padding:30px 0">브랜드 답변을 기다리는 모아 사기가 없어요</div>';
 return ds.map(d=>{const x=dItem(d),r=dReached(d),pin=S.opsOffer[d.id]??r.p,v=offerVerdict(d,pin);return `<div class="opsbox" style="margin-top:14px">
  <div style="display:flex;align-items:center;gap:12px">${opsProd(x)}<span class="t-sub num" style="margin-left:auto">${nf(dCount(d))}명 · 모집 ${d.until}에 마감</span></div>
  <div class="opsgrid">
   <div><div class="opsk">다들 제안가</div><div class="num"><b style="font-size:20px">${won(r.p)}</b> <span class="mpc">${r.off}%</span></div><div class="t-cap num">소비자가 ${won(dPrice(d))} · 90일 최저가 ${won(d.low90)}</div></div>
   <div><div class="opsk">브랜드 답변 가격</div><span class="opsin big"><input type="number" step="100" value="${pin}" data-offer="${d.id}" aria-label="브랜드 답변 가격">원</span>
    <div class="opsvd" data-vd="${d.id}">${opsVerdictHtml(d,pin)}</div></div>
   <div><div class="opsk">구매 기간</div><span class="opsin"><input type="number" min="1" max="30" value="${S.opsEndDays[d.id]??5}" data-ops="end:${d.id}">일</span><div class="t-cap">열면 그날부터 · D-day로 보여요</div></div></div>
  <div class="opsrow"><span class="t-cap">판단 기준 — 20% 미만 · 90일 최저가보다 비싸면 거절 · 제안 단계에서 한 단계(5%p) 이내면 열기 · 그 밖은 다시 협상</span>
   <span style="margin-left:auto;display:flex;gap:8px"><button class="tbtn" data-a="opsreject:${d.id}">거절됨 (성사 안 됨)</button><button class="tbtn opsgo" data-a="opsgoopen:${d.id}" data-oo="${d.id}" ${v==='open'?'':'aria-disabled="true"'}>이 가격으로 열기</button></span></div></div>`}).join('')}

/* ④ 열림 · ⑤ 지난 */
function opsOpen(){const ds=DEALS.filter(canBuy);if(!ds.length)return '<div class="t-sub" style="padding:30px 0">지금 열려 있는 모아 사기가 없어요</div>';
 return `<div class="opsw"><table class="opst"><thead><tr><th>제품</th><th>확정가</th><th>다들 제안가</th><th>구매 기간</th><th class="r">참여</th><th>구매 링크</th><th></th></tr></thead><tbody>
 ${ds.map(d=>{const x=dItem(d),p=dDealPrice(d),pp=dPropPrice(d);return `<tr><td>${opsProd(x)}</td><td class="num"><b>${won(p)}</b> <span class="mpc">${offOf(d,p)}%</span></td><td class="num t-sub">${d.offer&&d.offer!==pp?`${won(pp)} (${offOf(d,pp)}%)`:'같음'}</td>
  <td><span class="t-cap">${endText(d)}까지</span> ${ddayEl(d)}</td><td class="r num">${nf(dCount(d))}명</td>
  <td><input class="opslink" type="url" placeholder="브랜드가 준 구매 링크" value="${escA(S.opsLink[d.id]||'')}" data-ops="link:${d.id}" aria-label="구매 링크"></td>
  <td class="r"><div style="display:flex;gap:6px;justify-content:flex-end"><button class="tbtn" data-a="opsend:${d.id}">구매 기간 끝내기</button><button class="tbtn" data-a="deal:${d.id}">고객 화면</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function opsPast(){const ds=DEALS.filter(d=>dSt(d)==='past');if(!ds.length)return '<div class="t-sub" style="padding:30px 0">지난 모아 사기가 없어요</div>';
 return `<div class="opsw"><table class="opst"><thead><tr><th>제품</th><th>결과</th><th>가격</th><th class="r">참여</th><th>모집 마감</th></tr></thead><tbody>
 ${ds.map(d=>{const x=dItem(d),p=dDealPrice(d);return `<tr><td>${opsProd(x)}</td><td>${d.state==='failed'?`<span class="opsv no">성사 안 됨</span> <span class="t-cap">${d.why}</span>`:'<span class="opsv ok">성사</span>'}</td>
  <td class="num">${p?`${won(p)} <span class="mpc">${offOf(d,p)}%</span>`:'-'}</td><td class="r num">${nf(dCount(d))}명</td><td>${d.until}</td></tr>`}).join('')}</tbody></table></div>`}

const opsPage=()=>`<div class="opshead"><div class="wrap opshw"><b>다들 운영 콘솔</b><span class="t-sub">모아 사기</span>
  <button class="tbtn" style="margin-left:auto" data-a="home">← 서비스 화면으로</button></div></div>
 <div class="wrap" style="padding-bottom:80px"><nav class="opsnav">${OPS_TABS.map(([k,t])=>`<button class="${S.opsTab===k?'on':''}" data-a="opstab:${k}">${t} <span class="num">${opsCount(k)}</span></button>`).join('')}</nav>
 <div class="opsmain">${S.opsTab==='cand'?opsCand():S.opsTab==='gather'?opsGather():S.opsTab==='propose'?opsPropose():S.opsTab==='open'?opsOpen():opsPast()}</div>
 <div class="foot"><div class="t-cap">프로토타입 · 콘솔에서 바꾼 내용은 이 화면을 닫기 전까지 소비자 화면에 그대로 반영돼요. 찜 수 · 90일 최저가는 가상이에요.</div></div></div>`;

/* ── 프로토타입 전용 「샘플」 버튼 — 실제 서비스에는 없음 ──
   보기 어려운 상태(다시 온 사람 · 빈 비교함 · 표본 부족 상세 등)를 바로 열기 위한 바로가기 */
const protoFab=()=>{if(S.sheet)return '';   // 창이 열려 있으면 숨김 — 창의 버튼을 가리지 않게
 const E=validateAll(),wide=window.innerWidth>=PCW;
 const grp=(t,items)=>`<div class="pfg"><div class="pft">${t}</div>${items.map(([l,a,on])=>`<button class="pfi ${on?'on':''}" data-a="${a}">${l}</button>`).join('')}</div>`;
 const panel=S.protoOpen?`<div class="pfp" role="dialog" aria-label="프로토타입 바로가기">
  <div style="font-size:15px;font-weight:700">프로토타입 바로가기</div><div class="t-cap" style="margin-top:2px">실제 서비스에는 없는 버튼이에요. 제품과 숫자는 모두 가상이에요.</div>
  ${E.length?`<div class="warn" style="margin-top:10px;border-radius:10px">데이터 정합성 확인 필요: ${E.join(' / ')}</div>`:''}
  ${wide?grp('화면',[['모바일로 보기','view:mo',S.view==='mo'],['PC로 보기','view:pc',S.view==='pc']]):''}

function goAfterDraw(){if(!S.goAfter)return;const t=document.getElementById('c-'+S.goAfter);S.goAfter=null;if(t)t.scrollIntoView({block:'start'})}

function draw(){
 // PC 에는 카테고리 화면이 따로 없음(펼침 메뉴가 대신함) — 모바일에서 PC 로 바꾸면 원래 화면으로
 if(S.screen==='cats'&&S.view==='pc'){if(S.prev)Object.assign(S,S.prev);else S.screen='home';S.prev=null;S.mega=S.cdom}
 const p=byId(S.pid),app=document.getElementById('app'),list=S.screen==='list';
 // 최근 본 소분류 — 빈 비교함에서 어느 목록으로 안내할지 정할 때 씀
 if(list){S.lastSub=S.lsub;S.recentSubs=[S.lsub,...S.recentSubs.filter(x=>x!==S.lsub)].slice(0,6)}else if(S.screen==='detail')S.lastSub=p.sub;
 const toast=S.toast?`<div class="toast" role="status">${S.toast}</div>`:'';
 if(S.view==='pc'){const y=window.scrollY;
  document.body.classList.add('pcmode');app.className='pcroot';

  window.scrollTo(0,S.resetTop?0:y);S.keepTop=0;S.resetTop=0;fitLeft();bindChips();focusQ();goAfterDraw();return}
 document.body.classList.remove('pcmode');app.className='phone';
 const old=document.getElementById('scr');const top=old?old.scrollTop:0;
 app.innerHTML=protoFab()+(S.screen==='console'?`<div class="top"><div style="flex:1;font-size:17px;font-weight:700;padding-left:6px">운영 콘솔</div></div><div class="scr" id="scr"><div style="padding:60px 24px;text-align:center"><div class="t-h">운영 콘솔은 PC에서만 열려요</div><div class="t-sub" style="margin-top:6px">화면이 넓어야 후보 표와 브랜드 답변을 한눈에 볼 수 있어요.</div><button class="tbtn" style="margin-top:14px" data-a="home">서비스 화면으로</button></div></div>`:S.screen==='moa'?moaTop()+moaBody()+tabBar(null,'moa'):S.screen==='deal'?dealTop()+dealBody():S.screen==='noti'?notiTop()+notiScreen():S.screen==='brand'?brandTop('브랜드')+brandBody():S.screen==='brands'?brandTop('브랜드 모아보기')+brandsBody():S.screen==='story'?storyTop()+storyBody():S.screen==='favs'?favTop()+favScreen()+tabBar(null,3):S.screen==='search'?searchTop()+searchBody():S.screen==='cats'?catsTop()+catsBody()+tabBar(null,1):S.screen==='home'?homeTop()+homeBody()+tabBar(S.lastSub,0):S.screen==='compare'?cmpTop(S.csub)+cmpBody(S.csub)+tabBar(S.csub,2):list?listTop(S.lsub)+listBody(S.lsub)+tabBar(S.lsub):topBar()+body(p)+bottomBar(p))+sheet(p)+toast;
 const sc=document.getElementById('scr');if(sc)sc.scrollTop=S.keepTop?top:(S.resetTop?0:top);S.keepTop=0;S.resetTop=0;bindChips();bindCats();focusQ();goAfterDraw()}

const goList=sub=>{S.prev=null;S.cq='';S.screen='list';S.lsub=sub;S.lsort='default';S.f={good:false,pmin:null,pmax:null,brands:[]};S.sheet=null;S.mega=null;S.crowXs={};S.resetTop=1;draw()};
document.addEventListener('click',e=>{
 if(e.target.closest('[data-stop]')&&!e.target.closest('[data-a]'))return;
 const el=e.target.closest('[data-a]');
 if(S.protoOpen&&!e.target.closest('.pfb')){S.protoOpen=false;if(!el||!e.target.closest('.pfp')){S.keepTop=1;draw();if(!el)return}}
 if(S.sOpen&&!e.target.closest('.gsw')){S.sOpen=false;if(!el){S.keepTop=1;draw();return}}
 if(S.mega&&!e.target.closest('.mega')&&!(el&&el.dataset.a.startsWith('mega:'))){S.mega=null;S.cq='';S.keepTop=1;draw();if(!el)return}
 if(!el)return;
 const [a,...r]=el.dataset.a.split(':');const v=r.join(':');const p=byId(S.pid);
 switch(a){

  case'open':{const x=itemOf(v);if(x&&x.full){if(S.screen!=='detail')S.dPrev={screen:S.screen,lsub:S.lsub,lsort:S.lsort,csub:S.csub,brand:S.brand,storyK:S.storyK,q:S.q,sqDone:S.sqDone};S.recent=[v,...S.recent.filter(y=>y!==v)].slice(0,8);S.screen='detail';S.pid=v;S.month=false;S.sheet=null;S.act=null;S.crowXs={};S.resetTop=1;draw()}
   else say(`프로토타입에서는 상세가 샘플 ${P.length}개에만 있어요`);break}
  case'list':goList(v);break;
  case'say':say(v);break;

  case'month':S.month=!S.month;S.keepTop=1;draw();break;

   say(S.fav[x.id]?(labOf(x)==='표본 부족'?'후기가 30건 모이면 찜 탭에서 알려드릴게요':'찜했어요. 가격이 내리거나 한 달 써 본 후기가 늘면 찜 탭에서 알려드릴게요'):'찜을 풀었어요');break}
  case'cmp':{const x=itemOf(v||S.pid);if(S.cmp[x.id])delete S.cmp[x.id];else{const same=cmpList(x);
    if(same.length>=4){say(`${x.sub} 비교함은 4개까지 담을 수 있어요`);break}S.cmp[x.id]=1}
   S.keepTop=1;draw();say(S.cmp[x.id]?`${x.sub} 비교함에 담았어요`:'비교함에서 뺐어요');break}
  case'sheet':S.sheet=v;S.keepTop=1;draw();break;
  case'close':S.sheet=null;S.pendJoin=null;S.keepTop=1;draw();break;

  case'rmcmp':delete S.cmp[v];S.keepTop=1;draw();say('비교함에서 뺐어요');break;
  /* 목록: 정렬 · 기준 · 필터 */

  /* 모아 사기 */
  case'moa':S.screen='moa';S.sheet=null;S.mega=null;S.sOpen=false;S.resetTop=1;draw();break;

  case'console':S.screen='console';if(window.innerWidth>=PCW)S.view='pc';S.sheet=null;S.mega=null;S.resetTop=1;draw();break;

   const vis=TIER_OFF.map((off,i)=>[tierPrice(x.price,off)<=c.low90,N[i]]).filter(t=>t[0]).map(t=>t[1]);
   if(vis.some((n,i)=>i&&n<=vis[i-1])){say('위 단계일수록 인원이 많아야 해요');break}
   const id='d'+(DEALS.length+1+Math.floor(Math.random()*900));DEALS.push({id,pid:v,at:0,low90:c.low90,n:0,state:'gathering',until:opsDays(dr.days),tierN:N.slice()});
   S.opsOpen=null;S.keepTop=1;draw();say(`「${x.name}」 모아 사기를 열었어요 — 모아 사기 탭에 바로 보여요`);break}

  case'opsgoopen':{const d=dealOf(v),pin=S.opsOffer[v]??dReached(d).p;if(offerVerdict(d,pin)!=='open'){say('이 가격은 바로 열 수 없어요 — 다시 협상하거나 거절해 주세요');break}
   if(pin!==dReached(d).p)d.offer=pin;d.state='open';d.saleEnd=Date.now()+(S.opsEndDays[v]??5)*864e5;S.keepTop=1;draw();say(`${won(pin)}으로 열었어요. 참여자에게 먼저 알림이 가요`);break}

  case'favseg':S.favSeg=v;S.resetTop=1;draw();break;

  /* 브랜드 */

  case'brands':if(!['brand','brands'].includes(S.screen))S.bPrev={screen:S.screen,pid:S.pid,lsub:S.lsub,csub:S.csub,storyK:S.storyK};S.screen='brands';S.sheet=null;S.mega=null;S.sOpen=false;S.resetTop=1;draw();break;

  case'bjump':{const t=document.getElementById('bk-'+v);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});break}
  case'follow':S.follow[v]=!S.follow[v];S.keepTop=1;draw();say(S.follow[v]?(S.user?`${v}의 새 제품이 모이면 알려드릴게요`:`${v}의 새 제품이 모이면 찜 탭에서 알려드릴게요`):'알림을 껐어요');break;

  case'favs':S.screen='favs';S.sheet=null;S.mega=null;S.sOpen=false;S.crowXs={};S.resetTop=1;draw();break;
  case'login':S.user={ch:v};S.sheet=null;if(S.pendJoin){const [id]=S.pendJoin;S.joins[id]=true;S.pendJoin=null;S.keepTop=1;draw();say('연결했어요. 참여했어요');break}S.keepTop=1;draw();say('연결했어요. 찜한 제품이 달라지면 알려드릴게요');break;
  case'logout':S.user=null;S.sheet=null;S.keepTop=1;draw();say('연결을 끊었어요. 찜은 이 기기에 그대로 있어요');break;
  case'notipref':S.notiPref[v]=!S.notiPref[v];S.keepTop=1;draw();break;
  case'unreq':delete S.requested[v];S.keepTop=1;draw();say('요청을 취소했어요');break;
  case'favcmp':{const xs=favGroups().find(g=>g[0]===v)[1].filter(x=>!isThin(x)),now=cmpList({sub:v}).map(x=>x.id);
   xs.forEach(x=>{if(!S.cmp[x.id]&&Object.keys(S.cmp).filter(k=>itemOf(k).sub===v).length<4)S.cmp[x.id]=1});
   S.cpair=xs.slice(0,2).map(x=>x.id);S.screen='compare';S.csub=v;S.crowXs={};S.resetTop=1;draw();say('찜한 '+v+J(v,'을','를')+' 비교함에 담았어요');break}
  /* 검색 */
  case'search':if(v){submitSearch(v);break}
   if(S.view==='pc'){S.sOpen=true;S.mega=null;S.focusSearch=true;S.keepTop=1;draw();break}
   if(S.screen!=='search')S.sPrev={screen:S.screen,pid:S.pid,lsub:S.lsub,csub:S.csub};S.screen='search';S.q='';S.sqDone=false;S.sheet=null;S.focusSearch=true;S.resetTop=1;draw();break;
  case'sgo':submitSearch(v);break;
  case'sback':Object.assign(S,S.sPrev||{screen:'home'});S.sPrev=null;S.resetTop=1;draw();break;
  case'sclear':S.q='';S.sqDone=false;S.focusSearch=true;S.keepTop=1;draw();break;
  case'sdel':S.recentQ=S.recentQ.filter(x=>x!==v);S.keepTop=1;S.focusSearch=S.view==='pc';draw();break;
  case'sclr':S.recentQ=[];S.keepTop=1;S.focusSearch=S.view==='pc';draw();break;
  case'sreq':S.requested[v]=true;S.keepTop=1;draw();say('요청했어요. 후기가 모이면 찜 탭에서 알려드릴게요');break;
  /* 카테고리 메뉴 — PC 에서는 펼침 메뉴로 엶 */
  case'cats':case'catsx':openCats(v);if(S.view==='pc'){S.mega=S.cdom;S.keepTop=1;draw();break}
   S.prev=a==='catsx'?{screen:S.screen,pid:S.pid,lsub:S.lsub,csub:S.csub}:null;S.screen='cats';S.sheet=null;S.resetTop=1;draw();break;
  case'catclose':Object.assign(S,S.prev||{screen:'home'});S.prev=null;S.cq='';S.resetTop=1;draw();break;
  case'cdom':S.cdom=v;S.crTop=0;S.keepTop=1;draw();break;
  case'cjump':catJump(v,true);break;
  /* 홈 */
  case'home':if(S.screen==='home'&&!el.closest('.pfp')){const sc=document.getElementById('scr');if(S.view==='pc')window.scrollTo({top:0,behavior:'smooth'});else if(sc)sc.scrollTo({top:0,behavior:'smooth'});break}
   if(el.closest('.pfp'))Object.assign(S,{fav:{},recent:[],recentSubs:[],cmp:{},lastSub:null,entry:null,hdomSet:false,hrank:null,pOff:false});S.screen='home';S.sheet=null;S.mega=null;S.crowXs={};S.resetTop=1;draw();break;
  case'hdom':S.hdom=v;S.hdomSet=true;S.hrank=null;S.keepTop=1;draw();break;
  case'poff':S.pOff=!S.pOff;S.keepTop=1;draw();say(S.pOff?'맞춤을 껐어요. 모든 분께 같은 기준으로 보여드려요':'맞춤을 켰어요');break;
  case'reseed':SEED=Math.floor(Math.random()*2147483647);S.resetTop=1;draw();say('새로고침했어요');break;
  case'demoEntry':Object.assign(S,{fav:{},recent:[],recentSubs:[],cmp:{},lastSub:null,entry:{kw:'아기 젖병'},hdomSet:false,hrank:null,pOff:false,screen:'home',resetTop:1});draw();break;
  case'hrank':S.hrank=v;S.keepTop=1;draw();break;
  case'pair':{const ids=v.split(','),sub=itemOf(ids[0]).sub,now=cmpList({sub}).map(x=>x.id),add=ids.filter(id=>!now.includes(id));
   if(now.length+add.length>4){say(`${sub} 비교함 자리가 모자라요. 비교함에서 하나를 빼고 다시 눌러 주세요`);break}
   add.forEach(id=>S.cmp[id]=1);S.cpair=ids;S.screen='compare';S.csub=sub;S.crowXs={};S.resetTop=1;draw();say('둘 다 비교함에 담았어요');break}
  case'theme':{const [sub,k]=v.split(':');goList(sub);S.lsort='cat:'+k;S.keepTop=1;draw();break}
  case'demo1':Object.assign(S,{fav:{p1:true,m2:true,p3:true},recent:['p3','p1','p2'],recentSubs:['크림','프라이팬'],entry:null,hdomSet:false,hrank:null,pOff:false,screen:'home',resetTop:1});draw();break;
  case'demo0':S.cmp={};S.lastSub=null;S.screen='compare';S.csub=null;S.mega=null;S.resetTop=1;draw();break;
  case'demo':S.cmp={p1:1,m2:1,m12:1,p2:1};S.cpair=[];S.screen='compare';S.csub='프라이팬';S.crowXs={};S.resetTop=1;draw();break;
 }});
document.addEventListener('input',e=>{if(e.target.matches('.rng input'))rangeLive(e.target);else if(e.target.matches('[data-cq]'))catLive(e.target);else if(e.target.matches('[data-sq]'))searchLive(e.target)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.matches('[data-offer]')){const d=dealOf(t.dataset.offer),v=Math.round(+t.value||0);S.opsOffer[d.id]=v;
  const box=document.querySelector(`[data-vd="${d.id}"]`);if(box&&dReached(d))box.innerHTML=opsVerdictHtml(d,v);
  const b=document.querySelector(`[data-oo="${d.id}"]`);if(b){if(offerVerdict(d,v)==='open')b.removeAttribute('aria-disabled');else b.setAttribute('aria-disabled','true')}}});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.ops)return;const [k,id,i]=t.dataset.ops.split(':');
 if(k==='tier'){const dr=S.opsDraft[id];dr.tierN[+i]=Math.max(1,Math.round(+t.value||1))}
 else if(k==='days'){S.opsDraft[id].days=Math.min(60,Math.max(3,Math.round(+t.value||14)))}
 else if(k==='dtier'){const d=dealOf(id);d.tierN=(d.tierN||TIER_N0).slice();d.tierN[+i]=Math.max(1,Math.round(+t.value||1));say('인원 기준을 바꿨어요. 소비자 화면에 바로 반영돼요')}
 else if(k==='end'){S.opsEndDays[id]=Math.min(30,Math.max(1,Math.round(+t.value||5)))}
 else if(k==='link'){S.opsLink[id]=t.value}
 S.keepTop=1;draw()});
document.addEventListener('focusin',e=>{if(e.target.matches('.gsw [data-sq]')&&!S.sOpen){S.sOpen=true;S.mega=null;S.focusSearch=true;S.keepTop=1;draw()}});
document.addEventListener('change',e=>{if(e.target.matches('.rng input')){const [a,b,lo,hi]=rangeLive(e.target),F=e.target.closest('.rng').dataset.scope==='moa'?S.mf:S.f;
  F.pmin=a<=lo?null:a;F.pmax=b>=hi?null:b;S.keepTop=1;draw();return}
 const el=e.target.closest('[data-change]');if(!el)return;
 if(el.dataset.change==='msort'){S.msort=el.value;S.keepTop=1;draw();return}
 if(el.dataset.change==='lsort'){S.lsort=el.value;S.keepTop=1;draw()}});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-sq]')){
  if(e.key==='Enter'){e.preventDefault();submitSearch(e.target.value);return}
  if(e.key==='Escape'){if(e.target.value){e.target.value='';searchLive(e.target)}else if(S.sOpen){S.sOpen=false;S.keepTop=1;draw()}return}}
 if(e.key==='Escape'&&e.target.matches('[data-cq]')&&e.target.value){e.target.value='';catLive(e.target);return}
 if(e.key==='Escape'&&(S.mega||S.sheet)){S.mega=null;S.sheet=null;S.keepTop=1;draw()}});
window.addEventListener('resize',()=>{if(window.innerWidth<PCW&&S.view==='pc'){S.view='mo';draw()}else fitLeft()});
// 홈 검색창 예시 문구를 바꿔 가며 보여줌 (화면을 다시 그리지 않고 글자만 바꿈)
setInterval(()=>{document.querySelectorAll('[data-cd]').forEach(e=>{const d=dealOf(e.dataset.cd);if(d)e.textContent=ddayText(d)})},1000);
setInterval(()=>{S.phI++;document.querySelectorAll('[data-ph]').forEach(e=>e.textContent=`「${PH[S.phI%PH.length]}」`)},2800);
draw();
</script>
