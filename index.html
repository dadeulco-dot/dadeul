<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>다들 · DADEUL 프로토타입</title>
<style>
:root{
 --ink:#1B1B1D; --ink2:#3A3A3D; --ink3:#4A4A4E;
 --sub:#5F5F65; --meta:#76767D; --tiny:#8E8E96; --faint:#B0B0B8;
 --surface:#FFFFFF; --surface2:#F6F6F4;
 --line:#ECECEA; --line2:#F1F1EF; --line3:#E4E4E1;
 --brand:#0A5F49; --brandUp:#2AA07E; --brandBg:#E3F1EC;
 --accent:#B4552A; --accentBg:#FBEDE6;
 --pos:#4E9B7F; --bar2:#9A9AA0; --bar3:#C9B896; --bar4:#A98A72;
 --page:#F2F2F0; --panel:#FFFFFF;
 --tGreen:linear-gradient(155deg,#EAF1EE,#D6E4DE);
 --tSand:linear-gradient(155deg,#F5EFE7,#E5D9CB);
 --tGray:linear-gradient(155deg,#F0F0EF,#DEDEDC);
 --tWarm:linear-gradient(155deg,#F4EDE8,#E4D6CD);
 --glyph:rgba(27,27,29,.34);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 -webkit-font-smoothing:antialiased;color:var(--ink);line-height:1.6;background:var(--page);
 display:flex;justify-content:center;padding:24px 12px;min-height:100vh;min-height:100dvh;
 overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:transparent}
.phone{width:100%;max-width:390px;height:min(812px,calc(100vh - 48px));
 height:min(812px,calc(100dvh - 48px));background:var(--surface);border-radius:32px;
 overflow:hidden;display:flex;flex-direction:column;position:relative;
 box-shadow:0 0 0 .5px var(--line3),0 20px 50px -12px rgba(27,27,29,.16)}

/* 실제 모바일에서는 프레임을 없애고 화면을 꽉 채웁니다 */
@media (max-width:520px){
 body{padding:0;background:var(--surface)}
 .phone{max-width:none;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
 .tabs{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
 .bar:first-child{padding-top:calc(14px + env(safe-area-inset-top))}
 .drawer,.veil{position:fixed}
}
.bar{background:var(--surface);box-shadow:0 .5px 0 var(--line);padding:16px 20px 14px;flex-shrink:0;z-index:5}
.bar .line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar h1{font-size:16px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.body{flex:1;overflow-y:auto;position:relative;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.ptr{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-end;justify-content:center;
 pointer-events:none;z-index:9;overflow:hidden;height:0;opacity:0}
.ptr i{display:block;width:24px;height:24px;margin-bottom:13px;border-radius:50%;border:2px solid var(--line3);
 border-top-color:var(--brand);box-sizing:border-box}
.ptr.spin i{animation:sp .7s linear infinite}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface2) 50%,var(--surface2) 75%);
 background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
@keyframes sp{to{transform:rotate(360deg)}}
.body.pull{transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.body::-webkit-scrollbar{width:0}
.pad{padding:0 20px}
.sec{padding-top:30px}
.h1{font-size:23px;font-weight:700;letter-spacing:-.04em;line-height:1.36;color:var(--ink)}
.h2{font-size:17px;font-weight:700;letter-spacing:-.03em;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--brand);flex-shrink:0}
.h2.plain::before{display:none}
.h3{font-size:14px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.sub{font-size:13px;color:var(--sub);line-height:1.7}
.meta{font-size:12px;color:var(--meta);line-height:1.6}
.tiny{font-size:11px;color:var(--tiny);line-height:1.55}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:.5px solid var(--line);border-radius:14px;width:100%;display:block}
.soft{background:var(--surface2);border-radius:14px;width:100%;display:block}
.thumb{border-radius:11px;flex-shrink:0;box-shadow:inset 0 0 0 .5px rgba(27,27,29,.05)}
.pname{font-size:13px;font-weight:500;line-height:1.42;letter-spacing:-.02em;color:var(--ink);
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
 height:calc(1.42em * 2);margin-top:3px}
.pname1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:auto}
.btn{display:block;width:100%;border-radius:12px;padding:15px;text-align:center;font-size:15px;font-weight:700;letter-spacing:-.02em}
.teal{background:var(--brand);color:var(--surface)}
.dark{background:var(--ink);color:var(--surface)}
.amber{background:var(--accent);color:var(--surface)}
.ghost{border:1px solid var(--line3);color:var(--ink);font-weight:600;font-size:15px}
.chip{font-size:12px;border-radius:8px;padding:8px 14px;letter-spacing:-.01em;white-space:nowrap;flex-shrink:0;color:var(--ink3);background:var(--surface2);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--brand);color:var(--surface);font-weight:600}
.chip.sel{background:var(--brand);color:var(--surface);font-weight:500}
.badge{font-size:11px;border-radius:5px;padding:3.5px 8px;display:inline-block;font-weight:600;letter-spacing:-.01em}
.b-amber{color:var(--accent);background:var(--accentBg)}
.b-teal{color:var(--brand);background:var(--brandBg)}
.b-gray{color:var(--ink3);background:var(--surface2)}
.row{display:flex;justify-content:space-between;align-items:center}
.track{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.fill{height:5px;background:var(--brand);border-radius:3px}
.tabs{background:var(--surface);box-shadow:0 -.5px 0 var(--line);display:flex;padding:8px 0 14px;flex-shrink:0}
.tab{flex:1;text-align:center;color:var(--tiny);font-size:11px;font-weight:500;letter-spacing:-.02em;padding-top:2px}
.tab.on{color:var(--brand);font-weight:600}
.tab svg{display:block;margin:0 auto 2px}
.scroller,.scroller2{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
 scroll-snap-type:x proximity;scrollbar-width:none;scroll-padding-left:20px}
.scroller{gap:8px;padding:2px 0 4px 20px}
.scroller2{gap:11px;padding:2px 0 4px 20px}
.scroller>*,.scroller2>*{flex:0 0 auto;scroll-snap-align:start}
.scroller>.chip{justify-content:center;text-align:center}
.swrap{position:relative}
.swrap::after{content:"";position:absolute;top:0;right:0;bottom:6px;width:44px;pointer-events:none;
 background:linear-gradient(90deg,transparent,var(--panel) 72%);opacity:0;transition:opacity .22s}
.swrap.more::after{opacity:1}
.swrap::before{content:"";position:absolute;top:50%;right:9px;width:6px;height:6px;pointer-events:none;
 border-right:1.6px solid var(--faint);border-top:1.6px solid var(--faint);
 transform:translateY(-60%) rotate(45deg);opacity:0;transition:opacity .22s;z-index:2}
.swrap.more::before{opacity:1}
/* flex+overflow에서 마지막 padding-right가 먹지 않아 스페이서로 대체 */
.scroller::after,.scroller2::after{content:"";flex:0 0 20px;height:1px}
.scroller::-webkit-scrollbar,.scroller2::-webkit-scrollbar{height:0;display:none}
.chiprow{margin-top:14px;margin-bottom:2px}
.veil{position:absolute;inset:0;background:var(--glyph);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--surface);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;padding-bottom:20px;
 will-change:transform;touch-action:pan-y}
.sheet.snap{transition:transform .24s cubic-bezier(.2,.7,.3,1)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line3);margin:11px auto 4px}
.grabzone{padding:2px 0 6px;cursor:grab}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line3);margin:11px auto 4px}
.field{background:var(--surface);border:1px solid var(--line3);border-radius:10px;padding:12px 13px;font-size:16px !important;width:100%;color:var(--ink)}
input,textarea,select{font-size:16px !important}
.field::placeholder{color:var(--tiny)}
.opt{border:.5px solid var(--line3);background:var(--surface);border-radius:12px;padding:12px 15px;width:100%;
 display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.opt.on{border:1.5px solid var(--brand);background:var(--brandBg)}
.toast{position:absolute;left:18px;right:18px;bottom:86px;background:var(--ink);color:var(--surface);border-radius:12px;
 padding:13px 15px;font-size:12.5px;z-index:30}
.quote{border-left:2px solid var(--line3);padding-left:11px;font-size:12px;color:var(--ink3);line-height:1.8}
.hint{background:var(--surface2);border-radius:11px;padding:12px 13px}
@keyframes pin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.drawer{position:absolute;inset:0;z-index:25;display:flex}
.dpanel{width:82%;max-width:300px;background:var(--surface);height:100%;overflow-y:auto;box-shadow:6px 0 24px -8px rgba(27,27,29,.18)}
.dpanel::-webkit-scrollbar{width:0}
.drow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:13.5px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ptab{flex:1;text-align:center;padding:13px 0;font-size:14px;font-weight:600;color:var(--meta);border-bottom:2px solid transparent;letter-spacing:-.02em}
.ptab.on{color:var(--brand);font-weight:700;border-bottom-color:var(--brand)}

/* ── 다크 모드 (반드시 마지막에 위치) ── */
@media (prefers-color-scheme:dark){
 :root{
  --ink:#F3F3F5; --ink2:#DCDCE0; --ink3:#C4C4CA;
  --sub:#B0B0B8; --meta:#9E9EA6; --tiny:#8A8A93; --faint:#68686F;
  --surface:#1B1B1F; --surface2:#25252A;
  --line:#2E2E34; --line2:#2A2A30; --line3:#3A3A42;
  --brand:#3FB894; --brandUp:#5FCFAE; --brandBg:#173A31;
  --accent:#E8A176; --accentBg:#3A2820;
  --pos:#5FCFAE; --bar2:#8A8A92; --bar3:#9A8B6E; --bar4:#8C7360;
  --page:#0E0E10; --panel:#141417;
  --tGreen:linear-gradient(155deg,#24352F,#1B2A25);
  --tSand:linear-gradient(155deg,#33302A,#26231E);
  --tGray:linear-gradient(155deg,#2B2B2F,#212125);
  --tWarm:linear-gradient(155deg,#332C28,#26211E);
  --glyph:rgba(243,243,245,.42);
 }
 body{background:var(--page)}
 .phone{background:var(--panel);box-shadow:0 0 0 .5px var(--line),0 20px 50px -12px rgba(0,0,0,.6)}
 .bar,.tabs{background:var(--panel)}
 .sheet,.dpanel{background:var(--panel)}
 .grab{background:var(--line3)}
 .field::placeholder{color:var(--faint)}
 .chip.on,.chip.sel{background:var(--brand);color:#0E0E10}
 .teal{background:var(--brand);color:#0E1512}
 .toast{background:var(--ink);color:var(--page)}
 .b-teal{color:#8FE0C4;background:#173A31}
 .b-amber{color:#F0B78F;background:#3A2820}
 .b-gray{color:#B8B8BE;background:#2E2E34}
 .skel{background:linear-gradient(90deg,#25252A 25%,#2E2E34 50%,#25252A 75%)}
 .ptr i{border-color:var(--line3);border-top-color:var(--brand)}
 .veil{background:rgba(0,0,0,.6)}
}
</style>
</head>
<body>
<div class="phone" id="app"></div>

<script>

const ic=(n,s=18,c='var(--meta)',w=1.7)=>`<svg role="img" aria-label="${ICL[n]||''}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IP[n].split('M').filter(Boolean).map(d=>`<path d="M${d}"/>`).join('')}</svg>`;
const isDark=()=>typeof matchMedia!=='undefined'&&matchMedia('(prefers-color-scheme:dark)').matches;
const mark=(s=20,c)=>{c=c||(isDark()?'var(--brandUp)':'var(--brand)');const u='k'+Math.random().toString(36).slice(2,7);return`<svg role="img" aria-label="다들" width="${s}" height="${s}" viewBox="0 0 64 64"><defs><clipPath id="${u}"><path d="M56 10 L48 10 A22 22 0 0 0 48 54 L56 54 Z"/></clipPath></defs><path d="M9 11 L16 10.5 A22 22 0 0 1 16 53.5 L9 53 Z" fill="none" stroke="${c}" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M55 11 L48 10.5 A22 22 0 0 0 48 53.5 L55 53 Z" fill="none" stroke="${c}" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/><g clip-path="url(#${u})"><path d="M9 11 L16 10.5 A22 22 0 0 1 16 53.5 L9 53 Z" fill="${c}"/></g></svg>`};
const GLY={

 pot:'<path d="M16 29h32v12.5a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6z" fill="var(--surface)" fill-opacity=".66"/><path d="M16 29h32v12.5a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6z"/><path d="M12.5 25h39" stroke-width="4.2"/><path d="M32 17.5v5.5"/><circle cx="32" cy="15" r="2.6" fill="var(--surface)" fill-opacity=".9"/><path d="M16 34h-4.5M48 34h4.5"/><path d="M23 35v6" stroke-opacity=".3"/>',
 wok:'<path d="M11 26.5a21 21 0 0 0 42 0z" fill="var(--surface)" fill-opacity=".66"/><path d="M11 26.5a21 21 0 0 0 42 0z"/><path d="M8 26.5h48" stroke-width="3.2"/><path d="M53.5 24l8-4" stroke-width="4.4"/><path d="M22 32a10 10 0 0 0 20 0" stroke-opacity=".38"/>',
 knife:'<path d="M20.5 38.5L44 15l5 5-23.5 23.5z" fill="var(--surface)" fill-opacity=".66"/><path d="M20.5 38.5L44 15l5 5-23.5 23.5z"/><path d="M20.5 38.5l-7 7a3.6 3.6 0 0 0 5 5l7-7z" fill="var(--surface)" fill-opacity=".92"/><path d="M27 32L44 15" stroke-opacity=".33"/>',
 tool:'<path d="M20 46L38 20" stroke-width="4.4"/><path d="M34 14c5-4 12-3 15 2s2 12-3 15z" fill="var(--surface)" fill-opacity=".66"/><circle cx="19" cy="47" r="3.4" fill="var(--surface)" fill-opacity=".9"/>',
 bake:'<path d="M14 30h36v12a5 5 0 0 1-5 5H19a5 5 0 0 1-5-5z" fill="var(--surface)" fill-opacity=".66"/><path d="M14 30h36v12a5 5 0 0 1-5 5H19a5 5 0 0 1-5-5z"/><path d="M18 30c0-6 4-9 8-9M32 30c0-6 4-9 8-9" stroke-opacity=".45"/>',

 appl:'<rect x="16" y="16" width="32" height="34" rx="5" fill="var(--surface)" fill-opacity=".66"/><rect x="16" y="16" width="32" height="34" rx="5"/><rect x="22" y="23" width="20" height="14" rx="3" stroke-opacity=".45"/><circle cx="40" cy="44" r="2.4"/>',

const TINT={green:'var(--tGreen)',sand:'var(--tSand)',gray:'var(--tGray)',warm:'var(--tWarm)'};
const th=(x,s=46)=>{const t=typeof x==='string'?x:x.tint,c=typeof x==='string'?null:x.cat;
 return `<div class="thumb" style="width:${s}px;height:${s}px;background:${TINT[t]};display:flex;align-items:center;justify-content:center">`+
 (c?`<svg width="${Math.round(s*.6)}" height="${Math.round(s*.6)}" viewBox="0 0 64 64" fill="none" stroke="var(--glyph)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${GLY[c]}</svg>`:'')+`</div>`};

/* ── 데이터 ── */
const CH={kakao:'카카오톡',naver:'네이버',phone:'휴대폰'};
const CATS=[
 {k:'조리팬',   d:'주방용품', g:'pan',   subs:['프라이팬','웍','궁중팬','계란말이팬','그릴팬','전골팬']},
 {k:'냄비·솥', d:'주방용품', g:'pot',   subs:['편수냄비','양수냄비','전골냄비','압력솥','밥솥·곰솥','주전자']},
 {k:'무쇠·주물', d:'주방용품',g:'grill', subs:['무쇠팬','더치오븐','그리들','석쇠·불판']},

 // 누적 수요 곡선 — 가격이 낮을수록 사람이 많아지고, 최하단이 전체 대기 인원

  price:Math.round(v/100)*100,

  ok:Math.round(total*ratio[i])>=GOAL }));
};

const match=(text,q)=>{if(!q)return true;

 <div class="swrap"><div class="scroller chiprow" style="margin-top:16px">
 ${Object.keys(LS).map(x=>`<span class="chip ${k===x?'on':''}" data-a="lsort:${x}">${LS[x][0]}</span>`).join('')}</div></div>

const peeked=new Set();
function equalizeChips(){
 document.querySelectorAll('.scroller').forEach(sc=>{
  const chips=[...sc.children].filter(el=>el.classList.contains('chip'));
  if(chips.length<2)return;
  chips.forEach(c=>{c.style.minWidth='';c.style.width=''});
  const cap=Math.round(sc.clientWidth*0.56);
  let max=0; chips.forEach(c=>{max=Math.max(max,Math.ceil(c.getBoundingClientRect().width))});
  const w=Math.min(max,cap);
  chips.forEach(c=>{c.style.minWidth=w+'px'});
  const wrap=sc.parentElement;
  const more=sc.scrollWidth-sc.clientWidth>4;
  if(wrap&&wrap.classList.contains('swrap')){
   wrap.classList.toggle('more',more);
   sc.onscroll=()=>{wrap.classList.toggle('more',sc.scrollWidth-sc.scrollLeft-sc.clientWidth>4)};
  }
  if(!more)return;

  // 선택된 칩이 화면 밖이면 안으로 데려옴 (다음 칩도 살짝 보이게)
  const on=chips.find(c=>c.classList.contains('on')||c.classList.contains('sel'));
  if(on){
   const L=on.offsetLeft, R=L+on.offsetWidth;
   const vL=sc.scrollLeft, vR=vL+sc.clientWidth;
   if(L<vL+20) sc.scrollTo({left:Math.max(0,L-20),behavior:'smooth'});
   else if(R>vR-30) sc.scrollTo({left:R-sc.clientWidth+44,behavior:'smooth'});
  }

  // 처음 열릴 때 한 번만: 살짝 밀었다 되돌아와 "더 있다"를 알림
  const key=sc.dataset.pk||(sc.dataset.pk=[...chips].map(c=>c.textContent.trim()).join('|'));
  if(!peeked.has(key)&&sc.scrollLeft<2){
   peeked.add(key);
   setTimeout(()=>{
    sc.scrollTo({left:26,behavior:'smooth'});
    setTimeout(()=>sc.scrollTo({left:0,behavior:'smooth'}),380);
   },420);
  }
 });
}

function bindSheet(){
 const sh=document.querySelector('.sheet'); if(!sh)return;
 let y0=null, dy=0, fromTop=false;
 const grab=sh.querySelector('.grabzone');
 const reset=()=>{sh.classList.add('snap');sh.style.transform='';y0=null;dy=0};
 const start=e=>{
  const t=e.touches?e.touches[0]:e;
  // 손잡이를 잡았거나, 시트가 맨 위까지 스크롤된 상태일 때만
  fromTop = (grab&&grab.contains(e.target)) || sh.scrollTop<=0;
  if(!fromTop){y0=null;return}
  y0=t.clientY; dy=0; sh.classList.remove('snap');
 };
 const move=e=>{
  if(y0===null)return;
  const t=e.touches?e.touches[0]:e;
  dy=t.clientY-y0;
  if(dy<=0){sh.style.transform='';return}
  sh.style.transform='translateY('+dy+'px)';
 };
 const end=()=>{
  if(y0===null)return;
  const h=sh.offsetHeight||400;
  if(dy>Math.min(150,h*0.28)){                 // 충분히 내렸으면 닫기
   sh.classList.add('snap');
   sh.style.transform='translateY(100%)';
   setTimeout(()=>{back()},200);
  } else reset();
  y0=null;
 };
 sh.addEventListener('touchstart',start,{passive:true});
 sh.addEventListener('touchmove',move,{passive:true});
 sh.addEventListener('touchend',end,{passive:true});
 sh.addEventListener('touchcancel',end,{passive:true});
 // PC 확인용
 if(grab){
  grab.addEventListener('mousedown',e=>{start(e);
   const mm=ev=>move(ev), mu=()=>{end();document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu)};
   document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);});
 }
}

function bindPull(){
 const b=document.querySelector('.body'); if(!b)return;
 let y0=null, dy=0, ready=0;
 const ind=b.querySelector('.ptr');
 const reset=()=>{b.classList.add('pull');b.style.transform='';if(ind)ind.style.height='0px';y0=null;dy=0;ready=0};
 b.addEventListener('touchstart',e=>{
  if(busy)return;
  if(b.scrollTop<=0){y0=e.touches[0].clientY;b.classList.remove('pull')} else y0=null;
 },{passive:true});
 b.addEventListener('touchmove',e=>{
  if(y0===null||busy)return;
  dy=e.touches[0].clientY-y0;
  if(dy<=0){reset();return}
  const d=Math.min(96,dy*0.48);
  b.style.transform='translateY('+d+'px)';
  if(ind){ind.style.height=d+'px';ind.style.opacity=Math.min(1,d/44)}
  ready = d>=44;
 },{passive:true});
 b.addEventListener('touchend',()=>{
  if(y0===null||busy)return;
  if(ready){b.classList.add('pull');refresh()} else reset();
  y0=null;
 },{passive:true});
 // 마우스 휠로도 확인 가능하게
 let acc=0,t=null;
 b.addEventListener('wheel',e=>{
  if(busy||b.scrollTop>0||e.deltaY>=0){acc=0;return}
  acc+=-e.deltaY;
  if(ind){const d=Math.min(96,acc*0.5);ind.style.height=d+'px';ind.style.opacity=Math.min(1,d/44)}
  clearTimeout(t); t=setTimeout(()=>{
   if(acc>=88){refresh()} else if(ind){ind.style.height='0px'}
   acc=0;
  },170);
 },{passive:true});
}

function draw(){const c=cur();
 const html=(c.s==='product'?V.product(c.id):c.s==='deal'?V.deal(c.id):c.s==='verify'?V.verify(c.id)
  :c.s==='report'?V.report(c.id):['wait','verified','reported'].includes(c.s)?V.done(c.s,c.id):(V[c.s]||V.home)());
 document.getElementById('app').innerHTML=html.replace('<div class="body">','<div class="body"><div class="ptr"><i></i></div>')+(S.drawer?V.drawer():'')+sheetHTML()+(S.toast?`<div class="toast">${S.toast}</div>`:'');
 const q=document.getElementById('q');
 if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);
  let qIme=0;
  q.addEventListener('compositionstart',()=>{qIme=1});
  q.addEventListener('compositionend',e=>{qIme=0;S.q=e.target.value;
   const r=document.getElementById('results');if(r)r.innerHTML=searchResults()});
  q.oninput=e=>{S.q=e.target.value;if(qIme)return;
   const r=document.getElementById('results');if(r)r.innerHTML=searchResults()}}
 const cq=document.getElementById('cq');
 if(cq){cq.focus();cq.setSelectionRange(cq.value.length,cq.value.length);
  let cIme=0;
  cq.addEventListener('compositionstart',()=>{cIme=1});
  cq.addEventListener('compositionend',e=>{cIme=0;S.cq=e.target.value;
   const r=document.getElementById('cres');if(r)r.innerHTML=cmpResults()});
  cq.oninput=e=>{S.cq=e.target.value;if(cIme)return;
   const r=document.getElementById('cres');if(r)r.innerHTML=cmpResults()}}
 const ct=document.getElementById('contact');
 if(ct)ct.oninput=e=>{S.contact=e.target.value};
 bindPull();
 bindSheet();
 equalizeChips();
}

document.getElementById('app').addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 if(t.hasAttribute('data-stop'))return;
 const raw=t.getAttribute('data-a');const i=raw.indexOf(':');
 const a=i<0?raw:raw.slice(0,i), v=i<0?'':raw.slice(i+1);
 e.stopPropagation();
 switch(a){
  case'back':back();break;
  case'root':S.drawer=0;S.sheet=null;S.stack=[{s:v}];S.tab=v;pushHist();draw();break;
  case'noti':S.drawer=0;S.unread=0;go('noti');break;
  case'search':S.drawer=0;go('search');break;
  case'list':{S.drawer=0;S.lsort='verdict';S.lmore=0;S.lcat=v||'조리팬';
   S.lrecent=[S.lcat,...(S.lrecent||[]).filter(x=>x!==S.lcat)].slice(0,3);
   go('list');break}
  case'excluded':S.drawer=0;go('excluded');break;
  case'method':S.drawer=0;go('method');break;
  case'log':S.drawer=0;go('log');break;
  case'rules':S.drawer=0;go('rules');break;
  case'compare':S.drawer=0;go('compare');break;
  case'product':S.ptab='rev';S.drawer=0;go('product',v);break;
  case'deal':S.drawer=0;go('deal',v);break;
  case'report':S.drawer=0;go('report',v);break;
  case'price':S.tmp=S.waits[v]||null;S.sheet='price:'+v;pushHist();draw();break;
  case'pick2':S.tmp=Number(v);draw();break;
  case'toLogin':if(!S.tmp)break;S.pending={kind:'wait',id:v,price:S.tmp};
   if(S.user){finish()}else{S.sheet='login:'+v};draw();break;
  case'toLoginSheet':S.sheet='login:'+(S.pending?S.pending.id:'p1');draw();break;
  case'oauth':S.user={ch:v,id:v==='kakao'?'카카오 계정':'네이버 계정'};S.contact=S.contact||(v==='kakao'?'카카오톡 알림':'네이버 이메일');finish();break;
  case'docode':{const c=document.getElementById('contact');const val=c?c.value.trim():'';
   if(!val){say('번호를 적어주세요');break}S.user={ch:'phone',id:val};S.contact=val;S.sheet=null;finish();break}
  case'logout':S.user=null;if(S.sheet){S.sheet=null;popHist()}say('로그아웃했어요');break;
  case'leave':S.sheet=null;say('판매처로 이동했다고 가정할게요');setTimeout(()=>go('verify',v),900);break;
  case'closeSheet':S.sheet=null;popHist();draw();break;
  case'admin':S.drawer=0;S.atab='cand';go('admin');break;
  case'atab':S.atab=v;draw();break;
  case'appr':S.appr[v]=!S.appr[v];draw();break;
  case'runJob':if(Object.values(S.appr).filter(Boolean).length){S.atab='job';draw();say('수집을 시작했어요. 밤사이 돌아갑니다')}break;
  case'audit':{const[i,ok]=v.split(':');S.aud[i]=Number(ok);draw();break}
  case'doverify':if(!S.user){S.pending={kind:'verify',id:v};S.sheet='login:'+v;pushHist();draw();break}S.bought[v]=1;go('verified',v);break;
  case'doreport':go('reported',v);break;
  case'pick':S.picks=S.picks.includes(v)?S.picks.filter(x=>x!==v):[...S.picks,v].slice(-4);
   document.getElementById('results').innerHTML=searchResults();draw();break;
  case'filter':S.filters=S.filters.includes(v)?S.filters.filter(x=>x!==v):[...S.filters,v];draw();break;
  case'req':S.reqDone=S.q.trim();draw();say('요청 접수됐어요');break;
  case'seg':S.mine=Number(v);draw();break;
  case'toggle':S.noti[v]=S.noti[v]?0:1;draw();break;
  case'editContact':S.sheet='edit:x';pushHist();draw();break;
  case'loginSheet':S.sheet='login:p1';pushHist();draw();break;
  case'openDrawer':S.drawer=1;S.sec=null;S.opencat=null;pushHist();draw();break;
  case'closeDrawer':S.drawer=0;draw();break;
  case'toggleCat':S.opencat=S.opencat===v?null:v;draw();break;
  case'toggleBrand':S.openbrand=S.openbrand?0:1;draw();break;
  case'view':S.drawer=0;S.view=v;S.cat='전체';S.brand=null;
   if(cur().s!=='home'){S.stack=[{s:'home'}];S.tab='home'}draw();break;
  case'clearFilter':S.cat='전체';S.brand=null;S.view='grid';draw();break;
  case'goHome':{const atHome=cur().s==='home'&&S.view==='grid'&&S.cat==='전체'&&!S.brand;
   S.drawer=0;S.sheet=null;S.view='grid';S.cat='전체';S.brand=null;S.stack=[{s:'home'}];S.tab='home';
   if(atHome){refresh()}else{draw();const b=document.querySelector('.body');if(b)b.scrollTop=0}
   break}
  case'cat':S.cat=v;S.brand=null;S.view='grid';S.drawer=0;
   if(cur().s!=='home'){S.stack=[{s:'home'}];S.tab='home'}draw();break;
  case'brandStat':{const[bn,st]=v.split(':');S.brand=bn;S.cat='전체';S.view='grid';S.drawer=0;S.glist=st;
   S.stack=[{s:'home'}];S.tab='home';go('glist');break}
  case'brandSel':S.brand=v||null;S.cat='전체';S.view='grid';S.drawer=0;
   if(cur().s!=='home'){S.stack=[{s:'home'}];S.tab='home'}draw();break;
  case'ptab':S.ptab=v;draw();break;
  case'csort':S.csort=v;draw();break;
  case'cdom':S.cdom=v;S.cq='';draw();break;
  case'cmpSearch':go('cmpSearch');break;
  case'cmpClear':S.cq='';draw();break;
  case'lsort':S.lsort=v;S.lmore=0;draw();break;
  case'lmore':S.lmore=1;draw();break;
  case'toggleFoot':S.foot=S.foot?0:1;draw();break;
  case'openFilter':S.sheet='filter:x';pushHist();draw();break;
  case'toggleFcat':S.fcat=S.fcat?0:1;draw();break;
  case'openSort':S.sheet='sort:x';pushHist();draw();break;
  case'setSort':S.sort=v;S.sheet=null;popHist();draw();break;
  case'clearFilters':S.filters=[];draw();break;
  case'toggleDone':{const cu=S.doneShow[v]??byId(v).showInNone;S.doneShow[v]=!cu;
   draw();say(!cu?'홈에 다시 노출합니다':'홈에서 내렸어요');break}
  case'toggleSec':S.sec=S.sec===v?null:v;draw();break;
  case'rax':S.rax=v;S.rpick=null;draw();break;
  case'rpick':S.rpick=v;draw();const bb=document.querySelector('.body');if(bb)bb.scrollTop=0;break;
  case'rgo':{const[ax,name,sort]=v.split(':');
   if(ax==='cat'){S.cat=name;S.brand=null}else{S.brand=name;S.cat='전체'}
   S.rlist=sort;go('rlist');break}
  case'rcat':S.cat=v;S.brand=null;S.rlist='many';go('rlist');break;
  case'rbrand':S.drawer=0;S.brand=v;S.cat='전체';S.rlist='many';go('rlist');break;
  case'rlist':S.drawer=0;if(cur().s==='rlist'){S.rlist=v;draw()}else{S.rlist=v;go('rlist')}break;
  case'glist':S.drawer=0;if(cur().s==='glist'){S.glist=v;draw()}else{S.glist=v;go('glist')}break;
  case'official':S.sheet='site:'+v;pushHist();draw();break;
  case'askPublish':S.sheet='pub:x';pushHist();draw();break;
  case'doPublish':S.pubState='live';S.sheet=null;popHist();draw();say('발행했어요. 다들 카드가 올라가요');break;
  case'unpublish':S.sheet='unpub:x';pushHist();draw();break;
  case'doUnpublish':S.pubState='wait';S.sheet=null;popHist();draw();say('회수했어요. 정정 이력에 남겼습니다');break;
  case'saveContact':{const c=document.getElementById('contact');S.contact=c?c.value.trim():S.contact;S.sheet=null;popHist();draw();say('저장했어요');break}
  case'say':say(v);break;
 }
});
try{history.replaceState({d:1},'')}catch(e){}
window.addEventListener('popstate',()=>{
 navLock=1;
 if(!popView()){ /* 최상단이면 그대로 두되 히스토리 유지 */ try{history.pushState({d:1},'')}catch(e){} }
 setTimeout(()=>{navLock=0},60);
});
draw();
</script>
