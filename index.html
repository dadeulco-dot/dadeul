<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<title>다들 · 리뷰 서비스 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
/* ── 토큰 ─────────────────────────────────────────────
   글자색은 흰 배경 대비 4.5:1 이상만 씁니다 (--faint 는 선·막대 전용)
   --sub #5F5F65 약 6.3:1 · --meta #6E6E75 약 5.1:1 · --tiny #737379 약 4.7:1 */
:root{
 --ink:#1B1B1D; --ink2:#3A3A3D; --sub:#5F5F65; --meta:#6E6E75; --tiny:#737379; --faint:#C9C9CF;
 --surface:#FFFFFF; --surface2:#F5F5F3; --line:#ECECEA; --line2:#F2F2F0;
 --brand:#0A5F49; --brandBg:#E6F2ED; --accent:#B4552A; --accentBg:#FBEDE6;
 --good:#0A5F49; --bad:#9A9AA0; --badBg:#F0F0EE; --star:#E8A33D;
 --page:#EFEFED; --veil:rgba(20,20,22,.42);
 --tGreen:linear-gradient(150deg,#EEF4F1,#D9E7E1); --tSand:linear-gradient(150deg,#F7F1EA,#E9DDCF); --tGray:linear-gradient(150deg,#F2F2F1,#E0E0DE);
}
@media (prefers-color-scheme:dark){:root{
 --ink:#F3F3F5; --ink2:#DEDEE2; --sub:#B6B6BE; --meta:#A6A6AE; --tiny:#9C9CA4; --faint:#4A4A52;
 --surface:#18181B; --surface2:#232327; --line:#2E2E33; --line2:#29292E;
 --brand:#4CC39F; --brandBg:#16362D; --accent:#E8A176; --accentBg:#3A2820;
 --good:#4CC39F; --bad:#7C7C84; --badBg:#2A2A2F; --star:#F0B85A;
 --page:#0E0E10; --veil:rgba(0,0,0,.6);
 --tGreen:linear-gradient(150deg,#22332D,#1A2823); --tSand:linear-gradient(150deg,#332E27,#27231E); --tGray:linear-gradient(150deg,#2A2A2E,#212124);
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 -webkit-font-smoothing:antialiased;color:var(--ink);background:var(--page);line-height:1.55;
 word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty;
 display:flex;justify-content:center;align-items:flex-start;padding:20px 12px;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.num{font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:normal}

/* ── 화면 틀: PC 에서는 휴대폰 모양, 모바일에서는 꽉 채움 ── */
.phone{width:100%;max-width:390px;height:min(844px,calc(100dvh - 40px));background:var(--surface);border-radius:30px;
 overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 .5px var(--line),0 24px 60px -18px rgba(0,0,0,.22)}
@media (max-width:520px){body{padding:0;background:var(--surface)}.phone{max-width:none;height:100dvh;border-radius:0;box-shadow:none}}

/* 프로토타입 전용 띠 — 서비스 화면이 아님 */
.proto{flex-shrink:0;background:var(--surface2);border-bottom:.5px solid var(--line);padding:6px 14px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
.proto .lab{font-size:12px;color:var(--meta);flex-shrink:0;align-self:center;padding-right:2px}
.proto .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.proto .row::-webkit-scrollbar{display:none}
.pchip{flex-shrink:0;font-size:12px;padding:6px 10px;border-radius:8px;background:var(--surface);color:var(--ink2);border:.5px solid var(--line)}
.pchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.top{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:10px 10px;border-bottom:.5px solid var(--line);background:var(--surface)}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
.ib:active{background:var(--surface2)}
.sbox{flex:1;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--meta);font-size:15px}

.scr{flex:1;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;position:relative}
.scr::-webkit-scrollbar{width:0}
.pad{padding-left:20px;padding-right:20px}

/* ── 글자 위계: 결론 · 근거 · 출처 세 단계 ── */
.t-title{font-size:22px;font-weight:700;letter-spacing:-.035em;line-height:1.3}
.t-num{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.t-h{font-size:18px;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.t-body{font-size:15px;letter-spacing:-.02em;line-height:1.55}
.t-sub{font-size:13px;color:var(--sub);line-height:1.55}
.t-cap{font-size:12px;color:var(--tiny);line-height:1.55}
.t-title,.t-h,.t-sub,.t-cap{text-wrap:balance}

.crumb{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--meta);padding-top:8px;flex-wrap:wrap}
.crumb button{color:var(--meta);min-height:32px;display:inline-flex;align-items:center}
.crumb b{color:var(--ink2);font-weight:600}
.head{display:flex;gap:14px;align-items:center;padding-top:6px}
.thumb{width:76px;height:76px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}

/* 다들 카드 */
.dcard{margin-top:14px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.dcols{display:flex}
.dcol{flex:1;min-width:0;padding:14px 16px 12px}
.dcol+.dcol{border-left:1px solid var(--line)}
.dk{font-size:12px;color:var(--meta);display:flex;align-items:center;gap:5px;font-weight:600}
.dmsg{border-top:1px solid var(--line);padding:11px 16px 12px;background:var(--surface2)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:9px}
.prog i{display:block;height:6px;background:var(--sub);border-radius:3px}

/* 좋다 · 아쉽다 */
.hl{margin-top:18px}
.hlh{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.pt{display:flex;align-items:flex-start;gap:10px;padding:6px 0}
.pt+.pt{border-top:.5px solid var(--line2)}
.pt .tx{flex:1;min-width:0}
.pt .ct{font-size:13px;color:var(--sub);flex-shrink:0;padding-top:2px;text-align:right}
.mk{width:20px;height:20px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.mk.g{background:var(--brandBg)}.mk.b{background:var(--badBg)}
.tnote{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--tiny);margin-top:2px}

.cta{margin-top:14px;width:100%;min-height:52px;border-radius:14px;background:var(--brandBg);color:var(--brand);
 display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:15px;font-weight:700;letter-spacing:-.02em}

/* 후기 카테고리 칩 — 위에 고정 */
.chips{position:sticky;top:0;z-index:4;background:var(--surface);border-top:8px solid var(--surface2);border-bottom:.5px solid var(--line);margin-top:24px}
.crow{display:flex;gap:6px;overflow-x:auto;padding:12px 20px 10px;scrollbar-width:none;position:relative}.crow::-webkit-scrollbar{display:none}
/* 가로 스크롤에서 마지막 여백이 먹지 않는 문제 → 끝에 빈 칸을 둠 */
.crow::after{content:"";flex:0 0 14px}
.crow .chip.on,.kwrap .chip.on,.fchips .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.cwrap{position:relative}
.carr{position:absolute;top:0;bottom:0;width:60px;display:none;align-items:center;z-index:2;pointer-events:none}
.carr.l{left:0;justify-content:flex-start;padding-left:8px;background:linear-gradient(90deg,var(--surface) 50%,transparent)}
.carr.r{right:0;justify-content:flex-end;padding-right:8px;background:linear-gradient(270deg,var(--surface) 50%,transparent)}
.carr.show{display:flex}
.carr button{pointer-events:auto;width:36px;height:36px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px -3px rgba(0,0,0,.25)}
.carr button:hover{background:var(--surface2)}
/* 휴대폰(터치)에서는 버튼 없이 흐려지는 가장자리만 — 밀어서 넘기라는 힌트 */
@media (hover:none){.carr{width:36px;padding:0}.carr button{display:none}}
@media (prefers-color-scheme:dark){.crow .chip.on,.kwrap .chip.on,.fchips .chip.on{color:#0E1512}}
.chip{flex-shrink:0;min-height:36px;padding:0 13px;border-radius:18px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip.exp{background:transparent;border:1px solid var(--line);font-weight:500;color:var(--sub)}
.csep{flex-shrink:0;width:1px;background:var(--line);margin:6px 4px}
.mtog{display:flex;align-items:center;justify-content:space-between;padding:0 20px 11px;font-size:13px;color:var(--ink2)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--faint);position:relative;flex-shrink:0;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--brand)}.sw.on i{left:21px}

/* 카테고리 블록 */
.cat{padding:22px 20px 20px;border-bottom:.5px solid var(--line);scroll-margin-top:96px}
.chd{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.chd .t-h{white-space:nowrap}
.tier{font-size:12px;color:var(--ink2);background:var(--surface2);border-radius:6px;padding:4px 8px;flex-shrink:0;white-space:nowrap}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line2);margin-top:10px}
.bar i{display:block;height:100%}.bar .g{background:var(--good)}.bar .b{background:var(--bad)}
.stat{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.more{margin-top:10px;display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;color:var(--brand);min-height:36px}

.sect{padding:26px 20px 6px;scroll-margin-top:96px}
.sect.gray{background:var(--surface2)}
.rowbtn{width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 20px;border-bottom:.5px solid var(--line)}
.ln{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
.why{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px;color:var(--ink2)}
.why+.why{border-top:.5px solid var(--line)}
.why .w{height:4px;border-radius:2px;background:var(--faint);margin-top:5px}

.hs{display:flex;gap:10px;overflow-x:auto;padding:12px 20px 4px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.mini{flex:0 0 136px}
.mini .th{width:136px;height:104px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mini .nm{font-size:13px;font-weight:500;line-height:1.4;margin-top:7px;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.dot{width:7px;height:7px;border-radius:4px;display:inline-block;flex-shrink:0}

.foot{padding:22px 20px 28px}
.foot .t-cap{padding:2px 0}

/* 하단 고정 */
.bottom{flex-shrink:0;display:flex;gap:8px;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--line);background:var(--surface)}
.sq{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex-shrink:0;font-size:12px;color:var(--ink2);line-height:1.2}
.main{flex:1;min-width:0;height:52px;border-radius:14px;background:var(--brand);color:#fff;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;font-weight:700;letter-spacing:-.02em;text-align:center}
.main.on{background:var(--surface2);color:var(--brand);border:1px solid var(--brand)}
@media (prefers-color-scheme:dark){.main{color:#0E1512}}

.veil{position:absolute;inset:0;background:var(--veil);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:82%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 0 24px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;background:var(--ink);color:var(--surface);border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.5}
.warn{background:var(--accentBg);color:var(--ink);font-size:12px;padding:8px 14px}

/* ════ PC (1024px 이상) — 같은 데이터, 다른 배치 ════
   글자는 모바일보다 1~2px 크게: 결론 26 · 숫자 28 · 제목 20 · 본문 16 · 보조 14 · 출처 13 */
body.pcmode{display:block;padding:0;background:var(--surface)}
.pcroot{min-height:100vh;background:var(--surface);position:relative}
.pcroot .t-title{font-size:26px}.pcroot .t-num{font-size:28px}.pcroot .t-h{font-size:20px}
.pcroot .t-body{font-size:16px}.pcroot .t-sub{font-size:14px}.pcroot .t-cap{font-size:13px}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.pproto{background:var(--surface2);border-bottom:.5px solid var(--line)}
.pproto .wrap{display:flex;align-items:center;gap:8px;height:44px;overflow-x:auto;scrollbar-width:none}.pproto .wrap::-webkit-scrollbar{display:none}
.pproto .pchip{flex-shrink:0}
.pproto .lab{font-size:13px;color:var(--meta);margin-right:4px;white-space:nowrap;flex-shrink:0}
.vseg{margin-left:auto;display:flex;background:var(--surface);border:.5px solid var(--line);border-radius:9px;padding:2px}
.vseg button{font-size:13px;padding:5px 12px;border-radius:7px;color:var(--sub)}.vseg button.on{background:var(--ink);color:var(--surface)}
.gnb{position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
.gnb .wrap{display:flex;align-items:center;gap:22px;height:68px}
.logo{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:700;letter-spacing:-.04em}
.menu{display:flex;gap:2px}
.menu button{height:44px;padding:0 14px;border-radius:10px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:4px;color:var(--ink2)}
.menu button:hover,.menu button.on{background:var(--surface2);color:var(--ink)}
.gsearch{flex:1;max-width:540px;height:46px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--meta);font-size:16px}
.gright{margin-left:auto;display:flex;gap:4px}
.gbtn{height:44px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--ink2)}
.gbtn:hover{background:var(--surface2)}
.gbtn .n{min-width:20px;height:20px;border-radius:10px;background:var(--brand);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.mega{position:absolute;left:0;right:0;top:68px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 18px 32px -20px rgba(0,0,0,.28)}
.gnb .mega .mwrap{display:grid;height:auto;grid-template-columns:repeat(5,1fr);gap:26px 24px;padding-top:26px;padding-bottom:30px;align-items:start}
.mega .mh{font-size:15px;font-weight:700;margin-bottom:8px}
.mega .ms{display:block;font-size:14px;color:var(--sub);padding:4px 0;text-align:left}
.mega .ms:hover{color:var(--ink);text-decoration:underline}
.mega .ms.cur{color:var(--brand);font-weight:700}
.pcrumb{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--meta);padding:18px 0 14px}
.pcrumb b{color:var(--ink2);font-weight:600}
.pmain{display:grid;grid-template-columns:400px minmax(0,1fr);gap:44px;align-items:start;padding-bottom:140px}
/* 왼쪽 요약은 화면 안에 다 들어올 때만 고정 (넘치면 아래 버튼이 영영 안 보임) — draw() 에서 판단 */
.pleft.stick{position:sticky;top:88px}
.phead{display:flex;gap:18px;align-items:center}
.pcroot .dcard{margin-top:18px}
.pcroot .pt{padding:7px 0}
.lbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.lbtn{height:50px;border-radius:13px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:600;color:var(--ink2)}
.lbtn:hover{background:var(--surface2)}
.lbtn.on{border-color:var(--brand);color:var(--brand)}
.pmainbtn{width:100%;height:54px;border-radius:14px;background:var(--brand);color:#fff;font-size:17px;font-weight:700;letter-spacing:-.02em;text-align:center;margin-top:8px}
.pmainbtn.on{background:var(--surface2);color:var(--brand);border:1px solid var(--brand)}
@media (prefers-color-scheme:dark){.pmainbtn{color:#0E1512}}
.pstore{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:50px;border-top:1px solid var(--line);margin-top:18px;padding-top:4px;font-size:15px;font-weight:600;color:var(--ink2)}
.pcroot .chips{top:68px;margin-top:0;border-top:0}
.pcroot .crow{padding:14px 0 10px}
.pcroot .carr.l{padding-left:0}.pcroot .carr.r{padding-right:0}
.pcroot .mtog{padding:0 0 12px;font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:18px}
.pcroot .cat{border:1px solid var(--line);border-radius:18px;padding:20px 22px 16px;scroll-margin-top:170px}
.pcroot .sect{padding:40px 0 6px;scroll-margin-top:170px}
.pcroot .sect.gray{background:none;padding-top:40px}
.egrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:6px}
.egrid>div{background:var(--surface2);border-radius:16px;padding:16px 18px}
.ptw{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:16px}
.ptable{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
.ptable th{font-size:13px;color:var(--sub);text-align:left;font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.ptable td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.ptable tr:last-child td{border-bottom:0}
.ptable tr.me td{background:var(--brandBg)}
.ptable .r{text-align:right}
.ptable tbody tr{cursor:pointer}.ptable tbody tr:not(.me):hover td{background:var(--surface2)}
.howgrid{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:14px}
.pcroot .rowbtn{padding:0;border-bottom:1px solid var(--line)}
.pcroot .hs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;overflow:visible;padding:14px 0 0}
.pcroot .mini{flex:none}
.pcroot .foot{padding:30px 0 0}
.pcroot .veil{position:fixed;align-items:center;justify-content:center}
.pcroot .sheet{max-width:560px;border-radius:20px;max-height:80vh;padding-top:24px}
.pcroot .sheet .grab{display:none}
.pcroot .toast{position:fixed;left:50%;right:auto;transform:translateX(-50%);bottom:110px;max-width:520px;font-size:15px}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:14;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -12px 26px -20px rgba(0,0,0,.3)}
.tray .wrap{display:flex;align-items:center;gap:12px;height:80px}
.titem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 6px;max-width:230px;min-width:0;flex:0 1 auto}
@media (max-width:1240px){.tempty{display:none}}
.titem .thumb{border-radius:9px}
.titem .x{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.titem .x:hover{background:var(--surface2)}

/* ── 소분류 단위 계산 — 목록 · 상세 · 표가 모두 이 함수들만 씁니다 ── */
const byId=id=>P.find(p=>p.id===id);
// 상세가 있는 제품과 목록용 제품을 같은 모양으로 맞춤
const norm=p=>({...p,full:1,cs:Object.fromEntries(p.cats.filter(c=>!c.defect).map(c=>[c.k,[c.m,c.g]])),
 pro:(topPts(p,'+')[0]||{x:[0,'']}).x[1],con:(topPts(p,'-')[0]||{x:[0,'']}).x[1]});
const itemOf=id=>{const p=byId(id);if(p)return norm(p);const m=MINIS.find(x=>x.id===id);return m&&{...m,full:0,dom:midOf(m.sub).dom,mid:midOf(m.sub).mid}};
const allIn=sub=>[...P.filter(p=>p.sub===sub).map(p=>p.id),...MINIS.filter(m=>m.sub===sub).map(m=>m.id)].map(itemOf);
const subCount=sub=>allIn(sub).length;
const labOf=x=>label_of(x.n,x.evalN?x.probN/x.evalN:0);
const rateX=x=>x.evalN?x.probN/x.evalN:0;
const tplOf=sub=>P.find(p=>p.sub===sub).cats.filter(c=>!c.defect);   // 이 소분류의 후기 카테고리 틀
const shareK=(x,k)=>{const v=x.cs[k];return v&&v[0]?v[1]/v[0]:null};
// 구간(상위권·중간·하위권): 그 이야기를 한 후기 30건 이상인 제품이 6종 이상일 때만, 좋다 비율로 3등분
const tierOf=(x,k)=>{const peers=allIn(x.sub).filter(y=>labOf(y)!=='표본 부족'&&y.cs[k]&&y.cs[k][0]>=30);
 if(peers.length<6||!peers.find(y=>y.id===x.id))return null;
 const order=peers.sort((a,b)=>shareK(b,k)-shareK(a,k)).map(y=>y.id),i=order.indexOf(x.id),n=order.length;
 return i<n/3?'상위권':i<2*n/3?'중간':'하위권'};

/* ── 숫자 정합성 검사 — 어긋나면 화면 위에 알림 (프로토타입 전용) ── */
function validate(p){const E=[];
 if(p.found!==p.n+p.excl)E.push('찾은 ≠ 모은 + 제외한');
 if(p.exclWhy.reduce((a,x)=>a+x[1],0)!==p.excl)E.push('제외 이유 합 ≠ 제외한 후기');
 if(p.nv.c<p.found)E.push('찾은 후기가 네이버 리뷰 수보다 많음');
 if(!(p.evalN<=p.n&&p.probN<=p.evalN&&p.month<=p.n))E.push('분모 관계 오류');
 p.cats.forEach(c=>{
  if(c.g+c.b>c.m)E.push(c.name+': 좋다+아쉽다 > 언급');
  if(c.time&&c.m>p.month)E.push(c.name+': 한 달 후기보다 많음');
  if(!c.time&&c.m>p.evalN)E.push(c.name+': 제품 이야기 후기보다 많음');
  if(!c.time&&(c.mg+c.mb>c.mm||c.mm>p.month||c.mm>c.m))E.push(c.name+': 한 달 수치 오류');
  if(!c.defect&&c.b>p.probN)E.push(c.name+': 아쉽다 > 문제를 말한 후기');
  c.pts.forEach(([s,t,a,m])=>{const lim=s==='+'?c.g:c.b,mlim=c.time?lim:(s==='+'?c.mg:c.mb);
   if(a>lim)E.push(t+': 전체 건수 초과');if(m>mlim)E.push(t+': 한 달 건수 초과');if(c.time&&a!==m)E.push(t+': 시간 항목은 두 값이 같아야 함')})});
 p.exp.forEach(e=>e.pts.forEach(x=>{if(x[2]>e.m)E.push(e.name+' 건수 초과')}));
 return E}

function validateMini(x){const E=[],t=tplOf(x.sub);
 if(x.n>x.nv.c)E.push(x.id+': 모은 후기 > 네이버 리뷰');
 if(!(x.evalN<=x.n&&x.probN<=x.evalN&&x.month<=x.n))E.push(x.id+': 분모 관계 오류');
 t.forEach(c=>{const v=x.cs[c.k];if(!v){E.push(x.id+': '+c.name+' 없음');return}
  if(v[1]>v[0])E.push(x.id+': '+c.name+' 좋다 > 언급');
  if(c.time?v[0]>x.month:v[0]>x.evalN)E.push(x.id+': '+c.name+' 언급 > 분모')});
 Object.keys(x.cs).forEach(k=>{if(!t.find(c=>c.k===k))E.push(x.id+': 틀에 없는 카테고리 '+k)});
 return E}

const pcHow=p=>{const L=LAB(p),r=rateOf(p),max=Math.max(...p.exclWhy.map(x=>x[1]));

  <div style="margin-top:20px;font-size:16px;font-weight:700">${L==='표본 부족'?'아직 결과를 정하지 않았어요':`이렇게 「${L}」${J(L,'이','가')} 됐어요`}</div>
  <div class="t-body" style="margin-top:6px;color:var(--ink2)">${L==='표본 부족'?'모은 후기가 30건이 안 돼서 아직 정하지 않았어요. 몇 건만 더 들어와도 결과가 뒤집힐 수 있어서요.'

   <div class="w" style="width:${Math.max(4,c/max*100)}%"></div></div><span class="num" style="color:var(--sub)">${nf(c)}건</span></div>`).join('')}</div></div></div></section>`};

const pcTray=p=>{const L=cmpList(p);if(!L.length)return'';
 return `<div class="tray"><div class="wrap"><div style="font-size:15px;font-weight:700;white-space:nowrap">${p.sub} 비교함 <span class="num" style="color:var(--meta);font-weight:500">${L.length}/4</span></div>

/* ════ 소분류 목록 ════ */
const unitVal=x=>x.vol?x.price/x.vol.v:Infinity;
const isThin=x=>labOf(x)==='표본 부족';
// 정렬: 표본 부족은 어떤 정렬에서도 맨 뒤에 따로 모음
function sortItems(items,key){const L=items.slice();const thin=(a,b)=>isThin(a)-isThin(b);
 const f={default:(a,b)=>LORD[labOf(a)]-LORD[labOf(b)]||b.n-a.n, prob:(a,b)=>rateX(a)-rateX(b)||b.n-a.n, n:(a,b)=>b.n-a.n,
  price:(a,b)=>a.price-b.price, unit:(a,b)=>unitVal(a)-unitVal(b), month:(a,b)=>b.month-a.month, nv:(a,b)=>b.nv.r-a.nv.r||b.nv.c-a.nv.c}[key];
 if(key.startsWith('cat:')){const k=key.slice(4),ok=x=>x.cs[k]&&x.cs[k][0]>=30;
  return L.sort((a,b)=>thin(a,b)||ok(b)-ok(a)||(ok(a)?shareK(b,k)-shareK(a,k):(b.cs[k]?b.cs[k][0]:0)-(a.cs[k]?a.cs[k][0]:0))||b.n-a.n)}
 return L.sort((a,b)=>thin(a,b)||f(a,b))}
const SORTS=sub=>[['default','모아보니 순'],['prob','문제 언급 적은 순'],['n','모은 후기 많은 순'],['price','가격 낮은 순'],
 ...(allIn(sub).some(x=>x.vol)?[['unit','단위 가격 낮은 순']]:[]),['month','한 달 써 본 후기 많은 순'],['nv','네이버 별점 높은 순']];
const sortName=(sub,key)=>key.startsWith('cat:')?`「${tplOf(sub).find(c=>c.k===key.slice(4)).name}」 좋다 순`:SORTS(sub).find(x=>x[0]===key)[1];
/* 가격 범위: 막대의 양쪽 손잡이로 고름. null 이면 그 끝은 제한 없음 (1,000원 단위) */
const PSTEP=1000;
const priceBounds=sub=>{const ps=allIn(sub).map(x=>x.price);return [Math.floor(Math.min(...ps)/PSTEP)*PSTEP,Math.ceil(Math.max(...ps)/PSTEP)*PSTEP]};
const priceOn=()=>S.f.pmin!=null||S.f.pmax!=null;
const filtN=()=>(S.f.good?1:0)+(priceOn()?1:0)+S.f.brands.length;
const filt=items=>items.filter(x=>(!S.f.good||labOf(x)==='대체로 만족')&&(S.f.pmin==null||x.price>=S.f.pmin)&&(S.f.pmax==null||x.price<=S.f.pmax)&&(!S.f.brands.length||S.f.brands.includes(x.brand)));
// 소분류의 대분류 · 중분류는 카테고리표(TAX)에서 찾음 — 상세 제품이 없는 소분류도 알 수 있게
function midOf(sub){for(const [dom,mids] of Object.entries(TAX))for(const [mid,subs] of mids)if(subs.includes(sub))return {dom,mid,sub};return {dom:null,mid:null,sub}}
const sibSubs=sub=>{const {dom,mid}=midOf(sub);return TAX[dom].find(m=>m[0]===mid)[1]};
const hasSub=sub=>P.some(p=>p.sub===sub);

// 목록 카드 가운데 줄 — 고른 정렬 기준의 숫자를 보여줌
const keyLine=(x,key)=>{if(isThin(x))return `<span style="color:var(--sub)">모은 후기 ${x.n} / 30건 · 아직 모으는 중</span>`;
 if(key.startsWith('cat:')){const k=key.slice(4),c=tplOf(x.sub).find(c=>c.k===k),v=x.cs[k];
  if(!v||v[0]<30)return `<span style="color:var(--sub)">「${c.name}」 이야기 ${v?v[0]:0}건 · 아직 적어요</span>`;
  const t=tierOf(x,k);return `「${c.name}」 좋다 <b class="num">${pct(v[1],v[0])}%</b>${t?` <span class="tier" style="margin-left:4px">${t}</span>`:''}`}
 if(key==='month')return `한 달 써 본 후기 <b class="num">${nf(x.month)}건</b>`;
 if(key==='nv')return `네이버 별점 <b class="num">${x.nv.r}</b> <span style="color:var(--sub)" class="num">· 리뷰 ${nf(x.nv.c)}건</span>`;
 if(key==='n')return `모은 후기 <b class="num">${nf(x.n)}건</b> <span style="color:var(--sub)" class="num">· 리뷰 ${nf(x.nv.c)}건 중</span>`;
 return `문제를 말한 후기 <b class="num">${(rateX(x)*100).toFixed(1)}%</b>`};

const distBar=items=>{const cnt=LABS.map(l=>[l,items.filter(x=>labOf(x)===l).length]).filter(x=>x[1]);

 const main=items.filter(x=>!isThin(x)),thin=items.filter(isThin);
 return `<div class="scr" id="scr">

 <div class="cwrap"><div class="carr l"><button data-a="cscroll:-1" aria-label="앞으로">${ic('back',18,'var(--ink2)',2.2)}</button></div>
  <div class="crow" data-key="srow" style="padding-top:4px">${sibSubs(sub).map(s=>`<button class="chip ${s===sub?'on':''}" data-a="${hasSub(s)?'list:'+s:'say:샘플에는 '+s+' 제품이 아직 없어요'}">${s}</button>`).join('')}</div>
  <div class="carr r"><button data-a="cscroll:1" aria-label="뒤로">${ic('chev',18,'var(--ink2)',2.2)}</button></div></div>

  <h1 class="t-title">${sub} ${all.length}종,<br>후기로 비교해 봐요</h1>
  <div class="t-sub" style="margin-top:6px">모든 제품을 같은 기준으로, <span style="white-space:nowrap">진짜 후기만</span> 모아 나란히 놓았어요.</div>
  ${distBar(all)}</div>

 return cf+`<nav class="tabs">${[['home','홈','home'],['grid','카테고리','cats:'],['cmpi','비교함','compare:'+(sub||'')],['heart','찜','favs']]

/* PC 목록 */
const pcList=sub=>{const all=allIn(sub),key=S.lsort,items=sortItems(filt(all),key),{dom,mid}=midOf(sub);
 const brands=[...new Set(all.map(x=>x.brand))].sort((a,b)=>a.localeCompare(b,'ko'));
 const catCol=key.startsWith('cat:')?tplOf(sub).find(c=>c.k===key.slice(4)):null;
 return pcProto()+pcGnb({sub,mid})+`<div class="wrap">
 <div class="pcrumb"><button data-a="mega:${dom}">${dom}</button><span aria-hidden="true">›</span><button data-a="mega:${dom}">${mid}</button><span aria-hidden="true">›</span><b>${sub}</b></div>
 <div class="lgrid"><aside class="lside">
  <div class="sh">${mid}</div>${sibSubs(sub).map(s=>`<button class="sl ${s===sub?'on':''}" data-a="${hasSub(s)?'list:'+s:'say:샘플에는 '+s+' 제품이 아직 없어요'}">${s}${s===sub?` <span class="num">${all.length}</span>`:''}</button>`).join('')}
  <div class="sh" style="margin-top:26px">좁혀 보기</div>
  <button class="ck" data-a="fgood" aria-pressed="${S.f.good}"><span class="box ${S.f.good?'on':''}">${S.f.good?ic('check',14,'#fff',3):''}</span>「대체로 만족」만</button>
  <div class="sh2">가격 범위</div>${rangeUI(sub)}
  <div class="sh2">브랜드</div>${brands.map(b=>{const on=S.f.brands.includes(b);return `<button class="ck" data-a="fbrand:${b}" aria-pressed="${on}"><span class="box ${on?'on':''}">${on?ic('check',14,'#fff',3):''}</span>${b} <span class="num" style="color:var(--tiny)">${all.filter(x=>x.brand===b).length}</span></button>`}).join('')}
  ${filtN()?`<button class="more" data-a="freset" style="margin-top:10px">필터 풀기</button>`:''}
 </aside>
 <main style="min-width:0">
  <h1 class="t-title">${sub} ${all.length}종, 후기로 비교해 봐요</h1>
  <div class="t-sub" style="margin-top:6px">모든 제품을 같은 기준으로, <span style="white-space:nowrap">진짜 후기만</span> 모아 나란히 놓았어요.</div>
  <div style="max-width:560px">${distBar(all)}</div>
  <div style="margin-top:26px;font-size:17px;font-weight:700;letter-spacing:-.02em">무엇이 가장 중요하세요?</div>
  <div class="t-sub" style="margin-top:2px">고르면 그 이야기에서 좋다는 후기가 많은 순으로 다시 세워요.</div>
  <div class="kwrap">${tplOf(sub).map(c=>`<button class="chip ${key==='cat:'+c.k?'on':''}" data-a="kcat:${c.k}">${c.time?ic('clock',13,key==='cat:'+c.k?'#fff':'var(--sub)',2.2):''}${c.name}</button>`).join('')}</div>
  <div class="sortrow"><label class="t-sub" for="lsel">정렬</label>
   <select id="lsel" class="lsel" data-change="lsort">${key.startsWith('cat:')?`<option value="${key}" selected>${sortName(sub,key)}</option>`:''}${SORTS(sub).map(([k,t])=>`<option value="${k}" ${key===k?'selected':''}>${t}</option>`).join('')}</select>
   <span class="t-sub num" style="margin-left:auto">${items.length}개 제품${filtN()?` · 전체 ${all.length}개 중`:''}</span></div>
  ${items.length?`<div class="ptw" style="margin-top:10px"><table class="ptable ltable"><thead><tr><th style="width:42%">제품</th><th>모아보니</th>
   ${catCol?`<th class="r">「${catCol.name}」 좋다</th>`:''}<th class="r">문제를 말한 후기</th><th class="r">가격</th><th></th></tr></thead><tbody>
   ${items.map(x=>{const L=labOf(x),v=catCol&&x.cs[catCol.k],t=catCol&&tierOf(x,catCol.k);return `<tr data-a="open:${x.id}">
    <td><div style="display:flex;align-items:center;gap:12px">${thumb(x,60,60)}<div style="min-width:0"><div class="t-cap" style="color:var(--sub)">${x.brand}</div>
     <div style="font-weight:600;letter-spacing:-.02em">${x.name}</div>${isThin(x)?'':`<div class="lpc pc"><span>${mk('+')}${x.pro}</span><span>${mk('-')}${x.con}</span></div>`}</div></div></td>
    <td><span style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600;color:${LCOL(L)}"><span class="dot" style="background:${LDOT(L)}"></span>${L}</span>
     <div class="t-cap num" style="margin-top:2px;white-space:nowrap">모은 후기 ${nf(x.n)}건${isThin(x)?' / 30':''}</div></td>
    ${catCol?`<td class="r num">${v&&v[0]>=30&&!isThin(x)?`<b>${pct(v[1],v[0])}%</b>${t?`<div class="t-cap">${t}</div>`:''}`:'<span class="t-cap">아직 적어요</span>'}</td>`:''}
    <td class="r num">${isThin(x)?'<span class="t-cap">아직 적어요</span>':(rateX(x)*100).toFixed(1)+'%'}</td>
    <td class="r num" style="white-space:nowrap"><b>${won(x.price)}</b>${x.vol?`<div class="t-cap">${unitPrice(x)}</div>`:''}</td>
    <td class="r" data-stop><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">${cmpBtn(x)}${favBtn(x,20)}</div></td></tr>`}).join('')}
   </tbody></table></div>`
  :`<div style="padding:40px 0;text-align:center"><div class="t-body">조건에 맞는 제품이 없어요</div><button class="more" data-a="freset" style="margin:6px auto 0">필터 풀기</button></div>`}
  <div style="margin-top:28px;background:var(--surface2);border-radius:16px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px">
   <div><div style="font-size:16px;font-weight:700">찾는 ${sub}이 없나요?</div><div class="t-sub" style="margin-top:2px">알려주시면 후기를 모아 둘게요.</div></div>
   <button class="tbtn" style="background:var(--surface)" data-a="search">이 제품 후기 모아주세요</button></div>
  <div class="foot">${midOf(sub).dom==='육아용품'?`<div class="t-cap" style="color:var(--ink2);margin-bottom:6px">${SAFETY}</div>`:''}<div class="t-cap">별점과 리뷰 수는 네이버 쇼핑에서 그대로 옮겨 왔어요.</div><div class="t-cap" style="margin-top:6px">프로토타입 · 이 화면의 제품과 숫자는 모두 가상이에요</div></div>
 </main></div></div>`+pcTray({sub})};

/* ════ 비교 화면 ════
   같은 소분류끼리만 · 이긴 쪽 표시 없음(더 높은 「좋다」만 굵게) · 요약 문장은 숫자에서 코드가 만듦 */
const cmpSubs=()=>[...new Set(Object.keys(S.cmp).map(itemOf).filter(Boolean).map(x=>x.sub))];
const pickCsub=pref=>{const subs=cmpSubs();return subs.includes(pref)?pref:(subs[0]||pref)};
const DIFF_MIN=.05;   // 5%p 넘게 차이 나는 줄만 먼저 보여줌
const okK=(x,k)=>!isThin(x)&&x.cs[k]&&x.cs[k][0]>=30;
// 줄 정의 — 모바일(두 개)과 PC(최대 네 개)가 같은 줄을 씀
function cmpRows(items,sub){const rows=[];
 const cell=(h,sub2='')=>`<div class="cv">${h}</div>${sub2?`<div class="t-cap num">${sub2}</div>`:''}`;
 rows.push({g:'기본',label:'모아보니',cells:items.map(x=>{const L=labOf(x);return cell(`<span style="display:inline-flex;align-items:center;gap:6px;font-weight:700;color:${LCOL(L)}"><span class="dot" style="background:${LDOT(L)}"></span>${L}</span>`)})});
 rows.push({g:'기본',label:'모은 후기',cells:items.map(x=>cell(`<span class="num">${nf(x.n)}건</span>`,`네이버 리뷰 ${nf(x.nv.c)}건 중`))});
 rows.push({g:'기본',label:'문제를 말한 후기',cells:items.map(x=>isThin(x)?cell('<span class="t-sub">아직 적어요</span>'):cell(`<span class="num">${(rateX(x)*100).toFixed(1)}%</span>`))});
 rows.push({g:'기본',label:'네이버 별점',cells:items.map(x=>cell(`<span style="display:inline-flex;align-items:center;gap:3px">${ic('star',15,'var(--star)',1.2,'var(--star)')}<span class="num">${x.nv.r}</span></span>`))});
 rows.push({g:'기본',label:'가격',cells:items.map(x=>cell(`<span class="num">${won(x.price)}</span>`,x.vol?unitPrice(x):''))});
 tplOf(sub).forEach(c=>{const vals=items.map(x=>okK(x,c.k)?shareK(x,c.k):null),real=vals.filter(v=>v!=null);
  const hi=real.length>1?Math.max(...real):null,spread=real.length>1?Math.max(...real)-Math.min(...real):0;
  rows.push({g:'후기 카테고리별 「좋다」 비율',label:c.name,time:c.time,k:c.k,spread,small:real.length<2||spread<DIFF_MIN,
   cells:items.map((x,i)=>{const v=x.cs[c.k];if(vals[i]==null)return cell('<span class="t-sub">아직 적어요</span>',`${v?v[0]:0}건`);
    const top=hi!=null&&vals[i]===hi&&real.filter(r=>r===hi).length===1;
    return `<div class="cv num" style="${top?'font-weight:800;color:var(--brand)':''}">${pct(v[1],v[0])}%</div>
     <div class="cbar"><i style="width:${vals[i]*100}%"></i></div><div class="t-cap num">${nf(v[0])}건 중</div>`})})});
 rows.push({g:'가장 많이 나온 이야기',label:'좋다는 이야기',cells:items.map(x=>isThin(x)?cell('<span class="t-sub">아직 적어요</span>'):`<div class="cpt">${mk('+')}<span>${x.pro}</span></div>`)});
 rows.push({g:'가장 많이 나온 이야기',label:'아쉽다는 이야기',cells:items.map(x=>isThin(x)?cell('<span class="t-sub">아직 적어요</span>'):`<div class="cpt">${mk('-')}<span>${x.con}</span></div>`)});
 rows.push({g:'한 달 써 본 뒤',label:'한 달 써 본 후기',cells:items.map(x=>cell(`<span class="num">${nf(x.month)}건</span>`))});
 return rows}
// 요약 — 차이가 가장 큰 후기 카테고리 하나 (같은 데이터면 늘 같은 문장)
function cmpSummary(items,sub){const rows=cmpRows(items,sub).filter(r=>r.k&&!r.small).sort((a,b)=>b.spread-a.spread);
 if(!rows.length)return {h:'아직 후기가 적어, 어디가 다른지 말하기 일러요',d:'후기가 30건 넘게 모인 카테고리가 두 제품 이상 있어야 나란히 견줄 수 있어요.'};
 const r=rows[0],c=tplOf(sub).find(c=>c.k===r.k),two=items.length===2;
 const vs=items.map(x=>okK(x,c.k)?`${x.brand} ${pct(x.cs[c.k][1],x.cs[c.k][0])}%`:null).filter(Boolean).join(' · ');
 return {h:`${two?'두 제품이 가장 다른 곳은':'가장 차이가 큰 곳은'} ${Q(c.name)}${J(c.name,'이에요','예요')}`,d:`좋다는 후기 ${vs}`}}

const cmpPairOf=items=>{let p=(S.cpair||[]).filter(id=>items.some(x=>x.id===id));
 items.forEach(x=>{if(p.length<2&&!p.includes(x.id))p.push(x.id)});S.cpair=p;return p.map(id=>items.find(x=>x.id===id))};

// 비교함이 비었거나 하나만 있을 때 — 담긴 제품은 보여주고 뺄 수 있게
const cmpEmpty=(sub,items)=>{const n=items.length;
 if(!sub)return `<div style="padding:44px 24px;text-align:center"><div class="t-h">비교함이 비어 있어요</div>
  <div class="t-sub" style="margin-top:6px">보고 싶은 제품 목록에서 「＋ 비교」를 누르면 여기에 모여요. 같은 종류끼리 최대 4개까지 담을 수 있어요.</div>
  <button class="tbtn" style="margin-top:16px" data-a="${S.view==='pc'?'mega:주방용품':'say:카테고리 화면은 다음 단계에서 만들어요'}">카테고리 둘러보기</button></div>`;
 return `<div style="padding:32px 20px 44px;text-align:center">
 ${n?`<div class="t-cap" style="margin-bottom:8px;text-align:left">${sub} 비교함에 담긴 제품</div>
  ${items.map(x=>{const L=labOf(x);return `<div class="cone">
   <button data-a="open:${x.id}" style="display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left">${thumb(x,56,56)}
    <div style="min-width:0"><div class="t-cap" style="color:var(--sub)">${x.brand}</div><div class="chn">${x.name}</div>
     <div style="display:flex;align-items:center;gap:5px;margin-top:2px;font-size:13px;font-weight:600;color:${LCOL(L)}"><span class="dot" style="background:${LDOT(L)}"></span>${L}</div></div></button>
   <button class="tbtn" data-a="rmcmp:${x.id}" aria-label="${x.name} 비교함에서 빼기" style="flex-shrink:0">빼기</button></div>`}).join('')}`:''}
 <div class="t-h" style="margin-top:${n?26:0}px">${n?'하나 더 담으면 비교할 수 있어요':'비교함이 비어 있어요'}</div>
 <div class="t-sub" style="margin-top:6px">${sub} 목록에서 「＋ 비교」를 누르면 여기에 모여요. 같은 종류끼리 최대 4개까지 담을 수 있어요.</div>
 <button class="tbtn" style="margin-top:16px" data-a="list:${sub}">${sub} 목록으로 가기</button></div>`};

const subSwitch=sub=>{const subs=cmpSubs();if(subs.length<2)return'';
 return `<div class="cwrap"><div class="crow" data-key="csw" style="padding-top:4px">${subs.map(s=>`<button class="chip ${s===sub?'on':''}" data-a="csub:${s}">${s} <span class="num">${cmpList({sub:s}).length}</span></button>`).join('')}</div></div>`};

/* 모바일 */
const cmpTop=sub=>`<div class="top"><button class="ib" data-a="${sub?'list:'+sub:'home'}" aria-label="${sub?sub+' 목록으로':'홈으로'}">${ic('back',22,'var(--ink)')}</button>
 <div style="flex:1;font-size:17px;font-weight:700;letter-spacing:-.02em">비교함</div>
 <button class="ib" data-a="say:비교 링크를 복사했어요. 받는 분은 로그인 없이 같은 표를 봐요" aria-label="비교 결과 공유">${ic('share',21,'var(--ink)')}</button></div>`;
const cmpBody=sub=>{const all=cmpList({sub});
 if(all.length<2)return `<div class="scr" id="scr">${subSwitch(sub)}${cmpEmpty(sub,all)}</div>`;
 const pair=cmpPairOf(all),rows=cmpRows(pair,sub),sm=cmpSummary(pair,sub),hide=rows.filter(r=>r.k&&r.small).length;
 let g='';
 return `<div class="scr" id="scr">${subSwitch(sub)}
 <div class="pad" style="padding-top:14px"><h1 class="t-title">${sub} 비교</h1>
  <div class="t-sub" style="margin-top:4px">같은 기준으로 모은 진짜 후기로 나란히 봐요.</div></div>
 ${all.length>2?`<div class="pad" style="padding-top:14px"><div class="t-cap" style="margin-bottom:6px">담은 ${all.length}개 중 두 개를 골라 나란히 봐요</div>
  <div class="fchips">${all.map(x=>`<button class="chip ${S.cpair.includes(x.id)?'on':''}" data-a="cpick:${x.id}">${x.brand}</button>`).join('')}</div></div>`:''}
 <div class="chead">${pair.map(x=>`<div class="chc">
  <button class="cx" data-a="rmcmp:${x.id}" aria-label="${x.name} 비교함에서 빼기"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--meta)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button data-a="open:${x.id}" style="display:block;text-align:left">${thumb(x,48,48)}<div class="t-cap" style="color:var(--sub);margin-top:6px">${x.brand}</div><div class="chn">${x.name}</div></button></div>`).join('')}</div>
 <div class="pad"><div class="csum"><div class="t-body" style="font-weight:700">${sm.h}</div><div class="t-sub num" style="margin-top:2px">${sm.d}</div></div>
  <button class="mtog" style="width:100%;padding:12px 0 4px" data-a="cdiff" aria-pressed="${S.cdiff}"><span>차이가 큰 항목만 보기 <span class="t-cap">(5%p 넘게)</span></span><span class="sw ${S.cdiff?'on':''}"><i></i></span></button></div>
 ${rows.filter(r=>!(S.cdiff&&r.k&&r.small)).map(r=>{const gh=r.g!==g?(g=r.g,`<div class="cgh pad">${r.g}</div>`):'';
  return gh+`<div class="crw"><div class="crl">${r.time?ic('clock',13,'var(--sub)',2.2):''}${r.label}${r.time?'<span class="t-cap" style="margin-left:4px">· 한 달 써 본 후기 중</span>':''}</div>
   <div class="crc">${r.cells.map(c=>`<div>${c}</div>`).join('')}</div></div>`}).join('')}
 ${S.cdiff&&hide?`<button class="more pad" data-a="cdiff" style="display:flex;padding-top:10px">접어 둔 ${hide}가지도 보기 ${ic('chev',14,'var(--brand)',2.2)}</button>`:''}
 <div class="foot"><div class="t-cap">숫자가 더 높은 쪽만 굵게 표시했어요. 어느 제품이 낫다고 정하지 않아요.</div>
  <div class="t-cap">별점과 리뷰 수는 네이버 쇼핑에서 그대로 옮겨 왔어요.</div><div class="t-cap" style="margin-top:6px">프로토타입 · 이 화면의 제품과 숫자는 모두 가상이에요</div></div></div>`};

/* PC — 담은 것 전부(최대 4개)를 한 표에 */
const pcCompare=sub=>{const all=cmpList({sub}),mid=sub?midOf(sub).mid:null;

 if(all.length<2)return head+`<div style="max-width:560px;margin:0 auto">${subSwitch(sub)}${cmpEmpty(sub,all)}</div></div>`;
 const rows=cmpRows(all,sub),sm=cmpSummary(all,sub),hide=rows.filter(r=>r.k&&r.small).length,cols=`220px repeat(${all.length+(all.length<4?1:0)},minmax(0,1fr))`;
 let g='';
 return head+`<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap">
  <div><h1 class="t-title">${sub} 비교</h1><div class="t-sub" style="margin-top:4px">같은 기준으로 모은 진짜 후기로 나란히 봐요.</div></div>
  <button class="tbtn" data-a="say:비교 링크를 복사했어요. 받는 분은 로그인 없이 같은 표를 봐요">${ic('share',17,'var(--ink2)',2)}비교 결과 공유</button></div>
 ${subSwitch(sub)}
 <div class="csum" style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap">
  <div><div class="t-body" style="font-weight:700">${sm.h}</div><div class="t-sub num" style="margin-top:2px">${sm.d}</div></div>
  <button class="mtog" style="padding:0;gap:12px" data-a="cdiff" aria-pressed="${S.cdiff}"><span>차이가 큰 항목만 보기</span><span class="sw ${S.cdiff?'on':''}"><i></i></span></button></div>
 <div class="pcg" style="--cols:${cols}">
  <div class="pcgh"><div class="pcgl t-sub num">${all.length}개 담음</div>

   ${all.length<4?`<div class="pcgc"><button class="cadd" data-a="list:${sub}">＋ ${sub} 더 담기</button></div>`:''}</div>
  ${rows.filter(r=>!(S.cdiff&&r.k&&r.small)).map(r=>{const gh=r.g!==g?(g=r.g,`<div class="pcgg">${r.g}</div>`):'';
   return gh+`<div class="pcgr"><div class="pcgl">${r.time?ic('clock',14,'var(--sub)',2.2):''}${r.label}${r.time?'<div class="t-cap">한 달 써 본 후기 중</div>':''}</div>
    ${r.cells.map(c=>`<div class="pcgc">${c}</div>`).join('')}${all.length<4?'<div class="pcgc"></div>':''}</div>`}).join('')}
 </div>
 ${S.cdiff&&hide?`<button class="more" data-a="cdiff" style="margin-top:8px">접어 둔 ${hide}가지도 보기 ${ic('chev',14,'var(--brand)',2.2)}</button>`:''}
 <div class="foot" style="padding-bottom:60px"><div class="t-cap">숫자가 더 높은 쪽만 굵게 표시했어요. 어느 제품이 낫다고 정하지 않아요.</div>
  <div class="t-cap">별점과 리뷰 수는 네이버 쇼핑에서 그대로 옮겨 왔어요.</div><div class="t-cap" style="margin-top:6px">프로토타입 · 이 화면의 제품과 숫자는 모두 가상이에요</div></div></div>`};

/* ════ 홈 ════
   처음 온 사람: 검색 · 신뢰 문장 · 카테고리 · 고민별 · 별점만 보면 놓치는 이야기
   다시 온 사람: 위에 「찜한 제품 소식」 · 「최근 본 제품」이 더해짐 */
const ALL=()=>[...P.map(p=>p.id),...MINIS.map(m=>m.id)].map(itemOf);
// 신뢰 문장 — 읽은 리뷰와 제외한 리뷰의 합 (샘플 기준)
const readStats=()=>{const xs=ALL();const found=xs.reduce((a,x)=>a+(x.full?x.found:x.nv.c),0),n=xs.reduce((a,x)=>a+x.n,0);return {found,excl:found-n,n}};
// 찜한 제품 소식 (가상) — 실제로는 주간 수집 때 전주와 비교해 생김
const NEWS={p1:'한 달 써 본 후기가 18건 더 모였어요',m2:'가격이 2,000원 내렸어요',p3:'모은 후기가 41건 늘었어요',m30:'가격이 1,500원 내렸어요',m13:'한 달 써 본 후기가 9건 더 모였어요'};

const THEMES={'뷰티':[['끈적이지 않는 크림','크림','absorb'],['오래 촉촉한 크림','크림','moist'],['자극이 적은 크림','크림','irrit'],['향이 순한 크림','크림','scent']],
 '육아용품':[['잘 안 새는 젖병','젖병','leak'],['세척이 쉬운 젖병','젖병','wash'],['아기가 잘 무는 젖병','젖병','accept'],['냄새 없는 젖병','젖병','material']],
 '주방용품':[['오래가는 코팅','프라이팬','coat'],['설거지 쉬운 팬','프라이팬','wash'],['가벼운 팬','프라이팬','grip'],['열이 고르게 퍼지는 냄비','편수냄비','heat']]};
const MID2SUB={'조리팬':'프라이팬','냄비·솥':'편수냄비','스킨케어':'크림','수유·이유식 도구':'젖병'};
// 별점만 보면 놓치는 이야기 — 별점 4.5 이상인데 「의견 갈림」·「대체로 불만」 (코드가 뽑음)
const gapItems=dom=>ALL().filter(x=>midOf(x.sub).dom===dom&&x.nv.r>=4.5&&['의견 갈림','대체로 불만'].includes(labOf(x)))

const weakCat=x=>tplOf(x.sub).filter(c=>okK(x,c.k)).sort((a,b)=>shareK(x,a.k)-shareK(x,b.k))[0];
const PH=['인덕션 프라이팬','건성 크림','가벼운 냄비','끈적이지 않는 크림','코팅 오래가는 팬'];

const miniCard=(x,sub2)=>{const L=labOf(x);return `<button class="mini" data-a="open:${x.id}">${thumb(x,136,104,'th')}
 <div class="t-cap" style="margin-top:8px;color:var(--sub)">${x.brand}</div><div class="nm">${x.name}</div>
 <div style="display:flex;align-items:center;gap:5px;margin-top:4px;font-size:12px;color:var(--ink2)"><span class="dot" style="background:${LDOT(L)}"></span>${L}</div>
 ${sub2?`<div class="t-cap" style="margin-top:2px">${sub2}</div>`:''}</button>`};
const gapCard=x=>{const L=labOf(x),w=weakCat(x);return `<button class="gcard" data-a="open:${x.id}">${thumb(x,64,64)}
 <div style="min-width:0;flex:1"><div class="t-cap" style="color:var(--sub)">${x.brand} · ${x.sub}</div><div class="chn" style="font-size:15px">${x.name}</div>

   <span style="display:inline-flex;align-items:center;gap:3px">${ic('star',13,'var(--star)',1.2,'var(--star)')}<b class="num">${x.nv.r}</b></span><span aria-hidden="true">→</span>
   <span style="display:inline-flex;align-items:center;gap:5px;font-weight:700;color:${LCOL(L)}"><span class="dot" style="background:${LDOT(L)}"></span>${L}</span></div>
  ${w?`<div class="t-cap" style="margin-top:3px">${Q(w.name)} 좋다는 후기 ${pct(x.cs[w.k][1],x.cs[w.k][0])}%</div>`:''}</div></button>`};

const homeParts=()=>{const dom=effDom(),I=interest(),st=readStats(),favs=Object.keys(S.fav).filter(k=>S.fav[k]).map(itemOf).filter(Boolean);
 const news=favs.filter(x=>NEWS[x.id]),recent=S.recent.map(itemOf).filter(Boolean);
 return {dom,st,favs,news,recent,I,gaps:wOrder(gapItems(dom),wItem(I),'gap').slice(0,3),newly:wOrder(NEWLY.map(itemOf).filter(x=>midOf(x.sub).dom===dom),wItem(I),'new')}};

const heroText=st=>`<h1 class="t-title" style="font-size:24px">네이버 리뷰 수천 개,<br>진짜 후기만 골라 드려요</h1>
 <div class="t-sub num" style="margin-top:8px">지금까지 리뷰 <b style="color:var(--ink)">${nf(st.found)}건</b>을 모두 읽고, <b style="color:var(--ink)">${nf(st.excl)}건</b>을 제외했어요.</div>
 <button class="more" data-a="sheet:method">어떻게 고르나요 ${ic('chev',14,'var(--brand)',2.2)}</button>`;
const domSeg=dom=>`<div class="dseg" role="tablist">${Object.keys(TAX).map(d=>`<button role="tab" aria-selected="${d===dom}" class="${d===dom?'on':''}" data-a="hdom:${d}">${d}</button>`).join('')}</div>`;
const midTiles=dom=>`<div class="mids">${TAX[dom].map(([m])=>`<button class="mid" data-a="${MID2SUB[m]?'list:'+MID2SUB[m]:'say:샘플에는 '+m+' 제품이 아직 없어요'}">${m}</button>`).join('')}</div>`;
const newsBox=(favs,news)=>favs.length?`<div class="newsb"><div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:15px;font-weight:700">찜한 제품 소식</div>
 <button class="t-sub" data-a="favs" style="min-height:32px">찜 ${favs.length}개 전체</button></div>
 ${news.length?news.map(x=>`<button class="nrow" data-a="open:${x.id}">${thumb(x,40,40)}<div style="min-width:0;flex:1;text-align:left"><div class="t-cap" style="color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.brand} · ${x.name}</div>
  <div style="font-size:14px;font-weight:600;letter-spacing:-.02em">${NEWS[x.id]}</div></div>${ic('chev',16,'var(--meta)',2)}</button>`).join('')
 :`<div class="t-sub" style="padding:6px 0 2px">찜한 제품에 새 소식은 아직 없어요. 달라지는 게 있으면 여기에 알려드릴게요.</div>`}</div>`:'';
const themeChips=dom=>`<div class="fchips">${THEMES[dom].map(([t,sub,k])=>`<button class="chip" data-a="theme:${sub}:${k}">${t}</button>`).join('')}</div>`;

/* ── 홈 콘텐츠 (모두 데이터에서 자동 계산 · 손으로 고르지 않음) ── */
const domSubs=dom=>LSUBS.filter(s=>midOf(s).dom===dom);
const rankSub=()=>{const subs=domSubs(effDom());if(subs.includes(S.hrank))return S.hrank;const t=topSubs(interest()).find(x=>subs.includes(x));return t||subs[0]};
// ① 걸러 내기 — 제외 이유 비율은 상세 데이터가 있는 제품 기준
const exclAgg=()=>{const m={};P.forEach(p=>p.exclWhy.forEach(([t,c])=>{m[t]=(m[t]||0)+c}));const tot=Object.values(m).reduce((a,b)=>a+b,0);
 return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([t,c])=>[t,c/tot])};
const funnelCard=(st,compact)=>{const ex=st.excl/st.found,ten=Math.round(ex*10),rs=exclAgg().slice(0,4),max=rs[0][1];
 return `<div class="funnel"><div style="font-size:16px;font-weight:700;letter-spacing:-.02em">리뷰 10건 중 ${ten}건은 쓸 만한 정보가 없었어요</div>
 <div class="fbar" role="img" aria-label="제외 ${Math.round(ex*100)}퍼센트, 진짜 후기 ${100-Math.round(ex*100)}퍼센트"><i class="fx" style="width:${ex*100}%"></i><i class="fn" style="width:${(1-ex)*100}%"></i></div>
 <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px"><span style="color:var(--sub)">제외 <b class="num" style="color:var(--ink)">${Math.round(ex*100)}%</b></span><span style="color:var(--brand);font-weight:700">진짜 후기 <span class="num">${100-Math.round(ex*100)}%</span></span></div>
 ${compact?`<button class="more" data-a="sheet:method" style="min-height:32px">어떤 글을 뺐는지 보기 ${ic('chev',14,'var(--brand)',2.2)}</button></div>`:`<div class="t-cap" style="margin-top:12px;font-weight:700;color:var(--sub)">이런 글을 뺐어요</div>
 ${rs.map(([t,r])=>`<div class="why" style="font-size:13px"><div style="flex:1;min-width:0;padding-right:12px"><div>${t}</div><div class="w" style="width:${Math.max(6,r/max*100)}%"></div></div><span class="num" style="color:var(--sub)">${Math.round(r*100)}%</span></div>`).join('')}
 <div class="t-cap" style="margin-top:6px">제외 이유 비율은 상세가 있는 샘플 ${P.length}개 기준이에요</div></div>`}`};
// ⑥ 처음 온 사람에게만 — 이렇게 써요
const stepsStrip=()=>`<div class="steps">${[['1','종류를 고르고','카테고리나 검색으로'],['2','진짜 후기로 보고','좋다 · 아쉽다를 한눈에'],['3','나란히 견줘요','비슷한 제품끼리']].map(([n,t,d])=>`<div class="step"><span class="sn num">${n}</span><div><div style="font-size:15px;font-weight:700;letter-spacing:-.02em">${t}</div><div class="t-cap">${d}</div></div></div>`).join('')}</div>`;
// ② 모아보니 「대체로 만족」인 제품 — 모은 후기 많은 순
const rankTabs=sub=>`<div class="fchips">${domSubs(S.hdom).map(s=>`<button class="chip ${s===sub?'on':''}" data-a="hrank:${s}">${s}</button>`).join('')}</div>`;
const rankBlock=(sub,n)=>{const xs=sortItems(allIn(sub),'n').filter(x=>labOf(x)==='대체로 만족').slice(0,n);
 return `${xs.map(x=>`<button class="rrow" data-a="open:${x.id}">${thumb(x,56,56)}<div style="min-width:0;flex:1;text-align:left"><div class="t-cap" style="color:var(--sub)">${x.brand}</div><div class="chn" style="font-size:15px">${x.name}</div>
  <div class="t-cap num" style="margin-top:2px"><span style="white-space:nowrap">문제를 말한 후기 ${(rateX(x)*100).toFixed(1)}% ·</span> <span style="white-space:nowrap">모은 후기 ${nf(x.n)}건</span></div></div>
  <div style="text-align:right;flex-shrink:0"><div class="num" style="font-weight:700">${won(x.price)}</div>${x.vol?`<div class="t-cap num">${unitPrice(x)}</div>`:''}</div></button>`).join('')}
 <button class="more" data-a="list:${sub}">${sub} ${subCount(sub)}종 전체 보기 ${ic('chev',14,'var(--brand)',2.2)}</button>`};
// ③ 후기로 만든 구매 가이드 — 모든 제품의 진짜 후기에서 가장 많이 나온 이야기
const guideBlock=sub=>{const xs=allIn(sub),rows=tplOf(sub).map(c=>({c,m:xs.reduce((a,x)=>a+(x.cs[c.k]?x.cs[c.k][0]:0),0)})).sort((a,b)=>b.m-a.m).slice(0,3);
 return `${rows.map((r,i)=>`<button class="gdrow" data-a="theme:${sub}:${r.c.k}"><span class="sn num">${i+1}</span>
  <div style="flex:1;min-width:0;text-align:left"><div style="font-size:15px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:4px">${r.c.time?ic('clock',14,'var(--sub)',2.2):''}${r.c.name}</div>
  <div class="t-cap num">후기 ${nf(r.m)}건에서 이야기했어요${r.c.time?' · 한 달 써 본 후기만 셌어요':''}</div></div>
  <span class="t-cap" style="color:var(--brand);font-weight:700;display:flex;align-items:center;gap:2px;flex-shrink:0">이 기준으로 보기${ic('chev',13,'var(--brand)',2.2)}</span></button>`).join('')}`};
// ④ 고민별 카드 — 그 기준에서 지금 맨 앞인 제품을 미리 보여줌
const themeCards=dom=>`<div class="tcards">${wOrder(THEMES[dom],t=>1+((interest().subs[t[1]]||0)>0?2:0),'theme').map(([t,sub,k])=>{const top=sortItems(allIn(sub),'cat:'+k).find(x=>okK(x,k));
 return `<button class="tcard" data-a="theme:${sub}:${k}"><div style="font-size:15px;font-weight:700;letter-spacing:-.02em">${t}</div>
  ${top?`<div style="display:flex;gap:10px;align-items:center;margin-top:10px">${thumb(top,40,40)}<div style="min-width:0;text-align:left"><div class="t-cap">지금 맨 앞</div>
   <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${top.brand} ${top.name}</div>
   <div class="t-cap num" style="color:var(--brand);font-weight:700">좋다 ${pct(top.cs[k][1],top.cs[k][0])}%</div></div></div>`:'<div class="t-cap" style="margin-top:8px">아직 후기가 모이는 중이에요</div>'}</button>`}).join('')}</div>`;
// ⑤ 나란히 보면 달라요 — 둘 다 「대체로 만족」인데 한 카테고리에서 차이가 가장 큰 두 제품
//    (홈에서 불만 제품끼리의 비교를 권하지 않음 — 그건 「별점만 보면 놓치는 이야기」가 다룸)
function pairFor(sub){const xs=allIn(sub).filter(x=>!isThin(x));let best=null;
 for(let i=0;i<xs.length;i++)for(let j=i+1;j<xs.length;j++){const a=xs[i],b=xs[j];if(labOf(a)!=='대체로 만족'||labOf(b)!=='대체로 만족')continue;
  tplOf(sub).forEach(c=>{if(!okK(a,c.k)||!okK(b,c.k))return;const d=Math.abs(shareK(a,c.k)-shareK(b,c.k));if(!best||d>best.d)best={a,b,c,d}})}
 return best}
const pairCard=p=>{const va=pct(p.a.cs[p.c.k][1],p.a.cs[p.c.k][0]),vb=pct(p.b.cs[p.c.k][1],p.b.cs[p.c.k][0]),L=labOf(p.a);
 return `<div class="pcard"><div class="t-cap">${p.a.sub} · 둘 다 <b style="color:${LCOL(L)}">「${L}」</b>인데</div>
 <div class="pvs">
  ${[p.a,p.b].map((x,i)=>`${i?'<span class="t-cap" style="font-weight:700;flex-shrink:0">vs</span>':''}<button data-a="open:${x.id}" style="display:flex;gap:8px;align-items:center;min-width:0;text-align:left">${thumb(x,44,44)}<div style="min-width:0"><div class="t-cap" style="color:var(--sub)">${x.brand}</div><div class="chn" style="font-size:13px">${x.name}</div></div></button>`).join('')}</div>
 <div class="t-body" style="margin-top:12px;font-weight:700">가장 다른 곳은 ${Q(p.c.name)}${J(p.c.name,'이에요','예요')}</div>
 <div class="t-sub num">좋다는 후기 ${p.a.brand} ${va}% · ${p.b.brand} ${vb}%</div>
 <button class="tbtn" style="margin-top:12px;width:100%;justify-content:center" data-a="pair:${p.a.id},${p.b.id}">둘 다 비교함에 담고 나란히 보기</button></div>`};
const pairs=dom=>wOrder(domSubs(dom).map(pairFor).filter(Boolean),p=>wItem(interest())(p.a),'pair');

/* ════ 홈 맞춤 노출 ════
   무엇을 보여줄지만 바뀜 — 라벨 · 숫자 · 정렬 규칙(모아보니 순 등)은 절대 바뀌지 않음
   신호: 처음 들어온 검색어(entry) 5 · 찜 4 · 본 제품 3 · 비교함 3 · 다들 안에서 검색한 말 3 · 본 목록 2  (최근일수록 크게, 0.8배씩 줄어듦)
   처음 온 사람의 다른 서비스 검색 기록은 쓰지 않음(쓸 수도 없음) — 들어온 검색어와 처음 연 페이지만 씀 */
const W_ENTRY=5,W_FAV=4,W_VIEW=3,W_CMP=3,W_Q=3,W_LIST=2,DECAY=.8;
const ALLSUBS=Object.values(TAX).flatMap(ms=>ms.flatMap(m=>m[1]));
// 들어온 검색어 → 관심 소분류 (카테고리 이름이 검색어 안에 있거나, 제품·브랜드 이름과 맞으면)
const entrySubs=kw=>{const q=normC(kw);const byCat=ALLSUBS.filter(s=>hasSub(s)&&(q.includes(normC(s))||normC(s).includes(q)));
 const byProd=ALL().filter(x=>q.includes(normC(x.brand))||normC(x.brand+x.name).includes(q)).map(x=>x.sub);return [...new Set([...byCat,...byProd])].slice(0,2)};
function interest(){const subs={},brands={};if(S.pOff)return {subs,brands,has:false};

function catRail(m){const cl=document.getElementById('cl');if(!cl)return;let el=null;
 cl.querySelectorAll('[data-m]').forEach(b=>{const on=b.dataset.m===m;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'true':'false');if(on)el=b});

const POPQ=['선크림','젖병','인덕션 프라이팬','수분크림','유모차','에어프라이어','기저귀','편수냄비'];  // 가상
const escA=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const tokens=q=>q.trim().split(/\s+/).map(normC).filter(Boolean);
const tokHit=(t,text)=>/^[ㄱ-ㅎ]+$/.test(t)?cho(text).includes(t):text.includes(t);
const itemText=x=>normC(x.brand+x.name+x.sub+midOf(x.sub).mid);
function searchAll(q){const ts=tokens(q);if(!ts.length)return {subs:[],brands:[],items:[],loose:false,ts};
 let subs=ALLSUBS.filter(s=>{const n=normC(s);return ts.some(t=>tokHit(t,n)||(t.length>=2&&t.includes(n)))});
 // 검색어에 더 긴 카테고리 이름이 통째로 들어 있으면 그 안의 짧은 이름은 뺌 — 「선크림」에 「크림」이 끼지 않게 (「젖병」은 「젖병소독기」 때문에 빠지지 않음)
 subs=subs.filter(s=>{const n=normC(s);return !subs.some(o=>o!==s&&normC(o).length>n.length&&normC(o).includes(n)&&ts.some(t=>t.includes(normC(o))))}).sort((a,b)=>hasSub(b)-hasSub(a));
 const brands=[...new Set(ALL().map(x=>x.brand))].filter(b=>ts.some(t=>tokHit(t,normC(b))));
 let items=ALL().filter(x=>ts.every(t=>tokHit(t,itemText(x)))),loose=false;
 // 일부 단어만 맞으면(「건성 크림」) 비우지 않고 맞은 카테고리 전체를 보여주되 그 사실을 알림
 if(!items.length){const hs=subs.filter(hasSub);if(hs.length){items=hs.flatMap(allIn);loose=true}}
 return {subs:subs.slice(0,8),brands,items:sortItems(items,'default'),loose,ts}}

/* ════ 이 이야기만 자세히 — 후기 카테고리 하나를 깊게 ════
   ★ 2026-09-30 결정: 이 화면과 후기 분류(템플릿 · 포인트 사전)는 수집한 후기 빅데이터를 검토한 뒤,
     현실적으로 반영 가능한 범위에서 다시 다듬음. 지금은 샘플 데이터로 만든 초안
   원문은 보여주지 않음(포인트와 건수만) · 숫자는 상세와 같은 데이터에서 옴 */
const storyData=(p,c)=>{const all={m:c.m,g:c.g,b:c.b},mon=c.time?{m:c.m,g:c.g,b:c.b}:{m:c.mm,g:c.mg,b:c.mb};
 return {all,mon,base:c.time?p.month:p.n,bn:c.time?'한 달 써 본 후기':'모은 후기'}};
// 한 달 뒤 달라지는지 — 전체와 한 달 써 본 후기의 좋다 비율 차이
const monthShift=(p,c)=>{if(c.time)return {txt:'이 이야기는 시간이 지나야 알 수 있어서, 처음부터 한 달 써 본 후기만 셌어요.',kind:'time'};
 const d=storyData(p,c);if(!d.mon.m)return {txt:'한 달 써 본 분의 이야기는 아직 없어요.',kind:'few'};
 if(d.mon.m<10)return {txt:`한 달 써 본 분의 이야기가 아직 ${d.mon.m}건뿐이라 비교하기 일러요.`,kind:'few'};
 // 차이는 화면에 보이는 반올림 숫자로 계산 — 「40% → 35%」인데 「비슷해요」가 나오지 않게
 const a=d.all.g/d.all.m,b=d.mon.g/d.mon.m,diff=Math.round(b*100)-Math.round(a*100),note=d.mon.m<30?`한 달 써 본 후기는 아직 ${d.mon.m}건이라 참고로만 봐 주세요.`:'';
 return {a,b,diff,kind:'cmp',note,txt:Math.abs(diff)<5?'한 달 써 본 뒤에도 좋다는 비율이 비슷해요.':diff<0?`한 달 써 본 뒤에는 좋다는 비율이 ${-diff}%p 줄어요.`:`한 달 써 본 뒤에는 좋다는 비율이 ${diff}%p 늘어요.`}};

const storyParts=(p,k,pc)=>{const c=p.cats.find(x=>x.k===k),d=storyData(p,c),st=S.month&&!c.time?d.mon:d.all,ms=monthShift(p,c);
 const pts=c.pts.map(x=>({s:x[0],t:x[1],n:c.time?x[2]:S.month?x[3]:x[2],mn:x[3]})).filter(x=>x.n>0);
 const good=pts.filter(x=>x.s==='+').sort((a,b)=>b.n-a.n),bad=pts.filter(x=>x.s==='-').sort((a,b)=>b.n-a.n);
 const peers=allIn(p.sub).filter(x=>okK(x,k)).sort((a,b)=>shareK(b,k)-shareK(a,k)),few=allIn(p.sub).filter(x=>!okK(x,k)),tier=tierOf(norm(p),k);
 const ptRows=(arr,s)=>arr.length?arr.map(x=>`<div class="spt">${mk(s)}<div style="flex:1;min-width:0"><div class="t-body">${x.t}</div>
   <div class="sbar"><i style="width:${Math.max(3,x.n/st.m*100)}%;background:${s==='+'?'var(--good)':'var(--bad)'}"></i></div></div>
   <div class="ct num" style="text-align:right">${nf(x.n)}건<div class="t-cap">${pct(x.n,st.m)}%</div></div></div>`).join(''):`<div class="t-sub" style="padding:8px 0">아직 없어요</div>`;
 const head=`<div class="t-cap" style="color:var(--sub)">${p.brand} · ${p.name}</div>
  <h1 class="t-title" style="display:flex;align-items:center;gap:6px;margin-top:2px">${c.time?ic('clock',20,'var(--sub)',2):''}${c.name}</h1>
  <div class="t-sub num" style="margin-top:4px">${S.month&&!c.time?'한 달 써 본 후기':d.bn} ${nf(S.month&&!c.time?p.month:d.base)}건 중 ${nf(st.m)}건이 이 이야기를 했어요</div>
  <div class="stat" style="margin-top:12px"><span class="t-num num" style="color:var(--brand)">좋다 ${pct(st.g,st.m)}%</span><span class="t-body num" style="color:var(--ink2)">아쉽다 ${pct(st.b,st.m)}%</span>
   ${tier&&!S.month?`<span class="tier" style="margin-left:auto">${p.sub} ${subCount(p.sub)}종 중 ${tier}</span>`:''}</div>
  <div class="bar" style="height:10px;border-radius:5px"><i class="g" style="width:${st.g/st.m*100}%"></i><i class="b" style="width:${st.b/st.m*100}%"></i></div>
  ${c.time?'':`<button class="mtog" style="width:100%;padding:14px 0 0" data-a="month" aria-pressed="${S.month}"><span>한 달 써 본 분 이야기만 보기 <span class="num" style="color:var(--meta)">(${p.month}건)</span></span><span class="sw ${S.month?'on':''}"><i></i></span></button>`}`;
 const points=`<section class="stsec"><div class="t-h">나온 이야기 전부</div><div class="t-sub" style="margin-top:2px">이 이야기를 한 후기 중 몇 %가 말했는지예요. 한 후기가 여러 이야기를 할 수 있어요.</div>
  <div class="sgh" style="margin-top:14px">좋다는 이야기</div>${ptRows(good,'+')}
  <div class="sgh" style="margin-top:14px">아쉽다는 이야기</div>${ptRows(bad,'-')}</section>`;
 const month=`<section class="stsec"><div class="t-h">한 달 뒤에도 그럴까요?</div>
  ${ms.kind==='cmp'?`<div class="mcmp"><div><div class="t-cap">모은 후기 전체</div><div class="t-num num" style="font-size:26px">${Math.round(ms.a*100)}%</div><div class="t-cap num">${nf(d.all.m)}건 중</div></div>
   <div class="marr" aria-hidden="true">→</div>
   <div><div class="t-cap">한 달 써 본 후기</div><div class="t-num num" style="font-size:26px;color:${ms.diff<=-5?'var(--ink2)':'var(--brand)'}">${Math.round(ms.b*100)}%</div><div class="t-cap num">${nf(d.mon.m)}건 중</div></div></div>`:''}
  <div class="t-body" style="margin-top:10px;color:var(--ink2);text-wrap:balance">${ms.txt}</div>${ms.note?`<div class="t-cap" style="margin-top:2px">${ms.note}</div>`:''}</section>`;
 const cmp=`<section class="stsec"><div class="t-h">같은 ${p.sub}끼리 이 이야기만</div><div class="t-sub" style="margin-top:2px">「${c.name}」 좋다는 비율이 높은 순이에요.</div>
  <div style="margin-top:10px">${peers.map(x=>{const v=shareK(x,k),me=x.id===p.id;return `<button class="prow ${me?'me':''}" data-a="${me?'say:지금 보고 계신 제품이에요':x.full?'pick:'+x.id:'say:프로토타입에서는 샘플 '+P.length+'개만 상세가 있어요'}">
   <span class="pnm"><span class="pb">${x.brand}</span> <span class="pn2">${x.name}</span></span>
   <span class="pbar"><i style="width:${v*100}%"></i></span><span class="num pv">${Math.round(v*100)}%</span></button>`}).join('')}</div>
  ${few.length?`<div class="t-cap" style="margin-top:8px">이 이야기를 한 후기가 30건이 안 되는 ${few.length}개 제품은 뺐어요.</div>`:''}
  <button class="more" data-a="theme:${p.sub}:${k}">이 기준으로 ${p.sub} 목록 보기 ${ic('chev',14,'var(--brand)',2.2)}</button></section>`;
 const foot=`<div class="foot"><div class="t-cap">리뷰 원문은 옮겨 오지 않아요. 원래 글은 스마트스토어에서 볼 수 있어요.</div><div class="t-cap" style="margin-top:6px">프로토타입 · 이 화면의 제품과 숫자는 모두 가상이에요</div></div>`;
 return {head,points,month,cmp,foot,c}};

/* ════ 브랜드 ════
   다들은 브랜드를 평가하지 않음 — 브랜드 평점 · 브랜드 라벨 없음. 제품을 모아 보여주고, 라벨은 제품마다 따로 */

 const head=`<div class="t-cap">${doms.join(' · ')}</div><h1 class="t-title" style="margin-top:2px">${b}</h1>

/* ── 프로토타입 전용 「샘플」 버튼 — 실제 서비스에는 없음 ──

const protoFab=()=>{if(S.sheet)return '';   // 창이 열려 있으면 숨김 — 창의 버튼을 가리지 않게
 const E=validateAll(),wide=window.innerWidth>=PCW;
 const grp=(t,items)=>`<div class="pfg"><div class="pft">${t}</div>${items.map(([l,a,on])=>`<button class="pfi ${on?'on':''}" data-a="${a}">${l}</button>`).join('')}</div>`;
 const panel=S.protoOpen?`<div class="pfp" role="dialog" aria-label="프로토타입 바로가기">
  <div style="font-size:15px;font-weight:700">프로토타입 바로가기</div><div class="t-cap" style="margin-top:2px">실제 서비스에는 없는 버튼이에요. 제품과 숫자는 모두 가상이에요.</div>

  ${wide?grp('화면',[['모바일로 보기','view:mo',S.view==='mo'],['PC로 보기','view:pc',S.view==='pc']]):''}
  ${grp('처음 · 다시 온 사람',[['홈 (처음 온 사람 · 기록 없음)','home',false],['검색으로 처음 온 사람 (「아기 젖병」)','demoEntry',false],['다시 온 사람의 홈 (크림 · 프라이팬 관심)','demo1',false],['새로고침 (다시 섞기)','reseed',false]])}
  ${grp('목록',LSUBS.map(x=>[x+' 목록','list:'+x,S.screen==='list'&&S.lsub===x]))}
  ${grp('제품 상세',P.map(p=>[`${LAB(p)} · ${p.brand} ${p.sub}`,'pick:'+p.id,S.screen==='detail'&&S.pid===p.id]))}
  ${grp('비교함',[['비교 예시 (프라이팬 4개)','demo',S.screen==='compare'&&!!S.csub],['빈 비교함 (처음 온 사람)','demo0',S.screen==='compare'&&!S.csub]])}</div>`:'';
 return `<div class="pfab">${panel}<button class="pfb ${E.length?'bad':''}" data-a="proto" aria-expanded="${!!S.protoOpen}">샘플${E.length?' · 확인 필요':''}</button></div>`};

/* ── 그리기 ── */
function fitLeft(){const L=document.querySelector('.pleft');if(!L)return;const tray=document.querySelector('.tray');
 L.classList.toggle('stick',L.offsetHeight<=window.innerHeight-88-(tray?tray.offsetHeight:0)-16)}
function goAfterDraw(){if(!S.goAfter)return;const t=document.getElementById('c-'+S.goAfter);S.goAfter=null;if(t)t.scrollIntoView({block:'start'})}
function focusQ(){if(!S.focusSearch)return;S.focusSearch=false;const i=document.querySelector('[data-sq]');if(i){i.focus();const n=i.value.length;try{i.setSelectionRange(n,n)}catch(e){}}}
function draw(){
 // PC 에는 카테고리 화면이 따로 없음(펼침 메뉴가 대신함) — 모바일에서 PC 로 바꾸면 원래 화면으로
 if(S.screen==='cats'&&S.view==='pc'){if(S.prev)Object.assign(S,S.prev);else S.screen='home';S.prev=null;S.mega=S.cdom}
 const p=byId(S.pid),app=document.getElementById('app'),list=S.screen==='list';
 // 최근 본 소분류 — 빈 비교함에서 어느 목록으로 안내할지 정할 때 씀
 if(list){S.lastSub=S.lsub;S.recentSubs=[S.lsub,...S.recentSubs.filter(x=>x!==S.lsub)].slice(0,6)}else if(S.screen==='detail')S.lastSub=p.sub;
 const toast=S.toast?`<div class="toast" role="status">${S.toast}</div>`:'';
 if(S.view==='pc'){const y=window.scrollY;
  document.body.classList.add('pcmode');app.className='pcroot';
  app.innerHTML=protoFab()+(S.screen==='brand'?pcBrand():S.screen==='brands'?pcBrands():S.screen==='story'?pcStory():S.screen==='favs'?pcFavs():S.screen==='search'?pcSearch():S.screen==='home'?pcHome():S.screen==='compare'?pcCompare(S.csub):list?pcList(S.lsub):pcPage(p))+sheet(p)+toast;
  window.scrollTo(0,S.resetTop?0:y);S.keepTop=0;S.resetTop=0;fitLeft();bindChips();focusQ();goAfterDraw();return}
 document.body.classList.remove('pcmode');app.className='phone';
 const old=document.getElementById('scr');const top=old?old.scrollTop:0;
 app.innerHTML=protoFab()+(S.screen==='brand'?brandTop('브랜드')+brandBody():S.screen==='brands'?brandTop('브랜드 모아보기')+brandsBody():S.screen==='story'?storyTop()+storyBody():S.screen==='favs'?favTop()+favScreen()+tabBar(null,3):S.screen==='search'?searchTop()+searchBody():S.screen==='cats'?catsTop()+catsBody()+tabBar(null,1):S.screen==='home'?homeTop()+homeBody()+tabBar(S.lastSub,0):S.screen==='compare'?cmpTop(S.csub)+cmpBody(S.csub)+tabBar(S.csub,2):list?listTop(S.lsub)+listBody(S.lsub)+tabBar(S.lsub):topBar()+body(p)+bottomBar(p))+sheet(p)+toast;
 const sc=document.getElementById('scr');if(sc)sc.scrollTop=S.keepTop?top:(S.resetTop?0:top);S.keepTop=0;S.resetTop=0;bindChips();bindCats();focusQ();goAfterDraw()}

const goList=sub=>{S.prev=null;S.cq='';S.screen='list';S.lsub=sub;S.lsort='default';S.f={good:false,pmin:null,pmax:null,brands:[]};S.sheet=null;S.mega=null;S.crowXs={};S.resetTop=1;draw()};
document.addEventListener('click',e=>{
 if(e.target.closest('[data-stop]')&&!e.target.closest('[data-a]'))return;
 const el=e.target.closest('[data-a]');
 if(S.protoOpen&&!e.target.closest('.pfb')){S.protoOpen=false;if(!el||!e.target.closest('.pfp')){S.keepTop=1;draw();if(!el)return}}
 if(S.sOpen&&!e.target.closest('.gsw')){S.sOpen=false;if(!el){S.keepTop=1;draw();return}}
 if(S.mega&&!e.target.closest('.mega')&&!(el&&el.dataset.a.startsWith('mega:'))){S.mega=null;S.cq='';S.keepTop=1;draw();if(!el)return}
 if(!el)return;
 const [a,...r]=el.dataset.a.split(':');const v=r.join(':');const p=byId(S.pid);
 switch(a){
  case'pick':S.recent=[v,...S.recent.filter(x=>x!==v)].slice(0,8);S.screen='detail';S.pid=v;S.month=false;S.sheet=null;S.act=null;delete S.crowXs.crow;S.resetTop=1;draw();break;
  case'open':{const x=itemOf(v);if(x&&x.full){S.recent=[v,...S.recent.filter(y=>y!==v)].slice(0,8);S.screen='detail';S.pid=v;S.month=false;S.sheet=null;S.act=null;S.crowXs={};S.resetTop=1;draw()}
   else say(`프로토타입에서는 상세가 샘플 ${P.length}개에만 있어요`);break}
  case'list':goList(v);break;
  case'say':say(v);break;
  case'proto':S.protoOpen=!S.protoOpen;S.keepTop=1;draw();break;
  case'month':S.month=!S.month;S.keepTop=1;draw();break;
  case'go':{setAct(v);S.spyHold=Date.now()+900;const t=document.getElementById('c-'+v);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});break}
  case'cscroll':{const w=el.closest('.cwrap'),row=w&&w.querySelector('.crow');if(row)row.scrollBy({left:Number(v)*Math.round(row.clientWidth*.6),behavior:'smooth'});break}
  case'fav':{const x=itemOf(v||S.pid);S.fav[x.id]=!S.fav[x.id];S.keepTop=1;draw();
   say(S.fav[x.id]?(labOf(x)==='표본 부족'?'후기가 30건 모이면 찜 탭에서 알려드릴게요':'찜했어요. 가격이 내리거나 한 달 써 본 후기가 늘면 찜 탭에서 알려드릴게요'):'찜을 풀었어요');break}
  case'cmp':{const x=itemOf(v||S.pid);if(S.cmp[x.id])delete S.cmp[x.id];else{const same=cmpList(x);
    if(same.length>=4){say(`${x.sub} 비교함은 4개까지 담을 수 있어요`);break}S.cmp[x.id]=1}
   S.keepTop=1;draw();say(S.cmp[x.id]?`${x.sub} 비교함에 담았어요`:'비교함에서 뺐어요');break}
  case'sheet':S.sheet=v;S.keepTop=1;draw();break;
  case'close':S.sheet=null;S.keepTop=1;draw();break;
  case'view':S.view=v;S.mega=null;S.act=null;S.crowXs={};S.resetTop=1;draw();break;
  case'mega':S.mega=S.mega===v?null:v;S.cq='';S.keepTop=1;draw();break;
  case'rmcmp':delete S.cmp[v];S.keepTop=1;draw();say('비교함에서 뺐어요');break;
  /* 목록: 정렬 · 기준 · 필터 */
  case'kcat':S.lsort=S.lsort==='cat:'+v?'default':'cat:'+v;S.keepTop=1;draw();break;
  case'lsort':S.lsort=v;S.sheet=null;S.keepTop=1;draw();break;
  case'fgood':S.f.good=!S.f.good;S.keepTop=1;draw();break;
  case'fbrand':S.f.brands=S.f.brands.includes(v)?S.f.brands.filter(b=>b!==v):[...S.f.brands,v];S.keepTop=1;draw();break;
  case'freset':S.f={good:false,pmin:null,pmax:null,brands:[]};S.keepTop=1;draw();break;
  /* 비교 */
  case'compare':S.screen='compare';S.csub=pickCsub(v||S.lastSub||null);S.sheet=null;S.mega=null;S.crowXs={};S.resetTop=1;draw();break;
  case'csub':S.csub=v;S.cpair=[];S.resetTop=1;draw();break;
  case'cpick':if(!S.cpair.includes(v)){S.cpair=[S.cpair[1],v].filter(Boolean)}S.keepTop=1;draw();break;
  case'cdiff':S.cdiff=!S.cdiff;S.keepTop=1;draw();break;
  /* 브랜드 */
  case'brand':if(!['brand','brands'].includes(S.screen))S.bPrev={screen:S.screen,pid:S.pid,lsub:S.lsub,csub:S.csub,storyK:S.storyK};S.bFromIdx=S.screen==='brands';S.brand=v;S.screen='brand';S.sheet=null;S.mega=null;S.sOpen=false;S.crowXs={};S.resetTop=1;draw();break;
  case'brands':if(!['brand','brands'].includes(S.screen))S.bPrev={screen:S.screen,pid:S.pid,lsub:S.lsub,csub:S.csub,storyK:S.storyK};S.screen='brands';S.sheet=null;S.mega=null;S.sOpen=false;S.resetTop=1;draw();break;
  case'brandback':if(S.screen==='brand'&&S.bFromIdx){S.screen='brands';S.bFromIdx=false}else{Object.assign(S,S.bPrev||{screen:'home'});S.bPrev=null}S.resetTop=1;draw();break;
  case'bjump':{const t=document.getElementById('bk-'+v);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});break}
  case'follow':S.follow[v]=!S.follow[v];S.keepTop=1;draw();say(S.follow[v]?(S.user?`${v}의 새 제품이 모이면 알려드릴게요`:`${v}의 새 제품이 모이면 찜 탭에서 알려드릴게요`):'알림을 껐어요');break;
  /* 이 이야기만 자세히 */
  case'story':S.storyK=v;S.screen='story';S.sheet=null;S.resetTop=1;draw();break;
  case'storyback':S.screen='detail';S.goAfter=S.storyK;S.act=S.storyK;S.resetTop=1;draw();break;
  /* 찜 */
  case'favs':S.screen='favs';S.sheet=null;S.mega=null;S.sOpen=false;S.crowXs={};S.resetTop=1;draw();break;
  case'login':S.user={ch:v};S.sheet=null;S.keepTop=1;draw();say('연결했어요. 찜한 제품이 달라지면 알려드릴게요');break;
  case'logout':S.user=null;S.sheet=null;S.keepTop=1;draw();say('연결을 끊었어요. 찜은 이 기기에 그대로 있어요');break;
  case'notipref':S.notiPref[v]=!S.notiPref[v];S.keepTop=1;draw();break;
  case'unreq':delete S.requested[v];S.keepTop=1;draw();say('요청을 취소했어요');break;
  case'favcmp':{const xs=favGroups().find(g=>g[0]===v)[1].filter(x=>!isThin(x)),now=cmpList({sub:v}).map(x=>x.id);
   xs.forEach(x=>{if(!S.cmp[x.id]&&Object.keys(S.cmp).filter(k=>itemOf(k).sub===v).length<4)S.cmp[x.id]=1});
   S.cpair=xs.slice(0,2).map(x=>x.id);S.screen='compare';S.csub=v;S.crowXs={};S.resetTop=1;draw();say('찜한 '+v+J(v,'을','를')+' 비교함에 담았어요');break}
  /* 검색 */
  case'search':if(v){submitSearch(v);break}
   if(S.view==='pc'){S.sOpen=true;S.mega=null;S.focusSearch=true;S.keepTop=1;draw();break}
   if(S.screen!=='search')S.sPrev={screen:S.screen,pid:S.pid,lsub:S.lsub,csub:S.csub};S.screen='search';S.q='';S.sqDone=false;S.sheet=null;S.focusSearch=true;S.resetTop=1;draw();break;
  case'sgo':submitSearch(v);break;
  case'sback':Object.assign(S,S.sPrev||{screen:'home'});S.sPrev=null;S.resetTop=1;draw();break;
  case'sclear':S.q='';S.sqDone=false;S.focusSearch=true;S.keepTop=1;draw();break;
  case'sdel':S.recentQ=S.recentQ.filter(x=>x!==v);S.keepTop=1;S.focusSearch=S.view==='pc';draw();break;
  case'sclr':S.recentQ=[];S.keepTop=1;S.focusSearch=S.view==='pc';draw();break;
  case'sreq':S.requested[v]=true;S.keepTop=1;draw();say('요청했어요. 후기가 모이면 찜 탭에서 알려드릴게요');break;
  /* 카테고리 메뉴 — PC 에서는 펼침 메뉴로 엶 */
  case'cats':case'catsx':openCats(v);if(S.view==='pc'){S.mega=S.cdom;S.keepTop=1;draw();break}
   S.prev=a==='catsx'?{screen:S.screen,pid:S.pid,lsub:S.lsub,csub:S.csub}:null;S.screen='cats';S.sheet=null;S.resetTop=1;draw();break;
  case'catclose':Object.assign(S,S.prev||{screen:'home'});S.prev=null;S.cq='';S.resetTop=1;draw();break;
  case'cdom':S.cdom=v;S.crTop=0;S.keepTop=1;draw();break;
  case'cjump':catJump(v,true);break;
  /* 홈 */
  case'home':if(S.screen==='home'&&!el.closest('.pfp')){const sc=document.getElementById('scr');if(S.view==='pc')window.scrollTo({top:0,behavior:'smooth'});else if(sc)sc.scrollTo({top:0,behavior:'smooth'});break}
   if(el.closest('.pfp'))Object.assign(S,{fav:{},recent:[],recentSubs:[],cmp:{},lastSub:null,entry:null,hdomSet:false,hrank:null,pOff:false});S.screen='home';S.sheet=null;S.mega=null;S.crowXs={};S.resetTop=1;draw();break;
  case'hdom':S.hdom=v;S.hdomSet=true;S.hrank=null;S.keepTop=1;draw();break;
  case'poff':S.pOff=!S.pOff;S.keepTop=1;draw();say(S.pOff?'맞춤을 껐어요. 모든 분께 같은 기준으로 보여드려요':'맞춤을 켰어요');break;
  case'reseed':SEED=Math.floor(Math.random()*2147483647);S.resetTop=1;draw();say('새로고침했어요');break;
  case'demoEntry':Object.assign(S,{fav:{},recent:[],recentSubs:[],cmp:{},lastSub:null,entry:{kw:'아기 젖병'},hdomSet:false,hrank:null,pOff:false,screen:'home',resetTop:1});draw();break;
  case'hrank':S.hrank=v;S.keepTop=1;draw();break;
  case'pair':{const ids=v.split(','),sub=itemOf(ids[0]).sub,now=cmpList({sub}).map(x=>x.id),add=ids.filter(id=>!now.includes(id));
   if(now.length+add.length>4){say(`${sub} 비교함 자리가 모자라요. 비교함에서 하나를 빼고 다시 눌러 주세요`);break}
   add.forEach(id=>S.cmp[id]=1);S.cpair=ids;S.screen='compare';S.csub=sub;S.crowXs={};S.resetTop=1;draw();say('둘 다 비교함에 담았어요');break}
  case'theme':{const [sub,k]=v.split(':');goList(sub);S.lsort='cat:'+k;S.keepTop=1;draw();break}
  case'demo1':Object.assign(S,{fav:{p1:true,m2:true,p3:true},recent:['p3','p1','p2'],recentSubs:['크림','프라이팬'],entry:null,hdomSet:false,hrank:null,pOff:false,screen:'home',resetTop:1});draw();break;
  case'demo0':S.cmp={};S.lastSub=null;S.screen='compare';S.csub=null;S.mega=null;S.resetTop=1;draw();break;
  case'demo':S.cmp={p1:1,m2:1,m12:1,p2:1};S.cpair=[];S.screen='compare';S.csub='프라이팬';S.crowXs={};S.resetTop=1;draw();break;
 }});
document.addEventListener('input',e=>{if(e.target.matches('.rng input'))rangeLive(e.target);else if(e.target.matches('[data-cq]'))catLive(e.target);else if(e.target.matches('[data-sq]'))searchLive(e.target)});
document.addEventListener('focusin',e=>{if(e.target.matches('.gsw [data-sq]')&&!S.sOpen){S.sOpen=true;S.mega=null;S.focusSearch=true;S.keepTop=1;draw()}});
document.addEventListener('change',e=>{if(e.target.matches('.rng input')){const [a,b,lo,hi]=rangeLive(e.target);
  S.f.pmin=a<=lo?null:a;S.f.pmax=b>=hi?null:b;S.keepTop=1;draw();return}
 const el=e.target.closest('[data-change]');if(!el)return;
 if(el.dataset.change==='lsort'){S.lsort=el.value;S.keepTop=1;draw()}});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-sq]')){
  if(e.key==='Enter'){e.preventDefault();submitSearch(e.target.value);return}
  if(e.key==='Escape'){if(e.target.value){e.target.value='';searchLive(e.target)}else if(S.sOpen){S.sOpen=false;S.keepTop=1;draw()}return}}
 if(e.key==='Escape'&&e.target.matches('[data-cq]')&&e.target.value){e.target.value='';catLive(e.target);return}
 if(e.key==='Escape'&&(S.mega||S.sheet)){S.mega=null;S.sheet=null;S.keepTop=1;draw()}});
window.addEventListener('resize',()=>{if(window.innerWidth<PCW&&S.view==='pc'){S.view='mo';draw()}else fitLeft()});
// 홈 검색창 예시 문구를 바꿔 가며 보여줌 (화면을 다시 그리지 않고 글자만 바꿈)
setInterval(()=>{S.phI++;document.querySelectorAll('[data-ph]').forEach(e=>e.textContent=`「${PH[S.phI%PH.length]}」`)},2800);
draw();
</script>
</body>
</html>
